<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#000000">
  <title>Vibeproof</title>
  <link rel="stylesheet" href="/styles.css">
  <script src="/app.js" defer></script>
</head>
<body>
  <div class="topline" id="topline" aria-hidden="true"></div>
  <div class="app">
    <aside class="sidebar">
      <a class="brand" href="#/" aria-label="Vibeproof home">
        <svg class="logo" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.5 4.5 5.4v5.8c0 4.7 3.2 8.9 7.5 10.3 4.3-1.4 7.5-5.6 7.5-10.3V5.4L12 2.5Z" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/><path d="m8.8 12.2 2.3 2.3 4.3-4.6" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <span>Vibeproof</span>
        <span class="version" id="version"></span>
      </a>

      <form id="scan-form" class="scan" autocomplete="off">
        <label for="target" class="eyebrow">New scan</label>
        <div class="field">
          <svg class="field-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5" fill="none" stroke="currentColor" stroke-width="1.7"/><path d="m16 16 4 4" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>
          <input id="target" name="target" placeholder="Repo link, folder or site URL" spellcheck="false" aria-describedby="detected">
          <kbd class="kbd" id="slash-hint" title="Press / to focus">/</kbd>
        </div>
        <div class="scan-foot">
          <p class="detected" id="detected" aria-live="polite"></p>
          <button type="submit" id="run-btn" class="btn btn-primary" aria-label="Run scan">
            <span class="spinner" aria-hidden="true"></span>
            <span class="label">Scan</span>
          </button>
        </div>
        <p class="form-error" id="form-error" role="alert" hidden></p>
      </form>

      <section class="verify" id="verify" hidden aria-live="polite">
        <h2 id="verify-title"></h2>
        <p class="muted">Publish this token on the site with either option, then check again.</p>
        <div class="option">
          <span class="eyebrow">File</span>
          <code id="verify-file"></code>
          <div class="copy-row"><code id="verify-token"></code><button type="button" class="btn btn-ghost btn-xs copy" data-copy="verify-token">Copy</button></div>
        </div>
        <div class="option">
          <span class="eyebrow">DNS TXT record</span>
          <div class="copy-row"><code id="verify-dns"></code><button type="button" class="btn btn-ghost btn-xs copy" data-copy="verify-dns">Copy</button></div>
        </div>
        <div class="verify-status" id="verify-status" hidden>
          <p id="verify-status-title"></p>
          <ul id="verify-checks"></ul>
        </div>
        <button type="button" class="btn btn-secondary btn-block" id="verify-again">Check again</button>
      </section>

      <section class="history-wrap" aria-labelledby="history-title">
        <div class="history-head">
          <h2 id="history-title" class="eyebrow">History</h2>
          <span class="count" id="history-count"></span>
        </div>
        <input id="history-filter" class="history-filter" type="search" placeholder="Search scans" aria-label="Search scan history" hidden>
        <nav id="history" class="history" aria-label="Scan history"></nav>
      </section>

      <footer class="side-foot">
        <span class="live-dot" aria-hidden="true"></span>
        Running on this computer only
      </footer>
    </aside>

    <main class="main" id="main">
      <section class="detail" id="detail" aria-live="polite"></section>
    </main>
  </div>

  <div class="toasts" id="toasts" aria-live="polite"></div>
</body>
</html>
