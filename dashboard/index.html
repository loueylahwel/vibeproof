<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Vibe Security Scanner</title>
  <link rel="stylesheet" href="/styles.css">
  <script src="/app.js" defer></script>
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <svg class="logo" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2 4 5v6c0 5 3.4 9.4 8 11 4.6-1.6 8-6 8-11V5l-8-3Z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><path d="m8.5 12 2.5 2.5 4.5-5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <div>
        <h1>Vibe Security Scanner</h1>
        <p class="muted">Secrets, database access rules and client-side exposure in vibe-coded apps</p>
      </div>
    </div>
    <span class="chip" id="local-chip" title="The dashboard only listens on this computer">Local only</span>
  </header>

  <main class="layout">
    <aside class="sidebar">
      <section class="card">
        <h2>New scan</h2>
        <div class="tabs" role="tablist">
          <button type="button" role="tab" class="tab active" data-track="repo" aria-selected="true">Repository</button>
          <button type="button" role="tab" class="tab" data-track="web" aria-selected="false">Live web app</button>
        </div>

        <form id="scan-form" autocomplete="off">
          <div class="track-fields" data-for="repo">
            <label for="repo-path">Repository path on this computer</label>
            <input id="repo-path" name="repoPath" placeholder="~/Documents/our-app" spellcheck="false">
            <label class="check"><input type="checkbox" name="history" checked> Scan full git history</label>
            <label class="check"><input type="checkbox" name="npmAudit"> Run npm audit (needs internet)</label>
            <p class="hint">Static analysis only. No code from the repository is run.</p>
          </div>

          <div class="track-fields" data-for="web" hidden>
            <label for="web-url">App URL</label>
            <input id="web-url" name="url" type="url" placeholder="https://our-app.vercel.app" spellcheck="false">
            <label for="sb-url">Supabase URL <span class="muted">(optional, if not auto-detected)</span></label>
            <input id="sb-url" name="supabaseUrl" type="url" placeholder="https://xxxx.supabase.co" spellcheck="false">
            <label class="check consent"><input type="checkbox" name="authorized"> I own this app, or its owner gave written permission to test it.</label>
            <p class="hint">Read-only: GET requests only, one row per table, row values are never stored.</p>
          </div>

          <button type="submit" class="primary" id="run-btn">
            <span class="spinner" aria-hidden="true"></span>
            <span class="label">Run scan</span>
          </button>
          <p class="form-error" id="form-error" role="alert" hidden></p>
        </form>
      </section>

      <section class="card history-card">
        <div class="card-head">
          <h2>Scan history</h2>
          <span class="muted small" id="history-count"></span>
        </div>
        <ul id="history" class="history"></ul>
      </section>
    </aside>

    <section class="content" id="detail" aria-live="polite"></section>
  </main>

  <template id="empty-state">
    <div class="empty">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2 4 5v6c0 5 3.4 9.4 8 11 4.6-1.6 8-6 8-11V5l-8-3Z" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/></svg>
      <h2>No scan selected</h2>
      <p class="muted">Run a scan on one of your repositories or deployed apps, or pick one from the history.</p>
    </div>
  </template>
</body>
</html>
