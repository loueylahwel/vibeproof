<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#000000">
  <title>Vibe Security Scanner</title>
  <link rel="stylesheet" href="/styles.css">
  <script src="/app.js" defer></script>
</head>
<body>
  <header class="topbar">
    <svg class="logo" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2 4 5v6c0 5 3.4 9.4 8 11 4.6-1.6 8-6 8-11V5l-8-3Z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>
    <h1>Vibe Security Scanner</h1>
  </header>

  <main class="layout">
    <aside class="sidebar">
      <form id="scan-form" autocomplete="off">
        <div class="field">
          <input id="target" name="target" placeholder="Repository path or URL" spellcheck="false" aria-label="Repository path or URL">
          <button type="submit" id="run-btn" aria-label="Run scan">
            <span class="spinner" aria-hidden="true"></span>
            <span class="label">Scan</span>
          </button>
        </div>
        <p class="detected" id="detected" aria-live="polite"></p>
        <p class="form-error" id="form-error" role="alert" hidden></p>
      </form>

      <section class="verify" id="verify" hidden>
        <h2 id="verify-title"></h2>
        <p class="muted">Publish this token on the site with either option, then check again.</p>
        <div class="option">
          <span class="opt-label">File</span>
          <code id="verify-file"></code>
          <div class="copy-row"><code id="verify-token"></code><button type="button" class="copy" data-copy="verify-token">Copy</button></div>
        </div>
        <div class="option">
          <span class="opt-label">DNS TXT</span>
          <div class="copy-row"><code id="verify-dns"></code><button type="button" class="copy" data-copy="verify-dns">Copy</button></div>
        </div>
        <button type="button" class="ghost" id="verify-again">Check again</button>
      </section>

      <section class="history-wrap">
        <h2>History</h2>
        <ul id="history" class="history"></ul>
      </section>
    </aside>

    <section class="content" id="detail" aria-live="polite"></section>
  </main>

  <template id="empty-state">
    <div class="empty">
      <p>Enter a repository path or a URL to start.</p>
      <p class="muted">Web scans run only on domains you have verified, or on localhost.</p>
    </div>
  </template>
</body>
</html>
