<!doctype html>
<html lang="en" data-resolution="landscape">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
      :root {
        --paper: #ffffff;
        --ink: #0a0a0a;
        --muted: #6b6b6b;
        --flaw: #e5342f;
        --font-display: "Inter", sans-serif;
        --font-code: "JetBrains Mono", monospace;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: var(--paper);
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        font-family: var(--font-display);
      }
    </style>
  </head>
  <body>
    <!-- Vibeproof explainer, storyline B "Two ways in". See SPEC.md. -->
    <div id="root" data-composition-id="main" data-start="0" data-duration="222" data-width="1920" data-height="1080">
      <div id="hook" data-composition-id="hook" data-composition-src="compositions/hook.html" data-start="0" data-duration="12" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080"></div>
      <div id="stack" data-composition-id="stack" data-composition-src="compositions/stack.html" data-start="12" data-duration="18" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080"></div>
      <div id="code" data-composition-id="code" data-composition-src="compositions/code.html" data-start="30" data-duration="26" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080"></div>
      <div id="site" data-composition-id="site" data-composition-src="compositions/site.html" data-start="56" data-duration="26" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080"></div>
      <div id="blind" data-composition-id="blind" data-composition-src="compositions/blind.html" data-start="82" data-duration="18" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080"></div>
      <div id="repodemo" data-composition-id="repodemo" data-composition-src="compositions/repodemo.html" data-start="100" data-duration="32" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080"></div>
      <div id="webdemo" data-composition-id="webdemo" data-composition-src="compositions/webdemo.html" data-start="132" data-duration="32" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080"></div>
      <div id="safety" data-composition-id="safety" data-composition-src="compositions/safety.html" data-start="164" data-duration="16" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080"></div>
      <div id="results" data-composition-id="results" data-composition-src="compositions/results.html" data-start="180" data-duration="30" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080"></div>
      <div id="end" data-composition-id="end" data-composition-src="compositions/end.html" data-start="210" data-duration="12" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080"></div>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true });
    </script>
  </body>
</html>
