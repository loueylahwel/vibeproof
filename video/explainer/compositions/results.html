  <script>
    (function () {
      const tl = gsap.timeline({ paused: true });
      const F = 1 / 30;
      const DUR = 30;
      const OPEN = "inset(-25% -2% -25% -2%)";
      const SHUT = "inset(-25% 100% -25% -2%)";

      // ---- camera: velocity-matched cut in, slow push, beat re-targets, cut out
      tl.fromTo("#results-cam", { x: 420 }, { x: 0, duration: 12 * F, ease: "power4.out" }, 0);
      tl.fromTo("#results-cam", { scale: 1 }, { scale: 1.06, duration: DUR, ease: "sine.inOut" }, 0);
      tl.fromTo(
        "#results-cam",
        { x: 0 },
        { x: -420, duration: 10 * F, ease: "power4.in", immediateRender: false },
        DUR - 10 * F,
      );
      let rx = 0;
      let ry = 0;
      let rs = 1;
      const aim = (x, y, s, at, dur, ease) => {
        tl.fromTo(
          "#results-rig",
          { x: rx, y: ry, scale: rs },
          { x: x, y: y, scale: s, duration: dur || 20 * F, ease: ease || "power2.inOut", immediateRender: false },
          at,
        );
        rx = x;
        ry = y;
        rs = s;
      };

      // ---- kinetic type
      const wordsIn = (line, at) =>
        tl.fromTo(
          line + " > .results-w",
          { yPercent: 110 },
          { yPercent: 0, duration: 14 * F, ease: "power4.out", stagger: 2 * F },
          at,
        );
      const wordsOut = (line, at) =>
        tl.fromTo(
          line + " > .results-w",
          { yPercent: 0 },
          { yPercent: -110, duration: 8 * F, ease: "power2.in", stagger: 1 * F, immediateRender: false },
          at,
        );
      const marker = (line, at) => {
        tl.fromTo(line + " .results-mk", { scaleX: 0 }, { scaleX: 1, duration: 10 * F, ease: "power3.out" }, at);
        tl.fromTo(
          line + " .results-mt",
          { color: "#0a0a0a" },
          { color: "#ffffff", duration: 4 * F, ease: "none" },
          at + 2 * F,
        );
      };

      // ---- one bar: label rises, track draws, number pops; the fill grows (power3.out)
      // while the number counts with it (integers only), and the number punches on landing
      const bar = (id, value, at) => {
        const n = document.getElementById(id + "-n");
        const GROW = 30 * F;
        wordsIn("#" + id + "-lab", at);
        tl.fromTo(
          "#" + id + "-trk",
          { clipPath: SHUT },
          { clipPath: OPEN, duration: 18 * F, ease: "power3.out" },
          at,
        );
        tl.fromTo("#" + id + "-num", { opacity: 0 }, { opacity: 1, duration: 4 * F, ease: "none" }, at + 4 * F);
        tl.fromTo(
          "#" + id + "-num",
          { scale: 0.9 },
          { scale: 1, duration: 16 * F, ease: "back.out(1.7)" },
          at + 4 * F,
        );
        tl.fromTo(
          "#" + id + "-fill",
          { clipPath: "inset(0% 100% 0% 0%)" },
          {
            clipPath: "inset(0% 0% 0% 0%)",
            duration: GROW,
            ease: "power3.out",
            onUpdate: function () {
              n.textContent = String(Math.round(this.ratio * value));
            },
          },
          at + 0.3,
        );
        tl.fromTo(
          "#" + id + "-n",
          { scale: 1.18 },
          { scale: 1, duration: 8 * F, ease: "power2.out", immediateRender: false },
          at + 0.3 + GROW,
        );
      };

      // rows leave upward through their own mask
      const rowsOut = (sels, at) =>
        sels.forEach((s, i) => {
          tl.fromTo(
            s,
            { clipPath: "inset(-40% -4% -40% -4%)", y: 0 },
            {
              clipPath: "inset(-40% -4% 140% -4%)",
              y: -28,
              duration: 10 * F,
              ease: "power2.in",
              immediateRender: false,
            },
            at + i * 2 * F,
          );
        });

      // 0.0 the question line
      wordsIn("#results-l1t", 0);
      aim(30, 30, 1, 1.6, 30 * F);

      // 4.0 development set, one bar at a time (numbers land at 5.3, 7.8, 10.3)
      aim(0, 0, 1, 4.0);
      wordsIn("#results-s1name", 4.0);
      bar("results-r1", 24, 4.0);
      aim(0, -30, 1, 6.5);
      bar("results-r2", 19, 6.5);
      bar("results-r3", 33, 9.0);
      // the camera pushes in on the Both row as it lands
      aim(0, -10, 1.04, 9.3, 30 * F, "power3.out");
      aim(20, 20, 1.01, 11.8, 30 * F);
      wordsOut("#results-l1t", 13.55);

      // 14.0 each side found what the other could not
      wordsIn("#results-l2t", 14.0);
      aim(20, 0, 1, 14.0);
      marker("#results-l2t", 14.7);
      aim(40, 20, 1, 16.0, 30 * F);
      wordsOut("#results-l2t", 17.55);

      // 18.0 held-out set (numbers land at 19.6, 20.8, 22.0)
      wordsIn("#results-l3t", 18.0);
      aim(0, -20, 1, 18.0, 24 * F);
      wordsIn("#results-s2name", 18.0);
      bar("results-q1", 11, 18.3);
      marker("#results-l3t", 18.8);
      bar("results-q2", 6, 19.5);
      bar("results-q3", 12, 20.7);
      aim(10, -24, 1.02, 21.0, 30 * F, "power3.out");

      // 23.2 clear the bars
      rowsOut(
        [
          "#results-s1name",
          "#results-r1",
          "#results-r2",
          "#results-r3",
          "#results-s2name",
          "#results-q1",
          "#results-q2",
          "#results-q3",
        ],
        23.2,
      );
      aim(0, 10, 1, 23.3, 24 * F);

      // 23.7 the two halves pop in apart, slide together and join at 25.0
      ["#results-halfL", "#results-halfR"].forEach((h) => {
        tl.fromTo(h, { opacity: 0 }, { opacity: 1, duration: 5 * F, ease: "none" }, 23.7);
        tl.fromTo(h, { scale: 0.9 }, { scale: 1, duration: 16 * F, ease: "back.out(1.7)" }, 23.7);
      });
      tl.fromTo("#results-halfL", { x: -140 }, { x: 0, duration: 24 * F, ease: "power2.inOut" }, 25.0 - 24 * F);
      tl.fromTo("#results-halfR", { x: 140 }, { x: 0, duration: 24 * F, ease: "power2.inOut" }, 25.0 - 24 * F);
      tl.fromTo("#results-seamR", { opacity: 1 }, { opacity: 0, duration: 4 * F, ease: "power2.out" }, 25.0);
      // the join lands: one shape, it settles
      tl.fromTo(
        "#results-joined",
        { scale: 1.04 },
        { scale: 1, duration: 10 * F, ease: "power4.out", immediateRender: false },
        25.0,
      );
      aim(30, 24, 1.02, 25.0, 30 * F);
      aim(50, 36, 1.03, 26.6, 40 * F);
      aim(70, 20, 1.03, 28.3, 40 * F);

      tl.set({}, {}, DUR);
      window.__timelines["results"] = tl;
    })();
  </script>
