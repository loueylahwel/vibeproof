  <script>
    (function () {
      const tl = gsap.timeline({ paused: true });
      const F = 1 / 30;
      const SHUT = "inset(-25% 100% -25% -2%)";
      const OPEN = "inset(-25% -2% -25% -2%)";
      const GONE = "inset(-25% -2% -25% 100%)";

      const wipeIn = (sel, at, dur) =>
        tl.fromTo(sel, { clipPath: SHUT }, { clipPath: OPEN, duration: dur || 18 * F, ease: "power3.out" }, at);
      const wipeOut = (sel, at) =>
        tl.fromTo(
          sel,
          { clipPath: OPEN },
          { clipPath: GONE, duration: 12 * F, ease: "power2.in", immediateRender: false },
          at,
        );

      // one bar: label + track wipe in, then the fill grows while the number counts
      // (30 frames, power1.out, integers only; the text is a function of the tween's eased progress)
      const bar = (id, value, at) => {
        const n = document.getElementById(id + "-n");
        wipeIn("#" + id + "-lab", at);
        wipeIn("#" + id + "-trk", at);
        wipeIn("#" + id + "-num", at + 4 * F);
        tl.fromTo(
          "#" + id + "-fill",
          { clipPath: "inset(0% 100% 0% 0%)" },
          {
            clipPath: "inset(0% 0% 0% 0%)",
            duration: 30 * F,
            ease: "power1.out",
            onUpdate: function () {
              n.textContent = String(Math.round(this.ratio * value));
            },
          },
          at + 0.3,
        );
      };

      // lines
      wipeIn("#results-l1t", 0);
      wipeOut("#results-l1t", 13.55);
      wipeIn("#results-l2t", 14.0);
      wipeOut("#results-l2t", 17.55);
      wipeIn("#results-l3t", 18.0);

      // development set, one bar at a time (numbers land at 5.3, 7.8, 10.3)
      wipeIn("#results-s1name", 4.0);
      bar("results-r1", 24, 4.0);
      bar("results-r2", 19, 6.5);
      bar("results-r3", 33, 9.0);

      // held-out set (numbers land at 19.6, 20.8, 22.0)
      wipeIn("#results-s2name", 18.0);
      bar("results-q1", 11, 18.3);
      bar("results-q2", 6, 19.5);
      bar("results-q3", 12, 20.7);

      // clear the bars
      wipeOut("#results-set1-in", 23.2);
      wipeOut("#results-set2-in", 23.2);

      // the two halves appear apart, then slide together and join at 25.0
      wipeIn("#results-halfL", 23.7, 12 * F);
      wipeIn("#results-halfR", 23.7, 12 * F);
      tl.fromTo("#results-halfL", { x: -140 }, { x: 0, duration: 24 * F, ease: "power2.inOut" }, 25.0 - 24 * F);
      tl.fromTo("#results-halfR", { x: 140 }, { x: 0, duration: 24 * F, ease: "power2.inOut" }, 25.0 - 24 * F);
      tl.fromTo(
        ["#results-seamL", "#results-seamR"],
        { opacity: 1 },
        { opacity: 0, duration: 4 * F, ease: "power2.out" },
        25.0,
      );

      tl.set({}, {}, 30);
      window.__timelines["results"] = tl;
    })();
  </script>
