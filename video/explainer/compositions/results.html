      // ---- shared world: ground grid scroll + dust from FILM time (continuous across cuts)
      (function world(tl, id, FILM_START, DUR) {
        let s = 20261122;
        const rnd = () => { s |= 0; s = (s + 0x6d2b79f5) | 0; let t = Math.imul(s ^ (s >>> 15), 1 | s);
          t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
        const box = document.getElementById(id + "-dust");
        const dots = [];
        for (let k = 0; k < 54; k++) {
          const d = { x: rnd() * 1920, y: rnd() * 1180, z: 0.3 + rnd() * 0.7, ph: rnd() * 6.283 };
          const el = document.createElement("i");
          const size = 1 + d.z * 2;

          box.appendChild(el); d.el = el; dots.push(d);
        }
        const floor = document.getElementById(id + "-floor");
        const draw = (T) => {
          if (floor) floor.style.backgroundPosition = "0px " + ((T * 40) % 80) + "px";
          for (const d of dots) {
            const y = ((d.y - T * 14 * d.z) % 1180 + 1180) % 1180 - 50;
            const x = d.x + Math.sin(T * 0.35 + d.ph) * 18 * d.z;
            d.el.style.transform = "translate(" + x.toFixed(1) + "px," + y.toFixed(1) + "px)";
          }
        };
        const p = { t: 0 };
        tl.fromTo(p, { t: 0 }, { t: DUR, duration: DUR, ease: "none", onUpdate: () => draw(FILM_START + p.t) }, 0);
        draw(FILM_START);
      })(tl, "results", FILM_START, DUR);

        { set: 2, id: "q1", label: "Code only", value: 11, total: 12, top: 656, track: 600 },
        { set: 2, id: "q2", label: "Site only", value: 6, total: 12, top: 716, track: 600 },

          '<span id="results-' + r.id + '-n" class="results-n">0</span><span class="results-d">/' + r.total + "</span></div></div>";
        document.getElementById("results-set" + r.set).appendChild(row);
        r.w = (r.track * r.value) / r.total;
      }
      const ROW = Object.fromEntries(ROWS.map((r) => [r.id, r]));
      // "found what the other could not": hatched overlays on the parts only one side found
      // (code covers flaws 1..24, site covers 15..33 after it slides; 24 + 19 - 33 = 10 overlap)
      const only1 = document.createElement("div");
      only1.className = "results-only"; only1.id = "results-only1";
      only1.style.left = "0px"; only1.style.width = (1200 * 14) / 33 + "px";

      const only2 = document.createElement("div");
      only2.className = "results-only"; only2.id = "results-only2";

      // ---- transitions: in (scale 0.94 -> 1, fade 6 f), out (scale -> 1.15, fade, green scan line)
      tl.fromTo(P + "-fx", { scale: 0.94 }, { scale: 1, duration: 16 * F, ease: "expo.out" }, 0);
      tl.fromTo(P + "-fx", { opacity: 0 }, { opacity: 1, duration: 6 * F, ease: "power2.out" }, 0);
      tl.fromTo(P + "-fx", { scale: 1 }, { scale: 1.15, duration: 12 * F, ease: "power2.in", immediateRender: false }, DUR - 12 * F);
      tl.fromTo(P + "-fx", { opacity: 1 }, { opacity: 0, duration: 6 * F, ease: "power2.in", immediateRender: false }, DUR - 6 * F);
      tl.fromTo(P + "-wipe", { y: -122 }, { y: 1080, duration: 8 * F, ease: "power1.in" }, DUR - 8 * F);

      // ---- HUD: types 1 char per frame, block cursor blinks on the beat, gone after 2 s
      (function hud(text) {
        const t = document.querySelector(P + "-hud-t");
        const c = document.querySelector(P + "-hud-c");
        const p = { t: 0 };
        const draw = () => {
          const f = Math.floor(p.t * 30 + 1e-4);
          t.textContent = text.slice(0, Math.min(text.length, f));
          c.style.opacity = p.t < 2 && f % 15 < 8 ? 1 : 0;
        };
        tl.fromTo(p, { t: 0 }, { t: 3, duration: 3, ease: "none", onUpdate: draw }, 0);
        draw();
      })("09 / Results");

      // ---- camera: slow push + beat re-targets (with a little zoom)
      tl.fromTo(P + "-cam", { scale: 1 }, { scale: 1.05, duration: DUR, ease: "sine.inOut" }, 0);
      let rx = 0, ry = 150, rs = 1;
      gsap.set(P + "-rig", { y: 150 });
      const aim = (x, y, s, at, dur, ease) => {
        tl.fromTo(P + "-rig", { x: rx, y: ry, scale: rs }, { x: x, y: y, scale: s, duration: dur || 24 * F, ease: ease || "power2.inOut", immediateRender: false }, at);
        rx = x; ry = y; rs = s;
      };

      // ---- kinetic type
      const wordsIn = (sel, t) =>
        tl.fromTo(sel + " .results-w", { yPercent: 115 }, { yPercent: 0, duration: 14 * F, ease: "power4.out", stagger: 2 * F }, t);
      const wordsOut = (sel, end) => {
        const n = document.querySelectorAll(sel + " .results-w").length;
        tl.fromTo(sel + " .results-w", { yPercent: 0 }, { yPercent: -115, duration: 8 * F, ease: "power2.in", stagger: F, immediateRender: false }, end - (8 + n - 1) * F);
      };

        tl.fromTo(sel, { color: "#eaf2f7", textShadow: "0 0 18px rgba(61,255,162,0)" },

        tl.fromTo(sel + " .results-ul", { scaleX: 0 }, { scaleX: 1, duration: 10 * F, ease: "power3.out" }, t);
      };
      const rise = (sel, t) => tl.fromTo(sel, { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 16 * F, ease: "expo.out" }, t);

      // ---- one bar: label + track on the beat, the fill grows from the next beat and lands on a beat,
      // the number counts with it (integers only) and punches on landing
      const bar = (id, at, grow) => {
        const r = ROW[id];
        const n = document.getElementById("results-" + id + "-n");
        const B = P + "-" + id;
        wordsIn(B + "-lab", at);
        tl.fromTo(B + "-trk", { clipPath: "inset(0% 100% 0% 0% round 10px)" }, { clipPath: "inset(0% 0% 0% 0% round 10px)", duration: 16 * F, ease: "expo.out" }, at);
        tl.fromTo(B + "-num", { opacity: 0 }, { opacity: 1, duration: 6 * F, ease: "power2.out" }, at);
        const land = at + 0.5 + grow;
        tl.fromTo(B + "-fill", { opacity: 0 }, { opacity: 1, duration: 2 * F, ease: "none" }, at + 0.5);
        tl.fromTo(B + "-fill", { width: 0 }, {
          width: r.w, duration: grow, ease: "power3.out",
          onUpdate: function () { n.textContent = String(Math.round(this.ratio * r.value)); },
        }, at + 0.5);
        tl.fromTo(B + "-num", { scale: 1.18 }, { scale: 1, duration: 8 * F, ease: "power2.out", immediateRender: false }, land);
        if (r.both) {
          tl.fromTo(B + "-fill", { boxShadow: GLOW_HI }, { boxShadow: GLOW, duration: 24 * F, ease: "power2.out", immediateRender: false }, land);
        }
        return land;
      };

      // 0.0 the question line
      wordsIn(P + "-l1", 0);
      aim(-10, 140, 1, 1.0, 40 * F);
      aim(4, 132, 1, 2.5, 30 * F);

      // 4.0 development set, one bar at a time: lands 5.5 (24), 7.5 (19), 10.0 (33, on the bar)
      rise(P + "-s1name", 4.0);
      aim(0, 96, 1, 4.0, 30 * F);
      bar("r1", 4.0, 1.0);
      aim(10, 90, 1, 6.0);
      bar("r2", 6.0, 1.0);
      aim(0, 84, 1, 8.0);
      bar("r3", 8.0, 1.5);
      // the Both row lands: the camera leans in
      aim(-10, 72, 1.03, 10.0, 30 * F, "power3.out");
      aim(10, 84, 1.01, 11.5, 30 * F);
      tl.fromTo(P + "-r3-fill", { boxShadow: GLOW_HI }, { boxShadow: GLOW, duration: 24 * F, ease: "power2.out", immediateRender: false }, 12.0);
      aim(0, 92, 1, 13.0, 30 * F);
      wordsOut(P + "-l1", 14.0);

      // 14.0 each side found what the other could not: the site bar slides to its own flaws
      wordsIn(P + "-l2", 14.0);
      marker(P + "-mk-other", 14.5);
      tl.fromTo(P + "-r2-fill", { x: 0 }, { x: (1200 * 14) / 33, duration: 1.0, ease: "power3.inOut" }, 14.5);
      tl.fromTo([P + "-only1", P + "-only2"], { opacity: 0 }, { opacity: 1, duration: 12 * F, ease: "power2.out" }, 16.0);
      aim(-16, 84, 1.015, 14.5, 30 * F);
      aim(0, 78, 1.01, 16.5, 30 * F);
      wordsOut(P + "-l2", 18.0);

      // 18.0 held-out set: lands 19.5 (11), 20.5 (6), 22.0 (12, on the bar)
      wordsIn(P + "-l3", 18.0);
      marker(P + "-mk-both", 18.5);
      tl.fromTo([P + "-only1", P + "-only2"], { opacity: 1 }, { opacity: 0, duration: 10 * F, ease: "power2.inOut", immediateRender: false }, 18.0);
      rise(P + "-s2name", 18.0);
      aim(0, 4, 1, 18.0, 30 * F);
      bar("q1", 18.5, 0.5);
      bar("q2", 19.5, 0.5);
      bar("q3", 20.5, 1.0);
      aim(-10, -4, 1.02, 22.0, 30 * F, "power3.out");

      // 23.0 the bars leave upward, row by row
      ["-s1name", "-r1", "-r2", "-r3", "-s2name", "-q1", "-q2", "-q3"].forEach((s, i) => {
        tl.fromTo(P + s, { opacity: 1, y: 0 }, { opacity: 0, y: -30, duration: 10 * F, ease: "power3.in", immediateRender: false }, 23.0 + i * F);
      });
      aim(0, 0, 1, 23.0, 30 * F);

      // 23.5 the two halves arrive apart and tilted ...
      tl.fromTo([P + "-halfL", P + "-halfR"], { opacity: 0 }, { opacity: 1, duration: 8 * F, ease: "power2.out" }, 23.5);
      tl.fromTo(P + "-halfL", { x: -260, rotationY: 30 }, { x: -200, rotationY: 22, duration: 15 * F, ease: "expo.out" }, 23.5);
      tl.fromTo(P + "-halfR", { x: 260, rotationY: -30 }, { x: 200, rotationY: -22, duration: 15 * F, ease: "expo.out" }, 23.5);
      wordsIn(P + "-underL", 23.5);
      wordsIn(P + "-underR", 23.5);
      tl.fromTo(P + "-underL", { x: -200 }, { x: 0, duration: 1.0, ease: "power3.in" }, 24.0);
      tl.fromTo(P + "-underR", { x: 200 }, { x: 0, duration: 1.0, ease: "power3.in" }, 24.0);
      // ... and close into one shape exactly on 25.0 (the drop)
      tl.fromTo(P + "-halfL", { x: -200, rotationY: 22 }, { x: 0, rotationY: 0, duration: 1.0, ease: "power3.in", immediateRender: false }, 24.0);
      tl.fromTo(P + "-halfR", { x: 200, rotationY: -22 }, { x: 0, rotationY: 0, duration: 1.0, ease: "power3.in", immediateRender: false }, 24.0);
      tl.fromTo(P + "-halfL", { borderRightColor: "rgba(61,255,162,1)" }, { borderRightColor: "rgba(61,255,162,0)", duration: 14 * F, ease: "power2.out" }, 25.0);
      tl.fromTo(P + "-halfR", { borderLeftColor: "rgba(61,255,162,1)" }, { borderLeftColor: "rgba(61,255,162,0)", duration: 14 * F, ease: "power2.out" }, 25.0);
      tl.fromTo(P + "-rim", { opacity: 0 }, { opacity: 1, duration: 2 * F, ease: "none" }, 25.0);
      tl.fromTo(P + "-bloom", { opacity: 0 }, { opacity: 1, duration: 3 * F, ease: "power2.out" }, 25.0);
      tl.fromTo(P + "-bloom", { opacity: 1 }, { opacity: 0.35, duration: 1.5, ease: "power2.out", immediateRender: false }, 25.0 + 3 * F);
      tl.fromTo(P + "-join", { scale: 1.045, transformOrigin: "960px 550px" }, { scale: 1, duration: 14 * F, ease: "power4.out", immediateRender: false }, 25.0);
      tl.fromTo(P + "-sheen i", { xPercent: -130, skewX: -15 }, { xPercent: 360, skewX: -15, duration: 18 * F, ease: "power2.inOut" }, 25.0);
      aim(0, 0, 1.02, 25.0, 30 * F, "power3.out");
      // 26.0 the one shape is read top to bottom; glow breathes on the bars
      tl.fromTo(P + "-jscan", { y: -40 }, { y: 460, duration: 1.5, ease: "sine.inOut" }, 26.0);
      tl.fromTo(P + "-jscan", { opacity: 0 }, { opacity: 1, duration: 4 * F, ease: "none" }, 26.0);
      tl.fromTo(P + "-jscan", { opacity: 1 }, { opacity: 0, duration: 6 * F, ease: "power2.in", immediateRender: false }, 27.3);
      aim(12, -4, 1.03, 27.0, 40 * F);
      tl.fromTo(P + "-bloom", { opacity: 0.6 }, { opacity: 0.35, duration: 24 * F, ease: "power2.out", immediateRender: false }, 28.0);
      aim(-4, -8, 1.035, 28.5, 36 * F);

      tl.set({}, {}, DUR);
      window.__timelines = window.__timelines || {};
      window.__timelines["results"] = tl;
    })();
  </script>
</template>
