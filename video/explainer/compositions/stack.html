  <script>
    (function () {
      const tl = gsap.timeline({ paused: true });
      const F = 1 / 30;
      const DUR = 18;
      const FILM_START = 12;

      // ---- shared world
      (function world(tl, id, FILM_START, DUR) {
        let s = 20261122;
        const rnd = () => { s |= 0; s = (s + 0x6d2b79f5) | 0; let t = Math.imul(s ^ (s >>> 15), 1 | s);
          t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
        const box = document.getElementById(id + "-dust");
        const dots = [];
        for (let k = 0; k < 54; k++) {
          const d = { x: rnd() * 1920, y: rnd() * 1180, z: 0.3 + rnd() * 0.7, ph: rnd() * 6.283 };
          const el = document.createElement("i");
          const size = 1 + d.z * 2;
          el.style.width = el.style.height = size + "px";
          el.style.opacity = (0.12 + d.z * 0.23).toFixed(3);
          box.appendChild(el); d.el = el; dots.push(d);
        }
        const floor = document.getElementById(id + "-floor");
        const draw = (T) => {
          if (floor) floor.style.backgroundPosition = "0px " + ((T * 40) % 80) + "px";
          for (const d of dots) {
            const y = ((d.y - T * 14 * d.z) % 1180 + 1180) % 1180 - 50;
            const x = d.x + Math.sin(T * 0.35 + d.ph) * 18 * d.z;
            d.el.style.transform = "translate(" + x.toFixed(1) + "px," + y.toFixed(1) + "px)";
          }
        };
        const p = { t: 0 };
        tl.fromTo(p, { t: 0 }, { t: DUR, duration: DUR, ease: "none", onUpdate: () => draw(FILM_START + p.t) }, 0);
        draw(FILM_START);
      })(tl, "stack", FILM_START, DUR);

      // ---- per-frame: HUD typing + flowing dashes on the link
      (function ticker() {
        const text = "02 / HOW THESE APPS WORK";
        const te = document.getElementById("stack-hudt");
        const ce = document.getElementById("stack-hudc");
        const flow = document.getElementById("stack-link-flow");
        const t0 = 0.5;
        const draw = (t) => {
          const f = Math.floor((t - t0) / F + 1e-4);
          te.textContent = text.slice(0, Math.max(0, Math.min(text.length, f + 1)));
          const on = t >= t0 && t < t0 + 2 && Math.floor((t - t0) / (15 * F) + 1e-4) % 2 === 0;
          ce.style.opacity = on ? "1" : "0";
          // traffic flows browser <-> database: toward the browser once the data leaks (faster)
          const off = t < 12.5 ? t * 32 : 12.5 * 32 - (t - 12.5) * 90;
          flow.setAttribute("stroke-dashoffset", (-off).toFixed(2));
        };
        const p = { t: 0 };
        tl.fromTo(p, { t: 0 }, { t: DUR, duration: DUR, ease: "none", onUpdate: () => draw(p.t) }, 0);
        draw(0);
      })();

      // ---- kinetic type
      function lineIn(sel, t) {
        tl.fromTo(sel + " > .stack-w", { yPercent: 120 }, { yPercent: 0, duration: 14 * F, ease: "power4.out", stagger: 2 * F }, t);
      }
      function lineOut(sel, end) {
        const n = document.querySelectorAll(sel + " > .stack-w").length;
        tl.fromTo(sel + " > .stack-w", { yPercent: 0 }, { yPercent: -120, duration: 8 * F, ease: "power2.in", stagger: F, immediateRender: false }, end - (8 + n) * F);
      }
      function mark(sel, t, hex, rgb) {
        tl.fromTo(sel, { color: "#eaf2f7", textShadow: "0 0 18px rgba(" + rgb + ",0)" },
          { color: hex, textShadow: "0 0 18px rgba(" + rgb + ",0.6)", duration: 8 * F, ease: "power2.out" }, t);
        tl.fromTo(sel + " .stack-ul", { scaleX: 0 }, { scaleX: 1, duration: 10 * F, ease: "power3.out" }, t);
      }
      function recoil(sel, t, dx, dy) {
        tl.fromTo(sel, { x: 0, y: 0 }, { x: dx, y: dy, duration: 2 * F, ease: "power2.out", immediateRender: false }, t);
        tl.fromTo(sel, { x: dx, y: dy }, { x: 0, y: 0, duration: 10 * F, ease: "power2.out", immediateRender: false }, t + 2 * F);
      }

      // ---- camera
      tl.fromTo("#stack-rig", { scale: 1 }, { scale: 1.05, duration: DUR, ease: "sine.inOut" }, 0);
      let cx = 0, cy = 0;
      function cam(t, x, y, d) {
        tl.fromTo("#stack-rig", { x: cx, y: cy }, { x: x, y: y, duration: (d || 24) * F, ease: "power2.inOut", immediateRender: false }, t);
        cx = x; cy = y;
      }
      cam(1.0, 16, 10);     // the line
      cam(3.5, -30, 6);     // the key leaves the database
      cam(4.5, 30, 12);     // the key lands at the browser
      cam(6.5, 44, 22);     // every visitor
      cam(8.5, -40, 10);    // the shield
      cam(10.5, -16, 18);   // a request hits the shield
      cam(12.5, -44, 4);    // the shield breaks
      cam(14.5, 30, 16);    // the data reaches the browser
      cam(16.0, 6, 20, 30); // hold on the whole

      // ---- scene in / out (v7)
      tl.fromTo("#stack-cam", { scale: 0.94 }, { scale: 1, duration: 16 * F, ease: "expo.out" }, 0);
      tl.fromTo("#stack-cam", { opacity: 0 }, { opacity: 1, duration: 6 * F, ease: "power2.out" }, 0);
      tl.fromTo("#stack-cam", { scale: 1 }, { scale: 1.15, duration: 12 * F, ease: "power2.in", immediateRender: false }, DUR - 12 * F);
      tl.fromTo("#stack-cam", { opacity: 1 }, { opacity: 0, duration: 6 * F, ease: "power2.in", immediateRender: false }, DUR - 6 * F);
      tl.fromTo("#stack-xscan", { y: -60 }, { y: 1090, duration: 8 * F, ease: "power2.in" }, DUR - 8 * F);

      // ---- 3D: browser faces right, database faces left; both turn slowly toward camera
      gsap.set(["#stack-browser", "#stack-ghosts"], { transformPerspective: 1600, transformOrigin: "50% 50%" });
      gsap.set("#stack-db", { transformPerspective: 1600, transformOrigin: "50% 50%" });
      tl.fromTo(["#stack-browser", "#stack-ghosts"], { rotationY: 14, rotationX: 6 }, { rotationY: 7, rotationX: 3, duration: DUR, ease: "sine.inOut" }, 0);
      tl.fromTo("#stack-db", { rotationY: -14, rotationX: 6 }, { rotationY: -7, rotationX: 3, duration: DUR, ease: "sine.inOut" }, 0);
      tl.fromTo("#stack-sheen1", { xPercent: -120 }, { xPercent: 380, duration: 18 * F, ease: "power2.inOut" }, 0.2);

      // ---- lines
      lineIn("#stack-l1", 1.0);
      lineOut("#stack-l1", 4.5);
      lineIn("#stack-l2", 4.5);
      mark("#stack-mk-key", 5.5, "#ffc46b", "255,196,107");
      lineOut("#stack-l2", 8.5);
      lineIn("#stack-l3", 8.5);
      lineOut("#stack-l3", 12.5);
      lineIn("#stack-l4", 12.5);
      mark("#stack-mk-open", 13.5, "#ff3b5c", "255,59,92");

      // ---- 3.5 the anon key comes out of the database, travels the line, lands on the browser at 4.5 (clink)
      tl.fromTo("#stack-key-in", { clipPath: "inset(0% 0% 0% 100% round 30px)" }, { clipPath: "inset(0% 0% 0% 0% round 30px)", duration: 8 * F, ease: "power3.out" }, 3.5);
      tl.fromTo("#stack-key-in", { x: 0 }, { x: -372, duration: 22 * F, ease: "power3.inOut" }, 3.5 + 8 * F); // lands 4.5
      tl.fromTo("#stack-key-in", { x: -372 }, { x: -358, duration: 6 * F, ease: "power2.out", immediateRender: false }, 4.5);
      recoil("#stack-browser", 4.5, -8, 0);
      tl.fromTo("#stack-browser", { borderColor: "rgba(255,196,107,0.9)" }, { borderColor: "rgba(61,255,162,0.16)", duration: 18 * F, ease: "power2.out", immediateRender: false }, 4.5);
      tl.fromTo("#stack-key-in", { scale: 1.12 }, { scale: 1, duration: 9 * F, ease: "power4.out", immediateRender: false }, 4.5);

      // ---- 6.5 / 7.0: every visitor's browser, each with the same key
      tl.fromTo("#stack-ghost1", { x: 0, y: 0, opacity: 0 }, { x: -64, y: -52, opacity: 0.55, duration: 18 * F, ease: "expo.out" }, 6.5);
      tl.fromTo("#stack-ghost2", { x: 0, y: 0, opacity: 0 }, { x: -128, y: -104, opacity: 0.3, duration: 18 * F, ease: "expo.out" }, 7.0);

      // ---- 8.5 the shield draws on at the database edge; 9.0 its label
      tl.fromTo("#stack-shield svg", { scale: 0.85, transformOrigin: "50% 50%" }, { scale: 1, duration: 16 * F, ease: "back.out(1.7)" }, 8.5);
      tl.fromTo("#stack-shield-whole", { strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: 24 * F, ease: "power3.out" }, 8.5);
      tl.fromTo("#stack-shield-whole", { fillOpacity: 0 }, { fillOpacity: 1, duration: 12 * F, ease: "power2.out" }, 8.8);
      lineIn("#stack-rules", 9.0);

      // ---- 10.5 a request made with the key hits the shield at 11.0 and is stopped
      tl.fromTo("#stack-req", { x: 0, opacity: 0 }, { x: 430, opacity: 1, duration: 15 * F, ease: "power2.in" }, 10.5);
      tl.fromTo("#stack-req", { x: 430 }, { x: 360, duration: 10 * F, ease: "power2.out", immediateRender: false }, 11.0);
      tl.fromTo("#stack-req", { opacity: 1 }, { opacity: 0, duration: 8 * F, ease: "power2.in", immediateRender: false }, 11.1);
      tl.fromTo("#stack-ring", { scale: 0.7, opacity: 0.9 }, { scale: 1.9, opacity: 0, duration: 18 * F, ease: "power2.out", immediateRender: false }, 11.0);
      tl.fromTo("#stack-shield svg", { scale: 1.08 }, { scale: 1, duration: 10 * F, ease: "power3.out", immediateRender: false }, 11.0);

      // ---- 12.5 the shield breaks: halves part 20 px and turn red; the database takes the hit
      tl.set("#stack-shield-whole", { opacity: 0 }, 12.5);
      tl.set(["#stack-shard-l", "#stack-shard-r"], { opacity: 1 }, 12.5);
      tl.fromTo("#stack-shard-l", { x: 0, y: 0, rotation: 0, svgOrigin: "56 128" }, { x: -10, y: 4, rotation: -6, duration: 14 * F, ease: "expo.out" }, 12.5);
      tl.fromTo("#stack-shard-r", { x: 0, y: 0, rotation: 0, svgOrigin: "56 128" }, { x: 10, y: 4, rotation: 6, duration: 14 * F, ease: "expo.out" }, 12.5);
      recoil("#stack-db", 12.5, 8, 0);
      tl.fromTo("#stack-rules", { color: "#3dffa2" }, { color: "#ff3b5c", duration: 6 * F, ease: "power2.out" }, 12.5);
      tl.fromTo(["#stack-db-body", "#stack-db-top"], { stroke: "rgba(127,216,255,0.45)" }, { stroke: "rgba(255,59,92,0.7)", duration: 10 * F, ease: "power2.out" }, 12.5);
      tl.fromTo("#stack-link-flow", { stroke: "#7fd8ff" }, { stroke: "#ff3b5c", duration: 10 * F, ease: "power2.out" }, 12.5);

      // ---- 14.0 rows of data stream out of the open database to the browser
      ["#stack-hit1", "#stack-hit2", "#stack-hit3"].forEach(function (s, i) {
        tl.fromTo(s, { opacity: 0 }, { opacity: 0.32, duration: 6 * F, ease: "power2.out" }, 14.0 + i * 0.5);
        tl.fromTo(s, { opacity: 0.32 }, { opacity: 0.12, duration: 12 * F, ease: "power2.out", immediateRender: false }, 14.0 + i * 0.5 + 8 * F);
      });
      for (let k = 0; k < 9; k++) {
        const s = "#stack-pkt" + k;
        const t = 14.0 + k * 0.375;
        tl.fromTo(s, { x: 0 }, { x: -352, duration: 20 * F, ease: "power2.inOut" }, t);
        tl.fromTo(s, { opacity: 0 }, { opacity: 1, duration: 4 * F, ease: "power2.out" }, t);
        tl.fromTo(s, { opacity: 1 }, { opacity: 0, duration: 3 * F, ease: "power2.in", immediateRender: false }, t + 17 * F);
      }
      tl.fromTo("#stack-browser", { borderColor: "rgba(61,255,162,0.16)" }, { borderColor: "rgba(255,59,92,0.75)", duration: 12 * F, ease: "power2.out", immediateRender: false }, 14.5);
      tl.fromTo("#stack-browser", { boxShadow: "0 40px 90px rgba(0,0,0,0.55), 0 0 0px rgba(255,59,92,0)" }, { boxShadow: "0 40px 90px rgba(0,0,0,0.55), 0 0 60px rgba(255,59,92,0.22)", duration: 12 * F, ease: "power2.out" }, 14.5);
      recoil("#stack-browser", 14.7, -6, 0);

      tl.set({}, {}, DUR);
      window.__timelines = window.__timelines || {};
      window.__timelines["stack"] = tl;
    })();
  </script>
