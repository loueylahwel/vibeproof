    <div id="stack-cam" data-layout-allow-overflow>

          <svg style="position: absolute; left: 18px; top: 28px" width="70" height="14"><circle cx="7" cy="7" r="5.5" fill="none" stroke="#0a0a0a" stroke-width="2"/><circle cx="29" cy="7" r="5.5" fill="none" stroke="#0a0a0a" stroke-width="2"/><circle cx="51" cy="7" r="5.5" fill="none" stroke="#0a0a0a" stroke-width="2"/></svg>

        <div class="stack-row" style="top: 152px"><div class="stack-box"></div><div class="stack-task">Fix login bug</div></div>

        <svg width="420" height="520">

          <ellipse cx="210" cy="50" rx="208" ry="44" fill="#ffffff" stroke="#0a0a0a" stroke-width="2" />
          <!-- todos table grid -->

          <path d="M50 226 H370 M50 266 H370 M50 306 H370 M50 346 H370 M130 186 V386 M250 186 V386" fill="none" stroke="#0a0a0a" stroke-width="2" />

          <g id="stack-shield-l" opacity="0"><path d="M50 6 L10 20 V58 C10 86 28 104 50 114 L42 92 L56 72 L42 50 L56 30 Z" fill="#e5342f" stroke="#e5342f" stroke-width="2" stroke-linejoin="round" /></g>
          <g id="stack-shield-r" opacity="0"><path d="M50 6 L90 20 V58 C90 86 72 104 50 114 L42 92 L56 72 L42 50 L56 30 Z" fill="#e5342f" stroke="#e5342f" stroke-width="2" stroke-linejoin="round" /></g>
        </svg>

        <div id="stack-key-in">
          <svg width="216" height="60"><rect x="1" y="1" width="214" height="58" rx="29" fill="#ffffff" stroke="#0a0a0a" stroke-width="2" /><circle cx="32" cy="30" r="10" fill="none" stroke="#0a0a0a" stroke-width="2" /></svg>
          <span>anon key</span>
        </div>
      </div>

      <div id="stack-l1" class="clip stack-line" data-start="1" data-duration="3.5"><span class="stack-w">Apps</span> <span class="stack-w">like</span> <span class="stack-w">this</span> <span class="stack-w">talk</span> <span class="stack-w">to</span> <span class="stack-w">their</span> <span class="stack-w">database</span> <span class="stack-w">directly</span></div>
      <div id="stack-l2" class="clip stack-line" data-start="4.5" data-duration="4"><span class="stack-w">Every</span> <span class="stack-w">visitor's</span> <span class="stack-w">browser</span> <span class="stack-w">gets</span> <span class="stack-w">this</span> <span id="stack-mk-key" class="stack-w stack-mk">key<i class="stack-bar"></i></span></div>
      <div id="stack-l3" class="clip stack-line" data-start="8.5" data-duration="4"><span class="stack-w">Only</span> <span class="stack-w">the</span> <span class="stack-w">access</span> <span class="stack-w">rules</span> <span class="stack-w">protect</span> <span class="stack-w">the</span> <span class="stack-w">data</span></div>
      <div id="stack-l4" class="clip stack-line" data-hold data-start="12.5" data-duration="5.5"><span class="stack-w">One</span> <span class="stack-w">wrong</span> <span class="stack-w">rule,</span> <span class="stack-w">and</span> <span class="stack-w">the</span> <span class="stack-w">data</span> <span class="stack-w">is</span> <span id="stack-mk-open" class="stack-w stack-mk">open<i class="stack-bar"></i></span></div>
    </div>
  </div>

  <script>
    (function () {
      const tl = gsap.timeline({ paused: true });
      const F = 1 / 30;
      const D = 18;
      const CAM = "#stack-cam";
      const OPEN = "inset(0% 0% 0% 0%)";

      // kinetic type: words rise through the line's mask, leave upward
      function lineIn(sel, t) {
        tl.fromTo(sel + " .stack-w", { yPercent: 110 }, { yPercent: 0, duration: 14 * F, ease: "power4.out", stagger: 2 * F }, t);
      }
      function lineOut(sel, end) {
        const n = document.querySelectorAll(sel + " .stack-w").length;
        tl.fromTo(sel + " .stack-w", { yPercent: 0 }, { yPercent: -110, duration: 8 * F, ease: "power2.in", stagger: F, immediateRender: false }, end - (8 + n) * F);
      }
      function marker(sel, t) {
        tl.fromTo(sel + " .stack-bar", { scaleX: 0, transformOrigin: "0% 50%" }, { scaleX: 1, duration: 10 * F, ease: "power3.out" }, t);
        tl.fromTo(sel, { color: "#0a0a0a" }, { color: "#ffffff", duration: 6 * F, ease: "power2.out" }, t + 2 * F);
      }
      // a hit: the object is knocked a few px and settles
      function recoil(sel, t, dx, dy) {
        tl.fromTo(sel, { x: 0, y: 0 }, { x: dx, y: dy, duration: 2 * F, ease: "power2.out", immediateRender: false }, t);
        tl.fromTo(sel, { x: dx, y: dy }, { x: 0, y: 0, duration: 10 * F, ease: "power2.out", immediateRender: false }, t + 2 * F);
      }

      // camera: slow push, re-target at each beat, velocity-matched cut in and out
      tl.fromTo(CAM, { scale: 1 }, { scale: 1.06, duration: D, ease: "sine.inOut" }, 0);
      tl.fromTo(CAM, { x: 420 }, { x: 0, duration: 18 * F, ease: "expo.out" }, 0);
      let cx = 0, cy = 0;
      function cam(t, x, y) {
        tl.fromTo(CAM, { x: cx, y: cy }, { x: x, y: y, duration: 20 * F, ease: "power2.inOut", immediateRender: false }, t);
        cx = x; cy = y;
      }
      cam(1.0, 30, 30);    // the line
      cam(3.3, -10, -10);  // the key leaves the database
      cam(4.5, 40, 0);     // the key lands at the browser
      cam(6.6, -20, 30);   // towards the database
      cam(8.5, 0, -20);    // the shield
      cam(10.6, 30, 10);   // a request hits the shield
      cam(12.5, -10, -30); // the shield breaks
      cam(15.2, 30, 20);   // the data reaches the browser
      cam(16.8, 0, 50);    // back to the line
      tl.fromTo(CAM, { x: cx }, { x: -420, duration: 10 * F, ease: "power3.in", immediateRender: false }, D - 10 * F);

      // lines
      lineIn("#stack-l1", 1.0);
      lineOut("#stack-l1", 4.5);
      lineIn("#stack-l2", 4.5);
      marker("#stack-mk-key", 5.3);
      lineOut("#stack-l2", 8.5);
      lineIn("#stack-l3", 8.5);
      lineOut("#stack-l3", 12.5);
      lineIn("#stack-l4", 12.5);
      marker("#stack-mk-open", 13.45);

      // 3.3: the anon key comes out of the database, travels the line (power3.out), settles at the browser at 4.5
      tl.fromTo("#stack-key-in", { clipPath: "inset(0% 0% 0% 100%)" }, { clipPath: OPEN, duration: 0.3, ease: "power3.out" }, 3.3);
      tl.fromTo("#stack-key-in", { x: 0 }, { x: -352, duration: 0.7, ease: "power3.out" }, 3.63);
      tl.fromTo("#stack-key-in", { x: -352 }, { x: -340, duration: 4 * F, ease: "power2.inOut", immediateRender: false }, 4.37);
      recoil("#stack-browser", 4.33, -6, 0);

      // 8.5: the shield draws on at the database edge and overshoots into place
      tl.fromTo("#stack-shield-svg", { scale: 0.9, transformOrigin: "50% 50%" }, { scale: 1, duration: 16 * F, ease: "back.out(1.7)" }, 8.5);
      tl.fromTo("#stack-shield-whole", { strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: 0.8, ease: "power3.out" }, 8.5);
      tl.fromTo("#stack-shield-whole", { fillOpacity: 0 }, { fillOpacity: 1, duration: 0.3, ease: "power2.out" }, 8.6);
      tl.fromTo("#stack-rules .stack-w", { yPercent: 110 }, { yPercent: 0, duration: 14 * F, ease: "power4.out", stagger: 2 * F }, 8.8);

      // 10.6: a request made with the key hits the shield and bounces off
      tl.fromTo("#stack-req", { opacity: 0 }, { opacity: 1, duration: 2 * F, ease: "none" }, 10.6);
      tl.fromTo("#stack-req", { x: 0 }, { x: 166, duration: 0.4, ease: "power2.in" }, 10.6);
      tl.fromTo("#stack-req", { x: 166 }, { x: 110, duration: 0.35, ease: "power2.out", immediateRender: false }, 11.0);
      tl.fromTo("#stack-req", { opacity: 1 }, { opacity: 0, duration: 0.3, ease: "power2.in", immediateRender: false }, 11.05);
      recoil("#stack-shield-svg", 11.0, 6, 0);

      // 12.5: the shield breaks, halves part 20 px and turn FLAW red; the database takes the hit
      tl.fromTo("#stack-shield-whole", { opacity: 1 }, { opacity: 0, duration: 0.01 }, 12.5);
      tl.fromTo(["#stack-shield-l", "#stack-shield-r"], { opacity: 0 }, { opacity: 1, duration: 0.01 }, 12.5);
      tl.fromTo("#stack-shield-l", { x: 0, y: 0 }, { x: -10, y: 4, duration: 0.4, ease: "power3.out" }, 12.5);
      tl.fromTo("#stack-shield-r", { x: 0, y: 0 }, { x: 10, y: 4, duration: 0.4, ease: "power3.out" }, 12.5);
      recoil("#stack-db", 12.5, 6, 0);

      // 13.7: rows of data travel out of the open database to the browser
      ["#stack-datum1", "#stack-datum2", "#stack-datum3"].forEach(function (s, i) {
        const t = 13.7 + i * 6 * F;
        tl.fromTo(s, { opacity: 0 }, { opacity: 1, duration: 3 * F, ease: "none" }, t);
        tl.fromTo(s, { x: 0 }, { x: -620, duration: 0.7, ease: "power3.out" }, t);
        tl.fromTo(s, { x: -620 }, { x: -608, duration: 4 * F, ease: "power2.inOut", immediateRender: false }, t + 0.7);
        tl.fromTo(s, { opacity: 1 }, { opacity: 0, duration: 6 * F, ease: "power2.in", immediateRender: false }, t + 0.7 + 4 * F);
      });
      recoil("#stack-browser", 14.4, -6, 0);

      tl.set({}, {}, D);
      window.__timelines = window.__timelines || {};
      window.__timelines["stack"] = tl;
    })();
  </script>
