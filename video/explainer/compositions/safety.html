  <script>
    (function () {
      const tl = gsap.timeline({ paused: true });
      const F = 1 / 30;
      const DUR = 16;
      const FILM_START = 164;
      const P = "#safety";

      // ---- shared world: ground grid scroll + dust from FILM time (continuous across cuts)
      (function world(tl, id, FILM_START, DUR) {
        let s = 20261122;
        const rnd = () => { s |= 0; s = (s + 0x6d2b79f5) | 0; let t = Math.imul(s ^ (s >>> 15), 1 | s);
          t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
        const box = document.getElementById(id + "-dust");
        const dots = [];
        for (let k = 0; k < 54; k++) {
          const d = { x: rnd() * 1920, y: rnd() * 1180, z: 0.3 + rnd() * 0.7, ph: rnd() * 6.283 };
          const el = document.createElement("i");
          const size = 1 + d.z * 2;
          el.style.width = el.style.height = size + "px";
          el.style.opacity = (0.12 + d.z * 0.23).toFixed(3);
          box.appendChild(el); d.el = el; dots.push(d);
        }
        const floor = document.getElementById(id + "-floor");
        const draw = (T) => {
          if (floor) floor.style.backgroundPosition = "0px " + ((T * 40) % 80) + "px";
          for (const d of dots) {
            const y = ((d.y - T * 14 * d.z) % 1180 + 1180) % 1180 - 50;
            const x = d.x + Math.sin(T * 0.35 + d.ph) * 18 * d.z;
            d.el.style.transform = "translate(" + x.toFixed(1) + "px," + y.toFixed(1) + "px)";
          }
        };
        const p = { t: 0 };
        tl.fromTo(p, { t: 0 }, { t: DUR, duration: DUR, ease: "none", onUpdate: () => draw(FILM_START + p.t) }, 0);
        draw(FILM_START);
      })(tl, "safety", FILM_START, DUR);

      // ---- transitions: in (scale 0.94 -> 1, fade 6 f), out (scale -> 1.15, fade, green scan line)
      tl.fromTo(P + "-fx", { scale: 0.94 }, { scale: 1, duration: 16 * F, ease: "expo.out" }, 0);
      tl.fromTo(P + "-fx", { opacity: 0 }, { opacity: 1, duration: 6 * F, ease: "power2.out" }, 0);
      tl.fromTo(P + "-fx", { scale: 1 }, { scale: 1.15, duration: 12 * F, ease: "power2.in", immediateRender: false }, DUR - 12 * F);
      tl.fromTo(P + "-fx", { opacity: 1 }, { opacity: 0, duration: 6 * F, ease: "power2.in", immediateRender: false }, DUR - 6 * F);
      tl.fromTo(P + "-wipe", { y: -122 }, { y: 1080, duration: 8 * F, ease: "power1.in" }, DUR - 8 * F);

      // ---- HUD: types 1 char per frame, block cursor blinks on the beat, gone after 2 s
      (function hud(text) {
        const t = document.querySelector(P + "-hud-t");
        const c = document.querySelector(P + "-hud-c");
        const p = { t: 0 };
        const draw = () => {
          const f = Math.floor(p.t * 30 + 1e-4);
          t.textContent = text.slice(0, Math.min(text.length, f));
          c.style.opacity = p.t < 2 && f % 15 < 8 ? 1 : 0;
        };
        tl.fromTo(p, { t: 0 }, { t: 3, duration: 3, ease: "none", onUpdate: draw }, 0);
        draw();
      })("08 / Safe by design");

      // ---- camera: slow push + beat re-targets
      tl.fromTo(P + "-cam", { scale: 1 }, { scale: 1.05, duration: DUR, ease: "sine.inOut" }, 0);
      let rx = 0, ry = 0;
      const aim = (x, y, at, dur) => {
        tl.fromTo(P + "-rig", { x: rx, y: ry }, { x: x, y: y, duration: dur || 24 * F, ease: "power2.inOut", immediateRender: false }, at);
        rx = x; ry = y;
      };

      // ---- kinetic type
      const wordsIn = (sel, t) =>
        tl.fromTo(sel + " .safety-w", { yPercent: 115 }, { yPercent: 0, duration: 14 * F, ease: "power4.out", stagger: 2 * F }, t);
      const wordsOut = (sel, end) => {
        const n = document.querySelectorAll(sel + " .safety-w").length;
        tl.fromTo(sel + " .safety-w", { yPercent: 0 }, { yPercent: -115, duration: 8 * F, ease: "power2.in", stagger: F, immediateRender: false }, end - (8 + n - 1) * F);
      };
      const marker = (sel, t) => {
        tl.fromTo(sel, { color: "#eaf2f7", textShadow: "0 0 18px rgba(61,255,162,0)" },
          { color: "#3dffa2", textShadow: "0 0 18px rgba(61,255,162,0.6)", duration: 6 * F, ease: "power2.out" }, t);
        tl.fromTo(sel + " .safety-ul", { scaleX: 0 }, { scaleX: 1, duration: 10 * F, ease: "power3.out" }, t);
      };
      const draw = (sel, t, dur, ease) =>
        tl.fromTo(sel, { strokeDasharray: 1, strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: dur, ease: ease || "power2.inOut" }, t);
      // a statement: index + two lines rise in on the beat; leave up through the mask just before the next
      const say = (n, t, end) => {
        tl.fromTo(P + "-i" + n + " span", { yPercent: 110 }, { yPercent: 0, duration: 12 * F, ease: "power4.out" }, t);
        wordsIn(P + "-s" + n + "a", t);
        wordsIn(P + "-s" + n + "b", t + 4 * F);
        if (end) {
          tl.fromTo(P + "-i" + n + " span", { yPercent: 0 }, { yPercent: -110, duration: 8 * F, ease: "power2.in", immediateRender: false }, end - 8 * F);
          wordsOut(P + "-s" + n + "a", end - 2 * F);
          wordsOut(P + "-s" + n + "b", end);
        }
      };
      // the big object: arrives tilted in depth, turns to face the camera over its beat, leaves
      const objIn = (n, t, hold) => {
        const o = P + "-o" + n;
        tl.fromTo(o, { opacity: 0 }, { opacity: 1, duration: 6 * F, ease: "power2.out" }, t);
        tl.fromTo(o, { scale: 0.82, rotationY: 28, rotationX: 8, x: -40 }, { scale: 1, rotationY: 12, rotationX: 5, x: 0, duration: 20 * F, ease: "expo.out" }, t);
        tl.fromTo(o, { rotationY: 12, rotationX: 5 }, { rotationY: 0, rotationX: 0, duration: hold - 20 * F, ease: "sine.inOut", immediateRender: false }, t + 20 * F);
      };
      const objOut = (n, end) => {
        const o = P + "-o" + n;
        tl.fromTo(o, { opacity: 1, scale: 1, y: 0 }, { opacity: 0, scale: 0.94, y: -24, duration: 10 * F, ease: "power3.in", immediateRender: false }, end - 10 * F);
      };
      // a glow flash behind the object, on the beat
      const flash = (n, t, peak) =>
        tl.fromTo(P + "-o" + n, { filter: "brightness(" + (1 + 0.7 * (peak || 1)) + ")" }, { filter: "brightness(1)", duration: 24 * F, ease: "power2.out", immediateRender: false }, t);
      const halo = (t, from, to) =>
        tl.fromTo(P + "-halo", { opacity: from }, { opacity: to, duration: 14 * F, ease: "power2.out", immediateRender: false }, t);

      // 0.0 title, word by word, under the incoming camera
      wordsIn(P + "-title", 0);
      tl.fromTo(P + "-halo", { opacity: 0 }, { opacity: 0.5, duration: 1.5, ease: "sine.inOut" }, 1.0);
      aim(0, 10, 1.0, 30 * F);

      // 2.5 lock: draws on, the shackle drops shut on 3.5, the domain is proven at 4.0
      aim(20, 0, 2.5);
      objIn(1, 2.5, 3.0);
      say(1, 2.5, 6.0);
      draw(P + "-lock-body", 2.5, 18 * F);
      draw(P + "-lock-hole", 2.7, 12 * F);
      draw(P + "-lock-slot", 2.8, 9 * F);
      draw(P + "-lock-shackle", 2.6, 15 * F);
      tl.fromTo(P + "-lock-fill", { opacity: 0 }, { opacity: 1, duration: 12 * F, ease: "power2.out" }, 2.8);
      tl.fromTo(P + "-lock-shackle", { y: -34 }, { y: 0, duration: 9 * F, ease: "power3.in" }, 3.5 - 9 * F);
      halo(3.5, 1, 0.55);
      flash(1, 3.5);
      tl.fromTo(P + "-lock", { y: 0 }, { y: 8, duration: 2 * F, ease: "power2.out", immediateRender: false }, 3.5);
      tl.fromTo(P + "-lock", { y: 8 }, { y: 0, duration: 10 * F, ease: "power2.out", immediateRender: false }, 3.5 + 2 * F);
      tl.fromTo(P + "-domain", { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 18 * F, ease: "expo.out" }, 4.0);
      tl.fromTo(P + "-domain svg", { scale: 0 }, { scale: 1, duration: 14 * F, ease: "back.out(2.2)" }, 4.5);
      aim(10, -14, 4.5, 30 * F);
      flash(1, 5.0, 0.6);
      objOut(1, 6.0);

      // 6.0 GET: the tag slams in, the arrow draws, read-only requests travel it; writing methods are struck out
      aim(-10, 0, 6.0);
      objIn(2, 6.0, 3.0);
      say(2, 6.0, 9.5);
      tl.fromTo(P + "-get", { scale: 1.45 }, { scale: 1, duration: 9 * F, ease: "power4.out" }, 6.0);
      draw(P + "-arrow-shaft", 6.2, 14 * F);
      draw(P + "-arrow-head", 6.5, 8 * F, "power2.out");
      marker(P + "-mk-read", 6.5);
      halo(6.0, 1, 0.55);
      [7.0, 8.0].forEach((t) => {
        tl.fromTo(P + "-packet", { x: 0, opacity: 0 }, { x: 205, duration: 14 * F, ease: "power3.inOut", immediateRender: false }, t);
        tl.fromTo(P + "-packet", { opacity: 0 }, { opacity: 1, duration: 3 * F, ease: "none", immediateRender: false }, t);
        tl.fromTo(P + "-packet", { opacity: 1 }, { opacity: 0, duration: 4 * F, ease: "power2.in", immediateRender: false }, t + 12 * F);
      });
      [P + "-m1", P + "-m2", P + "-m3"].forEach((m, i) => {
        tl.fromTo(m, { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 16 * F, ease: "expo.out" }, 7.0 + i * 2 * F);
        tl.fromTo(m + " i", { scaleX: 0 }, { scaleX: 1, duration: 10 * F, ease: "power3.out" }, 7.5 + i * 2 * F);
        tl.fromTo(m, { opacity: 1 }, { opacity: 0.55, duration: 10 * F, ease: "power2.out", immediateRender: false }, 7.5 + i * 2 * F + 6 * F);
      });
      flash(2, 7.5, 0.7);
      aim(-20, -12, 8.0, 30 * F);
      objOut(2, 9.5);

      // 9.5 key: draws on; at 10.5 a scan line reads the secret and its middle is hidden
      aim(14, 0, 9.5);
      objIn(3, 9.5, 3.0);
      say(3, 9.5, 13.0);
      draw(P + "-key-bow", 9.5, 16 * F);
      draw(P + "-key-hole", 9.6, 12 * F);
      draw(P + "-key-blade", 9.7, 16 * F);
      draw(P + "-key-teeth", 10.0, 10 * F);
      tl.fromTo(P + "-secret", { opacity: 0, x: -30 }, { opacity: 1, x: 0, duration: 18 * F, ease: "expo.out" }, 10.0);
      halo(9.5, 1, 0.55);
      tl.fromTo(P + "-vscan", { x: 120 }, { x: 640, duration: 0.5, ease: "sine.inOut" }, 10.5);
      tl.fromTo(P + "-vscan", { opacity: 0 }, { opacity: 1, duration: 4 * F, ease: "none" }, 10.5);
      tl.fromTo(P + "-vscan", { opacity: 1 }, { opacity: 0, duration: 4 * F, ease: "power2.in", immediateRender: false }, 10.85);
      tl.fromTo(P + "-mid span", { filter: "blur(0px)" }, { filter: "blur(8px)", duration: 14 * F, ease: "sine.inOut" }, 10.5);
      tl.fromTo(P + "-mid", { width: 460.8 }, { width: 110, duration: 16 * F, ease: "power3.inOut" }, 11.0);
      flash(3, 11.5, 0.8);
      aim(4, -14, 11.5, 30 * F);
      objOut(3, 13.0);

      // 13.0 the table: one row comes back, its values are grey bars; nothing is kept
      aim(-6, 0, 13.0);
      objIn(4, 13.0, 2.6);
      say(4, 13.0);
      halo(13.0, 1, 0.55);
      ["#safety-bar1", "#safety-bar2", "#safety-bar3"].forEach((b, i) => {
        tl.fromTo(b, { scaleX: 0, transformOrigin: "0% 50%" }, { scaleX: 1, duration: 12 * F, ease: "power3.out" }, 13.5 + i * 2 * F);
        tl.fromTo(b + " i", { xPercent: -120 }, { xPercent: 220, duration: 1.0, ease: "sine.inOut" }, 13.5 + i * 2 * F);
      });
      marker(P + "-mk-never", 13.5);
      tl.fromTo(P + "-tscan", { y: -40 }, { y: 176, duration: 1.0, ease: "sine.inOut" }, 14.0);
      tl.fromTo(P + "-tscan", { opacity: 0 }, { opacity: 1, duration: 4 * F, ease: "none" }, 14.0);
      tl.fromTo(P + "-tscan", { opacity: 1 }, { opacity: 0, duration: 6 * F, ease: "power2.in", immediateRender: false }, 14.8);
      tl.fromTo(P + "-note", { clipPath: "inset(0% 100% 0% 0%)" }, { clipPath: "inset(0% 0% 0% 0%)", duration: 14 * F, ease: "power3.out" }, 14.5);
      flash(4, 15.0, 0.7);
      aim(-10, -10, 14.5, 30 * F);

      tl.set({}, {}, DUR);
      window.__timelines = window.__timelines || {};
      window.__timelines["safety"] = tl;
    })();
  </script>
</template>
