      // ---------------- build the file tree and the "reading" list ----------------
      const FOLDER = '<svg viewBox="0 0 26 26"><path d="M2 6.5a2 2 0 0 1 2-2h5.5l2.8 2.8H22a2 2 0 0 1 2 2V20a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2z" fill="none" stroke="#7a8699" stroke-width="1.8" stroke-linejoin="round"/></svg>';
      const FILE = (n) => '<svg viewBox="0 0 26 26"><path id="code-ff' + n + '" d="M6 2h10l6 6v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2z" fill="rgba(61,255,162,0.22)" opacity="0"/><path id="code-fs' + n + '" d="M6 2h10l6 6v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2zM16 2v6h6" fill="none" stroke="#7a8699" stroke-width="1.8" stroke-linejoin="round"/></svg>';
      const TREE = [
        [0, "d", "supabase"], [1, "d", "migrations"], [2, "f", "20260101_init.sql", "supabase/migrations/20260101_init.sql"],
        [0, "d", "src"], [1, "d", "lib"], [2, "f", "supabase.ts", "src/lib/supabase.ts"],
        [1, "f", "App.tsx", "src/App.tsx"], [1, "f", "main.tsx", "src/main.tsx"],
        [0, "f", ".env.example", ".env.example"], [0, "f", "package.json", "package.json"],
        [0, "f", "package-lock.json", "package-lock.json"], [0, "f", "README.md", "README.md"],
      ];
      const ROW0 = 84, RH = 46;
      const rowsBox = document.getElementById("code-tree-rows");
      const readBox = document.getElementById("code-read-inner");
      let fileN = 0;
      const files = []; // { n, row }
      TREE.forEach(function (r, i) {
        const el = document.createElement("div");
        el.className = "code-trow";
        el.id = "code-tr" + i;
        el.style.left = (24 + r[0] * 32) + "px";
        el.style.top = (ROW0 + i * RH) + "px";
        if (r[1] === "d") {
          el.innerHTML = FOLDER + '<span class="code-mono code-dir">' + r[2] + "</span>";
        } else {
          fileN++;
          el.innerHTML = FILE(fileN) + '<span id="code-fn' + fileN + '" class="code-mono code-fname">' + r[2] + "</span>";
          files.push({ n: fileN, row: i, path: r[3] });
          const rl = document.createElement("div");
          rl.className = "code-row code-mono";
          rl.id = "code-rl" + fileN;
          rl.style.left = "40px";
          rl.style.top = (28 + (fileN - 1) * 52) + "px";
          rl.innerHTML = '<span class="code-chk">✓</span>  <span class="code-mut">read</span>  ' + r[3];
          readBox.appendChild(rl);
        }
        rowsBox.appendChild(el);
      });

      // HUD label characters
      const HUD = "03 / SCAN THE CODE";
      const hud = document.getElementById("code-hud");
      for (let i = 0; i < HUD.length; i++) {
        const sp = document.createElement("span");
        sp.textContent = HUD[i];
        hud.insertBefore(sp, document.getElementById("code-hud-cur"));
      }

      // ---------------- helpers ----------------
      function wordsIn(line, t) {
        tl.fromTo(line + " .code-w", { y: 84 }, { y: 0, duration: 14 * F, ease: "power4.out", stagger: 2 * F }, t);
      }
      function wordsOut(line, t) {
        tl.fromTo(line + " .code-w, " + line + " .code-ul", { y: 0 }, { y: -84, duration: 8 * F, ease: "power3.in", stagger: F, immediateRender: false }, t);
      }
      // key word: turns red with a glow, an underline grows under it
      function marker(mk, t) {
        tl.fromTo(mk + " .code-ul", { scaleX: 0, opacity: 1 }, { scaleX: 1, duration: 10 * F, ease: "power3.out" }, t);
        tl.fromTo(mk + " .code-w", { color: TEXT, textShadow: "0 0 18px rgba(255,59,92,0)" },
          { color: RED, textShadow: "0 0 18px rgba(255,59,92,0.6)", duration: 8 * F, ease: "power2.out" }, t);
      }
      // typing: one character per step, the caret follows in the same steps
      function type(sel, n, t, top, cps) {
        const d = n / cps;
        tl.fromTo(sel, { clipPath: SHUT }, { clipPath: OPEN, duration: d, ease: "steps(" + n + ")" }, t);
        tl.set("#code-caret", { opacity: 1, y: top + 7 }, t);
        tl.fromTo("#code-caret", { x: 96 }, { x: 96 + n * CW, duration: d, ease: "steps(" + n + ")", immediateRender: false }, t);
        return t + d;
      }
      function tabIn(sel, n, t) {
        tl.fromTo(sel, { clipPath: SHUT, y: 0, opacity: 1 }, { clipPath: OPEN, duration: n / 90, ease: "steps(" + n + ")" }, t);
      }
      function tabOut(sel, t) {
        tl.fromTo(sel, { y: 0, opacity: 1 }, { y: -24, opacity: 0, duration: 10 * F, ease: "power3.in", immediateRender: false }, t);
      }
      function scrollOut(sel, t) {
        tl.fromTo(sel, { y: 0, opacity: 1 }, { y: -80, opacity: 0, duration: 10 * F, ease: "power3.in", immediateRender: false }, t);
      }
      function appear(sel, t) {
        tl.fromTo(sel, { scale: 0.9, opacity: 0 }, { scale: 1, opacity: 1, duration: 16 * F, ease: "back.out(1.7)" }, t);
      }
      function sheen(sel, t) {
        tl.fromTo(sel, { xPercent: -110 }, { xPercent: 360, duration: 18 * F, ease: "power2.inOut" }, t);
      }
      // a scan line sweeping local y0 -> y1 inside its panel; returns the pass time for a local y
      function scan(sel, t0, t1, y0, y1) {
        tl.fromTo(sel, { y: y0 }, { y: y1, duration: t1 - t0, ease: "none", immediateRender: false }, t0);
        tl.fromTo(sel, { opacity: 0 }, { opacity: 1, duration: 4 * F, ease: "none", immediateRender: false }, t0);
        tl.fromTo(sel, { opacity: 1 }, { opacity: 0, duration: 5 * F, ease: "power2.in", immediateRender: false }, t1 - 5 * F);
        return function (y) { return t0 + (y - y0) / (y1 - y0) * (t1 - t0); };
      }
      // a line the scan passes brightens briefly
      function flash(sel, t) {
        tl.fromTo(sel, { textShadow: "0 0 14px rgba(61,255,162,0.95)" },
          { textShadow: "0 0 14px rgba(61,255,162,0)", duration: 0.5, ease: "power2.out", immediateRender: false }, t);
      }
      // "found" slams in: tag 1.45 -> 1, brackets lock on, halo flares, panel recoils
      function slam(sel, t) {
        tl.fromTo(sel + " .code-tag", { scale: 1.45, opacity: 0 }, { scale: 1, opacity: 1, duration: 9 * F, ease: "power4.out" }, t);
        tl.fromTo(sel + " .code-lock", { scale: 1.9, opacity: 0 }, { scale: 1, opacity: 1, duration: 9 * F, ease: "expo.out" }, t);
        tl.fromTo(sel + " .code-lock", { opacity: 1 }, { opacity: 0.35, duration: 0.5, ease: "power2.out", immediateRender: false }, t + 0.5);
        tl.fromTo(sel + " .code-halo", { opacity: 0, scale: 0.6 }, { opacity: 1, scale: 1, duration: 4 * F, ease: "power2.out" }, t);
        tl.fromTo(sel + " .code-halo", { opacity: 1 }, { opacity: 0.25, duration: 0.8, ease: "power2.out", immediateRender: false }, t + 4 * F);
        tl.fromTo("#code-panel", { y: 0 }, { y: 7, duration: 2 * F, ease: "power2.out", immediateRender: false }, t + F);
        tl.fromTo("#code-panel", { y: 7 }, { y: 0, duration: 10 * F, ease: "power2.out", immediateRender: false }, t + 3 * F);
      }
      function pulse(sel, t) { // a glow pulse on the beat
        tl.fromTo(sel + " .code-halo", { opacity: 0.6 }, { opacity: 0.25, duration: 0.5, ease: "power2.out", immediateRender: false }, t);
      }

      // ---------------- camera ----------------
      // scene in: scale 0.94 -> 1 (16 f, expo.out), content fades in over 6 f
      tl.fromTo("#code-cam, #code-txt", { scale: 0.94 }, { scale: 1, duration: 16 * F, ease: "expo.out" }, 0);
      tl.fromTo("#code-cam, #code-txt", { opacity: 0 }, { opacity: 1, duration: 6 * F, ease: "none" }, 0);
      // scene out: scale 1 -> 1.15 (last 12 f), fade over the last 6 f, green sweep over the last 8 f
      tl.fromTo("#code-cam, #code-txt", { scale: 1 }, { scale: 1.15, duration: 12 * F, ease: "power2.in", immediateRender: false }, DUR - 12 * F);
      tl.fromTo("#code-cam, #code-txt", { opacity: 1 }, { opacity: 0, duration: 6 * F, ease: "power2.in", immediateRender: false }, DUR - 6 * F);
      tl.fromTo("#code-sweep", { y: -120, opacity: 0 }, { y: 1080, duration: 8 * F, ease: "power1.in", immediateRender: false }, DUR - 8 * F);
      tl.fromTo("#code-sweep", { opacity: 0 }, { opacity: 1, duration: F, ease: "none" }, DUR - 8 * F);

      // slow push over the scene
      tl.fromTo("#code-dolly", { scale: 1 }, { scale: 1.05, duration: DUR, ease: "sine.inOut" }, 0);
      // re-targets on the beat (attention leads the frame); focus glow follows
      let cx = 0, cy = 30, fx = 340, fy = 560;
      tl.fromTo("#code-dolly", { x: cx, y: cy }, { x: cx, y: cy, duration: F, ease: "none" }, 0);
      tl.fromTo("#code-focus", { x: fx, y: fy }, { x: fx, y: fy, duration: F, ease: "none" }, 0);
      function aim(t, x, y, gx, gy, dur) {
        tl.fromTo("#code-dolly", { x: cx, y: cy }, { x: x, y: y, duration: dur || 24 * F, ease: "power2.inOut", immediateRender: false }, t);
        tl.fromTo("#code-focus", { x: fx, y: fy }, { x: gx, y: gy, duration: dur || 24 * F, ease: "power2.inOut", immediateRender: false }, t);
        cx = x; cy = y; fx = gx; fy = gy;
      }
      aim(2.0, 10, 0, 340, 700);       // follow the reading down the tree
      aim(3.5, -10, 20, 1100, 420);      // the history opens in the panel
      aim(5.5, -20, -20, 1100, 640, 1.5); // ride the scan down
      aim(7.5, -30, 40, 1160, 400);      // the migration file
      aim(9.5, -40, 10, 1160, 480);      // track the typing
      aim(11.0, -30, -10, 1160, 560);    // the missing line
      aim(12.5, -50, 0, 1400, 560);      // toward the tag before it slams
      aim(14.5, -10, 50, 1100, 420);     // the next file
      aim(16.5, -30, 20, 1200, 480);     // track the typing
      aim(18.0, -40, 10, 1200, 440);     // the service role key
      aim(21.0, 0, 20, 960, 520);       // pull back
      aim(23.0, 10, 0, 760, 560);        // both files in the tree
      aim(24.5, -10, 10, 960, 520, 1.0);

      // panels in 3D, slowly turning toward the camera over the beats
      gsap.set("#code-tree", { rotationY: -13, rotationX: 6 });
      gsap.set("#code-panel", { rotationY: -9, rotationX: 5 });
      function turn(sel, t, ry, rx, dur) {
        tl.to(sel, { rotationY: ry, rotationX: rx, duration: dur, ease: "sine.inOut" }, t);
      }
      turn("#code-tree", 0, -9, 4, 3.5);
      turn("#code-panel", 0, -8, 4, 3.5);
      turn("#code-tree", 3.5, -11, 5, 4);
      turn("#code-panel", 3.5, -6, 3, 4);
      turn("#code-tree", 7.5, -12, 5, 7);
      turn("#code-panel", 7.5, -4, 2, 7);
      turn("#code-panel", 14.5, -3.5, 2, 7.5);
      turn("#code-tree", 14.5, -10, 4, 7.5);
      turn("#code-tree", 22, -7, 3, 4);
      turn("#code-panel", 22, -6, 3, 4);

      // ---------------- HUD: types 1 char per frame, block cursor blinks on the beat ----------------
      document.querySelectorAll("#code-hud span").forEach(function (sp, i) {
        tl.fromTo(sp, { opacity: 0 }, { opacity: 1, duration: F * 0.5, ease: "none" }, (i + 1) * F);
      });
      tl.fromTo("#code-hud-cur", { x: 0 }, { x: HUD.length * 18.04, duration: HUD.length * F, ease: "steps(" + HUD.length + ")" }, F);
      tl.fromTo("#code-hud-cur", { opacity: 1 }, { opacity: 1, duration: F, ease: "none" }, 0);
      tl.set("#code-hud-cur", { opacity: 0 }, 1.0);
      tl.set("#code-hud-cur", { opacity: 1 }, 1.5);
      tl.set("#code-hud-cur", { opacity: 0 }, 2.0);

      // ---------------- lines (word rise on the beat, exits finish before the next) ----------------
      [["#code-l1", 0, 3.5, 7], ["#code-l2", 3.5, 11, 7], ["#code-l3", 11, 15, 9], ["#code-l4", 15, 22.5, 10], ["#code-l5", 22.5, null, 8]]
        .forEach(function (l) {
          wordsIn(l[0], l[1]);
          if (l[2] !== null) wordsOut(l[0], l[2] - (8 + l[3]) * F);
        });

      // ---------------- 0.0 the panels light up, Vibeproof reads every file ----------------
      sheen("#code-tree-sheen", 0.0);
      sheen("#code-panel-sheen", 0.5);
      tabIn("#code-tab-read-t", 13, 0.5);
      const treeY = function (i) { return ROW0 + i * RH + 23; };
      const pass1 = scan("#code-tscan", 1.0, 3.0, 64, 664);
      files.forEach(function (f) {
        const tp = pass1(treeY(f.row));
        tl.fromTo("#code-ff" + f.n, { opacity: 0 }, { opacity: 1, duration: 4 * F, ease: "none" }, tp);
        tl.fromTo("#code-fs" + f.n, { stroke: "#7a8699" }, { stroke: "#3dffa2", duration: 4 * F, ease: "none" }, tp);
        tl.fromTo("#code-fn" + f.n, { color: "#7a8699" }, { color: "#cfe3f0", duration: 4 * F, ease: "none" }, tp);
        flash("#code-fn" + f.n, tp);
        tl.fromTo("#code-rl" + f.n, { clipPath: SHUT }, { clipPath: OPEN, duration: 6 * F, ease: "power3.out" }, tp);
      });
      scrollOut("#code-read-inner", 3.0);
      tabOut("#code-tab-read-t", 3.0);

      // ---------------- 3.5 git history; 4.0-7.0 the scan sweeps the tree and the commits ----------------
      tabIn("#code-tab-git-t", 7, 3.5);
      tl.fromTo("#code-git-rail", { scaleY: 0 }, { scaleY: 1, duration: 0.5, ease: "power2.inOut" }, 3.5);
      for (let i = 1; i <= 5; i++) {
        tl.fromTo("#code-cr" + i, { x: -30, opacity: 0 }, { x: 0, opacity: 1, duration: 16 * F, ease: "expo.out" }, 3.5 + (i - 1) * 3 * F);
      }
      // commit centres at local y 75 + 96 i: the beam passes them on the beats 4.5 .. 6.5
      scan("#code-pscan", 4.0, 7.0, 75 - 96 - 1, 75 + 96 * 5 - 1);
      for (let i = 1; i <= 5; i++) {
        const tp = 4.0 + i * 0.5;
        tl.fromTo("#code-d" + i, { opacity: 0, scale: 0.4 }, { opacity: 1, scale: 1, duration: 8 * F, ease: "back.out(2)" }, tp);
        flash("#code-cr" + i + " b", tp);
      }
      const pass2 = scan("#code-tscan", 4.0, 7.0, 64 - 66, 664 + 66);
      TREE.forEach(function (r, i) { flash("#code-tr" + i + " .code-mono", pass2(treeY(i))); });

      // ---------------- 7.5 the migration file opens ----------------
      scrollOut("#code-git-inner", 7.0);
      tabOut("#code-tab-git-t", 7.0);
      tabIn("#code-tab-mig-t", 37, 7.5);
      tl.fromTo("#code-hl", { y: ROW0 + 2 * RH, opacity: 0, scaleY: 0.4 }, { y: ROW0 + 2 * RH, opacity: 1, scaleY: 1, duration: 12 * F, ease: "expo.out" }, 7.5);

      // 8.0 the create table lines type in, one line per beat start
      [1, 2, 3, 4].forEach(function (i) { tl.fromTo("#code-ml" + i, { opacity: 0 }, { opacity: 1, duration: 2 * F, ease: "none" }, [8.0, 8.5, 9.5, 10.5][i - 1]); });
      type("#code-m1", 27, 8.0, 28, 60);
      type("#code-m2", 53, 8.5, 80, 60);
      type("#code-m3", 53, 9.5, 132, 60);
      type("#code-m4", 2, 10.5, 184, 60);
      tl.set("#code-caret", { opacity: 0 }, 10.6);

      // 10.5 the scan reads the file and finds the missing line at 11.0
      const pass3 = scan("#code-pscan", 10.5, 11.0, -44, 262);
      ["#code-m1", "#code-m2", "#code-m3", "#code-m4"].forEach(function (s, i) { flash(s, pass3(52 + i * 52)); });
      tl.fromTo("#code-ghost-ln", { opacity: 0 }, { opacity: 1, duration: 4 * F, ease: "power3.out" }, 11.0);
      type("#code-ghost", 51, 11.0, 262, 102);
      tl.set("#code-caret", { opacity: 0 }, 11.5);
      tl.fromTo("#code-ghost-strike", { scaleX: 0 }, { scaleX: 1, duration: 0.5, ease: "power2.inOut" }, 11.5);
      tl.fromTo("#code-flaw1", { opacity: 0, scale: 1.04 }, { opacity: 1, scale: 1, duration: 10 * F, ease: "expo.out" }, 12.0);
      marker("#code-mk1", 12.0);
      // 13.0 found (sound: lock-on blip at film 43.0)
      slam("#code-found1", 13.0);
      tl.fromTo("#code-flaw1", { opacity: 1 }, { opacity: 0.55, duration: 0.5, ease: "power2.out", immediateRender: false }, 13.5);
      pulse("#code-found1", 14.0);

      // ---------------- 14.5 switch to src/lib/supabase.ts ----------------
      scrollOut("#code-mig-inner", 14.5);
      tabOut("#code-tab-mig-t", 14.5);
      tabIn("#code-tab-adm-t", 19, 14.85);
      tl.fromTo("#code-hl", { y: ROW0 + 2 * RH }, { y: ROW0 + 5 * RH, duration: 16 * F, ease: "power3.inOut", immediateRender: false }, 14.5);

      // 15.0 the supabaseAdmin line types in
      [1, 2, 3, 4].forEach(function (i) { tl.fromTo("#code-al" + i, { opacity: 0 }, { opacity: 1, duration: 2 * F, ease: "none" }, [15.0, 15.5, 16.0, 17.0][i - 1]); });
      type("#code-a1", 42, 15.0, 28, 90);
      type("#code-a2", 36, 15.5, 80, 90);
      type("#code-a3", 48, 16.0, 132, 90);
      type("#code-a4", 2, 17.0, 184, 90);
      tl.set("#code-caret", { opacity: 0 }, 17.1);
      const pass4 = scan("#code-pscan", 17.0, 18.0, -44, 260);
      ["#code-a1", "#code-a2", "#code-a3", "#code-a4"].forEach(function (s, i) { flash(s, pass4(52 + i * 52)); });

      // 18.0 the service role key turns red, underlined; the line marks "admin key"
      tl.fromTo("#code-key", { color: "#cfe3f0", textShadow: "0 0 18px rgba(255,59,92,0)" }, { color: RED, textShadow: "0 0 18px rgba(255,59,92,0.6)", duration: 8 * F, ease: "power2.out" }, 18.0);
      tl.fromTo("#code-key-ul", { scaleX: 0 }, { scaleX: 1, duration: 14 * F, ease: "power3.out" }, 18.0);
      tl.fromTo("#code-flaw2", { opacity: 0, scale: 1.05 }, { opacity: 1, scale: 1, duration: 10 * F, ease: "expo.out" }, 18.5);
      marker("#code-mk2", 18.0);
      // 20.0 found (sound: lock-on blip at film 50.0)
      slam("#code-found2", 20.0);
      tl.fromTo("#code-flaw2", { opacity: 1 }, { opacity: 0.55, duration: 0.5, ease: "power2.out", immediateRender: false }, 20.5);
      pulse("#code-found2", 21.0);

      // ---------------- 22.5 both found by reading: the two files get a red pip in the tree ----------------
      tl.fromTo("#code-pip1", { scale: 0, opacity: 0 }, { scale: 1, opacity: 1, duration: 12 * F, ease: "back.out(2.5)" }, 23.0);
      tl.fromTo("#code-pip2", { scale: 0, opacity: 0 }, { scale: 1, opacity: 1, duration: 12 * F, ease: "back.out(2.5)" }, 23.5);
      pulse("#code-found2", 24.0);
      pulse("#code-found2", 25.0);

      tl.set({}, {}, DUR);
      window.__timelines = window.__timelines || {};
      window.__timelines["code"] = tl;
    })();
  </script>
</template>
