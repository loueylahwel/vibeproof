  <script>
    (function () {
      const tl = gsap.timeline({ paused: true });
      const SCENE = 26;
      const F = 1 / 30;
      const CW = 16.8; // JetBrains Mono advance at 28 px (0.6 em)
      const SHUT = "inset(0% 100% 0% 0%)";
      const OPEN = "inset(0% 0% 0% 0%)";
      const TEXT = "#f2f2f2";

      // ---- kinetic type: words rise from the mask, leave upward through it
      function wordsIn(line, t) {
        tl.fromTo(line + " .code-w", { y: 66 }, { y: 0, duration: 14 * F, ease: "power4.out", stagger: 2 * F }, t);
      }
      function wordsOut(line, t) {
        tl.fromTo(line + " .code-w, " + line + " .code-mk-bar", { y: 0 }, { y: -66, duration: 8 * F, ease: "power2.in", stagger: F, immediateRender: false }, t);
      }
      function marker(bar, t) {
        tl.fromTo(bar, { scaleX: 0 }, { scaleX: 1, duration: 10 * F, ease: "power3.out" }, t);
        tl.fromTo(bar + " ~ .code-w", { color: TEXT }, { color: "#ffffff", duration: 6 * F, ease: "none" }, t);
      }

      // ---- typing: one character per step, the caret follows in the same steps
      function type(sel, n, t, rowLeft, rowTop, cps) {
        const d = Math.max(n / (cps || 60), F);
        tl.fromTo(sel, { clipPath: SHUT }, { clipPath: OPEN, duration: d, ease: "steps(" + n + ")" }, t);
        tl.set("#code-caret", { opacity: 1, y: rowTop + 7 }, t);
        tl.fromTo("#code-caret", { x: rowLeft }, { x: rowLeft + n * CW, duration: d, ease: "steps(" + n + ")", immediateRender: false }, t);
        return t + d;
      }
      // a tab label types in without a caret
      function tabIn(sel, n, t) {
        tl.fromTo(sel, { clipPath: SHUT, y: 0, opacity: 1 }, { clipPath: OPEN, duration: n / 90, ease: "steps(" + n + ")" }, t);
      }
      function tabOut(sel, t) {
        tl.fromTo(sel, { y: 0, opacity: 1 }, { y: -20, opacity: 0, duration: 8 * F, ease: "power2.in", immediateRender: false }, t);
      }
      // panel content scrolls up out of the body, under the tab bar
      function scrollOut(sel, t) {
        tl.fromTo(sel, { y: 0, opacity: 1 }, { y: -72, opacity: 0, duration: 10 * F, ease: "power2.in", immediateRender: false }, t);
      }
      // things that appear overshoot
      function appear(sel, t) {
        tl.fromTo(sel, { scale: 0.9, opacity: 0 }, { scale: 1, opacity: 1, duration: 16 * F, ease: "back.out(1.7)" }, t);
      }
      // "found" slams in, the panel recoils 6 px and settles
      function slam(sel, t) {
        tl.fromTo(sel, { scale: 1.45, opacity: 0 }, { scale: 1, opacity: 1, duration: 9 * F, ease: "power4.out" }, t);
        tl.fromTo("#code-panelgrp", { y: 0 }, { y: 6, duration: 2 * F, ease: "power2.out", immediateRender: false }, t + F);
        tl.fromTo("#code-panelgrp", { y: 6 }, { y: 0, duration: 10 * F, ease: "power2.out", immediateRender: false }, t + 3 * F);
      }

      // ---- camera
      // cuts: in from +420 px (12 f, power4.out), out to -420 px (last 10 f, power4.in)
      tl.fromTo("#code-cam", { x: 420 }, { x: 0, duration: 18 * F, ease: "expo.out" }, 0);
      tl.fromTo("#code-cam", { x: 0 }, { x: -420, duration: 10 * F, ease: "power3.in", immediateRender: false }, SCENE - 10 * F);
      // slow push over the whole scene
      tl.fromTo("#code-dolly", { scale: 1 }, { scale: 1.06, duration: SCENE, ease: "sine.inOut" }, 0);
      // re-targets: attention leads the frame
      let cx = 60, cy = 40;
      tl.fromTo("#code-dolly", { x: cx, y: cy }, { x: cx, y: cy, duration: F, ease: "none" }, 0);
      function aim(t, x, y, dur, ease) {
        tl.fromTo("#code-dolly", { x: cx, y: cy }, { x: x, y: y, duration: dur || 20 * F, ease: ease || "power2.inOut", immediateRender: false }, t);
        cx = x;
        cy = y;
      }
      aim(1.6, 40, -10); // follow the reading down the tree
      aim(3.5, -30, 30); // the history opens in the panel
      aim(4.6, -30, 0, 2, "sine.inOut"); // ride the scan bar down
      aim(7.6, -70, 80); // push toward the code line as the file opens
      aim(8.6, -75, 40, 2, "sine.inOut"); // track the caret
      aim(11.0, -30, 0); // the missing line
      aim(12.4, -64, 30); // toward the tag before it slams
      aim(14.4, 0, 70); // the next file
      aim(15.4, -44, 40, 2, "sine.inOut"); // track the caret
      aim(18.0, -44, 100); // the service role key
      aim(21.0, 10, 40); // pull back
      aim(22.5, 40, 0);
      aim(24.2, 0, 30);

      // ---- lines
      const lines = [
        ["#code-l1", 0, 3.5, 7],
        ["#code-l2", 3.5, 11, 7],
        ["#code-l3", 11, 15, 9],
        ["#code-l4", 15, 22.5, 10],
        ["#code-l5", 22.5, null, 8],
      ];
      lines.forEach(function (l) {
        wordsIn(l[0], l[1]);
        if (l[2] !== null) wordsOut(l[0], l[2] - (8 + l[3]) * F);
      });

      // 0.9 Vibeproof reads every file: each file lights up in turn
      for (let i = 1; i <= 8; i++) {
        const t = 0.9 + (i - 1) * 0.2;
        tl.fromTo("#code-f" + i, { opacity: 0 }, { opacity: 1, duration: 4 * F, ease: "none" }, t);
        tl.fromTo("#code-n" + i, { color: "#8a8a8a" }, { color: TEXT, duration: 4 * F, ease: "none" }, t);
      }

      // 3.5 git history: rail draws, commits overshoot in 6 frames apart
      tl.fromTo("#code-git-rail", { scaleY: 0 }, { scaleY: 1, duration: 0.8, ease: "power2.inOut" }, 3.5);
      tabIn("#code-tab-git-t", 7, 3.5);
      for (let i = 1; i <= 5; i++) appear("#code-cr" + i, 3.5 + (i - 1) * 6 * F);

      // scan bar: 2 px line sweeping y 232 -> 832 from 3.9 to 6.9
      const SCAN0 = 3.9, Y0 = 232, Y1 = 832, SPD = (Y1 - Y0) / 3;
      tl.fromTo("#code-scan", { y: Y0 }, { y: Y1, duration: 3, ease: "none" }, SCAN0);
      tl.fromTo("#code-scan", { opacity: 1 }, { opacity: 0, duration: 0.2, ease: "power2.in", immediateRender: false }, 6.95);
      const passAt = function (yc) { return SCAN0 + (yc - Y0) / SPD; };
      // commits fill as they are read
      [348, 444, 540, 636, 732].forEach(function (yc, i) {
        tl.fromTo("#code-d" + (i + 1), { opacity: 0 }, { opacity: 1, duration: 0.1, ease: "none" }, passAt(yc));
      });

      // 7.2 git scrolls away, 7.6 the migration file opens
      scrollOut("#code-git-inner", 7.2);
      tabOut("#code-tab-git-t", 7.2);
      tabIn("#code-tab-mig-t", 37, 7.6);
      tl.fromTo("#code-hl-box", { y: 336 }, { y: 336, duration: F, ease: "none" }, 7.6);
      tl.fromTo("#code-hl-box", { scale: 0.9, opacity: 0 }, { scale: 1, opacity: 1, duration: 16 * F, ease: "back.out(1.7)" }, 7.6);

      // 8.0 the create table line types in
      tl.fromTo("#code-mig-ln5", { opacity: 0 }, { opacity: 1, duration: F, ease: "none" }, 8.0);
      let t = 8.0;
      t = type("#code-m1", 27, t, 702, 324) + 0.08;
      t = type("#code-m2", 54, t, 702, 372) + 0.08;
      t = type("#code-m3", 54, t, 702, 420) + 0.08;
      t = type("#code-m4", 2, t, 702, 468);
      tl.set("#code-caret", { opacity: 0 }, t + 0.2);

      // 11.0 the missing line types in red, then is struck through
      tl.fromTo("#code-ghost-ln", { opacity: 0 }, { opacity: 1, duration: 6 * F, ease: "power3.out" }, 11.0);
      t = type("#code-ghost", 51, 11.0, 702, 516, 100);
      tl.set("#code-caret", { opacity: 0 }, t + 0.1);
      tl.fromTo("#code-ghost-strike", { scaleX: 0 }, { scaleX: 1, duration: 0.5, ease: "power2.inOut" }, 11.6);
      marker("#code-mk1", 12.0);
      // 13.0 found
      slam("#code-found1", 13.0);

      // 14.4 switch to src/lib/supabase.ts
      scrollOut("#code-mig-inner", 14.4);
      tabOut("#code-tab-mig-t", 14.4);
      tabIn("#code-tab-adm-t", 19, 14.8);
      // the tree highlight travels to the file and settles
      tl.fromTo("#code-hl-box", { y: 336 }, { y: 486, duration: 16 * F, ease: "power3.out", immediateRender: false }, 14.4);
      tl.fromTo("#code-hl-box", { y: 486 }, { y: 480, duration: 4 * F, ease: "power2.out", immediateRender: false }, 14.4 + 16 * F);

      // 15.0 the supabaseAdmin line types in
      tl.fromTo("#code-adm-ln3", { opacity: 0 }, { opacity: 1, duration: F, ease: "none" }, 15.0);
      t = 15.0;
      t = type("#code-a1", 42, t, 702, 324) + 0.08;
      t = type("#code-a2", 36, t, 702, 372) + 0.08;
      t = type("#code-a3", 48, t, 702, 420) + 0.08;
      t = type("#code-a4", 2, t, 702, 468);
      tl.set("#code-caret", { opacity: 0 }, t + 0.2);

      // 18.0 the service role key, underlined in red; the line marks "admin key"
      tl.fromTo("#code-key-ul", { scaleX: 0 }, { scaleX: 1, duration: 0.6, ease: "power3.out" }, 18.0);
      marker("#code-mk2", 18.0);
      // 20.0 found
      slam("#code-found2", 20.0);

      // hold the end state to the scene length
      tl.set({}, {}, SCENE);
      window.__timelines = window.__timelines || {};
      window.__timelines["code"] = tl;
    })();
  </script>
</template>
