  <script>
    (function () {
      const tl = gsap.timeline({ paused: true });
      const SCENE = 26;
      const CW = 16.8; // JetBrains Mono advance at 28 px (0.6 em)
      const SHUT = "inset(0% 100% 0% 0%)";
      const OPEN = "inset(0% 0% 0% 0%)";
      const GONE = "inset(0% 0% 0% 100%)";

      function wipeIn(sel, t, dur) {
        tl.fromTo(sel, { clipPath: SHUT }, { clipPath: OPEN, duration: dur || 0.6, ease: "power3.out" }, t);
      }
      function wipeOut(sel, t) {
        tl.fromTo(sel, { clipPath: OPEN }, { clipPath: GONE, duration: 0.4, ease: "power2.in", immediateRender: false }, t);
      }
      // Typing: reveal one character per step, caret follows in the same steps.
      function type(sel, n, t, rowLeft, rowTop, cps) {
        const d = Math.max(n / (cps || 60), 1 / 30);
        tl.fromTo(sel, { clipPath: SHUT }, { clipPath: OPEN, duration: d, ease: "steps(" + n + ")" }, t);
        tl.set("#code-caret", { opacity: 1, y: rowTop + 7 }, t);
        tl.fromTo("#code-caret", { x: rowLeft }, { x: rowLeft + n * CW, duration: d, ease: "steps(" + n + ")", immediateRender: false }, t);
        return t + d;
      }
      function pop(sel, t) {
        tl.fromTo(sel, { opacity: 0, scale: 0.8 }, { opacity: 1, scale: 1, duration: 0.27, ease: "power3.out" }, t);
      }

      // lines: wipe in left to right, wipe out before the next one
      const lines = [
        ["#code-l1-t", 0, 3.5],
        ["#code-l2-t", 3.5, 11],
        ["#code-l3-t", 11, 15],
        ["#code-l4-t", 15, 22.5],
        ["#code-l5-t", 22.5, null],
      ];
      lines.forEach(function (l) {
        wipeIn(l[0], l[1]);
        if (l[2] !== null) wipeOut(l[0], l[2] - 0.4);
      });

      // 3.5 git history: rail draws, commits wipe in 6 frames apart
      tl.fromTo("#code-git-rail", { scaleY: 0 }, { scaleY: 1, duration: 0.8, ease: "power2.inOut" }, 3.5);
      wipeIn("#code-tab-git-t", 3.5);
      for (let i = 1; i <= 5; i++) wipeIn("#code-c" + i, 3.5 + (i - 1) * 0.2);

      // scan bar: 2 px ink line sweeping y 232 -> 832 from 3.9 to 6.9
      const SCAN0 = 3.9, Y0 = 232, Y1 = 832, SPD = (Y1 - Y0) / 3;
      tl.fromTo("#code-scan", { y: Y0 }, { y: Y1, duration: 3, ease: "none" }, SCAN0);
      tl.fromTo("#code-scan", { opacity: 1 }, { opacity: 0, duration: 0.2, ease: "power2.in", immediateRender: false }, 6.95);
      const passAt = function (yc) { return SCAN0 + (yc - Y0) / SPD; };
      // files fill as they are read
      [360, 504, 552, 600, 648, 696, 744, 792].forEach(function (yc, i) {
        tl.fromTo("#code-f" + (i + 1), { opacity: 0 }, { opacity: 1, duration: 0.1, ease: "none" }, passAt(yc));
      });
      // commits fill as they are read
      [348, 444, 540, 636, 732].forEach(function (yc, i) {
        tl.fromTo("#code-d" + (i + 1), { opacity: 0 }, { opacity: 1, duration: 0.1, ease: "none" }, passAt(yc));
      });

      // 7.2 git out, 7.6 the migration file opens
      wipeOut("#code-git-inner", 7.2);
      wipeOut("#code-tab-git-t", 7.2);
      wipeIn("#code-tab-mig-t", 7.6);
      tl.fromTo("#code-hl-box", { y: 336 }, { y: 336, duration: 0.01 }, 7.6);
      wipeIn("#code-hl-box", 7.6);

      // 8.0 the create table line types in
      tl.fromTo("#code-mig-ln5", { opacity: 0 }, { opacity: 1, duration: 0.01 }, 8.0);
      let t = 8.0;
      t = type("#code-m1", 27, t, 782, 324) + 0.08;
      t = type("#code-m2", 54, t, 782, 372) + 0.08;
      t = type("#code-m3", 54, t, 782, 420) + 0.08;
      t = type("#code-m4", 2, t, 782, 468);
      tl.set("#code-caret", { opacity: 0 }, t + 0.2);

      // 11.0 the missing line: red, struck through
      tl.fromTo("#code-ghost-ln", { opacity: 0 }, { opacity: 1, duration: 0.2, ease: "power3.out" }, 11.0);
      wipeIn("#code-ghost", 11.0);
      tl.fromTo("#code-ghost-strike", { scaleX: 0 }, { scaleX: 1, duration: 0.5, ease: "power2.inOut" }, 11.6);
      // 13.0 found
      pop("#code-found1", 13.0);

      // 14.4 switch to src/lib/supabase.ts
      wipeOut("#code-mig-inner", 14.4);
      wipeOut("#code-tab-mig-t", 14.4);
      wipeIn("#code-tab-adm-t", 14.8);
      tl.fromTo("#code-hl-box", { y: 336 }, { y: 480, duration: 0.8, ease: "power2.inOut", immediateRender: false }, 14.4);

      // 15.0 the supabaseAdmin line types in
      tl.fromTo("#code-adm-ln3", { opacity: 0 }, { opacity: 1, duration: 0.01 }, 15.0);
      t = 15.0;
      t = type("#code-a1", 42, t, 782, 324) + 0.08;
      t = type("#code-a2", 36, t, 782, 372) + 0.08;
      t = type("#code-a3", 48, t, 782, 420) + 0.08;
      t = type("#code-a4", 2, t, 782, 468);
      tl.set("#code-caret", { opacity: 0 }, t + 0.2);

      // 18.0 the service role key, underlined in red
      tl.fromTo("#code-key-ul", { scaleX: 0 }, { scaleX: 1, duration: 0.6, ease: "power3.out" }, 18.0);
      // 20.0 found
      pop("#code-found2", 20.0);

      // hold the end state to the scene length
      tl.set({}, {}, SCENE);
      window.__timelines = window.__timelines || {};
      window.__timelines["code"] = tl;
    })();
  </script>
