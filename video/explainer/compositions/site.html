    (function () {
      const tl = gsap.timeline({ paused: true });
      const SCENE = 26;
      const CW = 16.8; // JetBrains Mono advance at 28 px (0.6 em)
      const SHUT = "inset(0% 100% 0% 0%)";
      const OPEN = "inset(0% 0% 0% 0%)";
      const GONE = "inset(0% 0% 0% 100%)";

      function wipeIn(sel, t, dur) {
        tl.fromTo(sel, { clipPath: SHUT }, { clipPath: OPEN, duration: dur || 0.6, ease: "power3.out" }, t);
      }
      function wipeOut(sel, t) {
        tl.fromTo(sel, { clipPath: OPEN }, { clipPath: GONE, duration: 0.4, ease: "power2.in", immediateRender: false }, t);
      }
      // Typing: one character per step, the caret follows in the same steps.
      function type(sel, n, t, rowLeft, rowTop, cps) {
        const d = Math.max(n / (cps || 50), 1 / 30);
        tl.fromTo(sel, { clipPath: SHUT }, { clipPath: OPEN, duration: d, ease: "steps(" + n + ")" }, t);
        tl.set("#site-caret", { opacity: 1, y: rowTop + 7 }, t);
        tl.fromTo("#site-caret", { x: rowLeft }, { x: rowLeft + n * CW, duration: d, ease: "steps(" + n + ")", immediateRender: false }, t);
        tl.set("#site-caret", { opacity: 0 }, t + d + 0.15);
        return t + d;
      }
      // a status appears whole, the way a response lands
      function status(sel, t) {
        tl.fromTo(sel, { clipPath: SHUT }, { clipPath: OPEN, duration: 0.2, ease: "power3.out" }, t);
      }
      function pop(sel, t) {
        tl.fromTo(sel, { opacity: 0, scale: 0.8 }, { opacity: 1, scale: 1, duration: 0.27, ease: "power3.out" }, t);
      }

      // lines
      const lines = [
        ["#site-l1-t", 0, 4],
        ["#site-l2-t", 4, 8.5],
        ["#site-l3-t", 8.5, 14],
        ["#site-l4-t", 14, 19],
        ["#site-l5-t", 19, 23],
        ["#site-l6-t", 23, null],
      ];
      lines.forEach(function (l) {
        wipeIn(l[0], l[1]);
        if (l[2] !== null) wipeOut(l[0], l[2] - 0.4);
      });

      // 4.0 / 5.0 request rows type in, one by one
      type("#site-r1", 5, 4.0, 1084, 240);
      status("#site-s1", 4.45);
      type("#site-r2", 20, 5.0, 1084, 288);

      pop("#site-found1", 11.5);
      wipeOut("#site-jsinner", 13.4);

      // 14.0 the database request, its answer, the row that came back
      type("#site-r3", 35, 14.0, 1084, 336);
      tl.fromTo("#site-db", { clipPath: SHUT }, { clipPath: OPEN, duration: 0.6, ease: "power3.out" }, 14.2);
      status("#site-s3", 15.2);
