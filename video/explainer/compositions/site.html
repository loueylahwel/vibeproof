        }
        const floor = document.getElementById(id + "-floor");
        const draw = (T) => {
          if (floor) floor.style.backgroundPosition = "0px " + ((T * 40) % 80) + "px";
          for (const d of dots) {
            const y = ((d.y - T * 14 * d.z) % 1180 + 1180) % 1180 - 50;
            const x = d.x + Math.sin(T * 0.35 + d.ph) * 18 * d.z;
            d.el.style.transform = "translate(" + x.toFixed(1) + "px," + y.toFixed(1) + "px)";
          }
        };
        const p = { t: 0 };
        tl.fromTo(p, { t: 0 }, { t: DUR, duration: DUR, ease: "none", onUpdate: () => draw(FILM_START + p.t) }, 0);
        draw(FILM_START);
      })(tl, "site", FILM_START, DUR);

      // HUD label characters
      const HUD = "04 / SCAN THE LIVE SITE";
      const hud = document.getElementById("site-hud");
      for (let i = 0; i < HUD.length; i++) {
        const sp = document.createElement("span");
        sp.textContent = HUD[i];
        hud.insertBefore(sp, document.getElementById("site-hud-cur"));
      }

      // ---------------- helpers ----------------
      function wordsIn(line, t) {
        tl.fromTo(line + " .site-w", { y: 84 }, { y: 0, duration: 14 * F, ease: "power4.out", stagger: 2 * F }, t);
      }
      function wordsOut(line, t) {
        tl.fromTo(line + " .site-w, " + line + " .site-ul", { y: 0 }, { y: -84, duration: 8 * F, ease: "power3.in", stagger: F, immediateRender: false }, t);
      }
      function marker(mk, t) {
        tl.fromTo(mk + " .site-ul", { scaleX: 0, opacity: 1 }, { scaleX: 1, duration: 10 * F, ease: "power3.out" }, t);
        tl.fromTo(mk + " .site-w", { color: TEXT, textShadow: "0 0 18px rgba(255,59,92,0)" },
          { color: RED, textShadow: "0 0 18px rgba(255,59,92,0.6)", duration: 8 * F, ease: "power2.out" }, t);
      }
      // typing into the request log: one character per step, the caret follows
      function type(sel, n, t, top, cps) {
        const d = n / cps;
        tl.fromTo(sel, { clipPath: SHUT }, { clipPath: OPEN, duration: d, ease: "steps(" + n + ")" }, t);
        tl.set("#site-caret", { opacity: 1, y: top + 7 }, t);
        tl.fromTo("#site-caret", { x: 24 }, { x: 24 + n * CW, duration: d, ease: "steps(" + n + ")", immediateRender: false }, t);
        return t + d;
      }
      function reveal(sel, n, t, cps) {
        tl.fromTo(sel, { clipPath: SHUT }, { clipPath: OPEN, duration: n / (cps || 120), ease: "steps(" + n + ")" }, t);
      }
      function status(sel, t) { // a response lands whole, with overshoot
        tl.fromTo(sel, { scale: 0.8, opacity: 0 }, { scale: 1, opacity: 1, duration: 14 * F, ease: "back.out(2)" }, t);
      }
      function sheen(sel, t) {
        tl.fromTo(sel, { xPercent: -110 }, { xPercent: 360, duration: 18 * F, ease: "power2.inOut" }, t);
      }
      function scan(sel, t0, t1, y0, y1) {
        tl.fromTo(sel, { y: y0 }, { y: y1, duration: t1 - t0, ease: "none", immediateRender: false }, t0);
        tl.fromTo(sel, { opacity: 0 }, { opacity: 1, duration: 4 * F, ease: "none", immediateRender: false }, t0);
        tl.fromTo(sel, { opacity: 1 }, { opacity: 0, duration: 5 * F, ease: "power2.in", immediateRender: false }, t1 - 5 * F);
        return function (y) { return t0 + (y - y0) / (y1 - y0) * (t1 - t0); };
      }
      function flash(sel, t) {
        tl.fromTo(sel, { textShadow: "0 0 14px rgba(61,255,162,0.95)" },
          { textShadow: "0 0 14px rgba(61,255,162,0)", duration: 0.5, ease: "power2.out", immediateRender: false }, t);
      }
      function slam(sel, panel, t) {
        tl.fromTo(sel + " .site-tag", { scale: 1.45, opacity: 0 }, { scale: 1, opacity: 1, duration: 9 * F, ease: "power4.out" }, t);
        tl.fromTo(sel + " .site-lock", { scale: 1.9, opacity: 0 }, { scale: 1, opacity: 1, duration: 9 * F, ease: "expo.out" }, t);
        tl.fromTo(sel + " .site-lock", { opacity: 1 }, { opacity: 0.35, duration: 0.5, ease: "power2.out", immediateRender: false }, t + 0.5);
        tl.fromTo(sel + " .site-halo", { opacity: 0, scale: 0.6 }, { opacity: 1, scale: 1, duration: 4 * F, ease: "power2.out" }, t);
        tl.fromTo(sel + " .site-halo", { opacity: 1 }, { opacity: 0.25, duration: 0.8, ease: "power2.out", immediateRender: false }, t + 4 * F);
        tl.fromTo(panel, { y: 0 }, { y: 7, duration: 2 * F, ease: "power2.out", immediateRender: false }, t + F);
        tl.fromTo(panel, { y: 7 }, { y: 0, duration: 10 * F, ease: "power2.out", immediateRender: false }, t + 3 * F);
      }
      function pulse(sel, t) {
        tl.fromTo(sel + " .site-halo", { opacity: 0.6 }, { opacity: 0.25, duration: 0.5, ease: "power2.out", immediateRender: false }, t);
      }

      // ---------------- camera ----------------
      tl.fromTo("#site-cam, #site-txt", { scale: 0.94 }, { scale: 1, duration: 16 * F, ease: "expo.out" }, 0);
      tl.fromTo("#site-cam, #site-txt", { opacity: 0 }, { opacity: 1, duration: 6 * F, ease: "none" }, 0);
      tl.fromTo("#site-cam, #site-txt", { scale: 1 }, { scale: 1.15, duration: 12 * F, ease: "power2.in", immediateRender: false }, DUR - 12 * F);
      tl.fromTo("#site-cam, #site-txt", { opacity: 1 }, { opacity: 0, duration: 6 * F, ease: "power2.in", immediateRender: false }, DUR - 6 * F);
      tl.fromTo("#site-sweep", { y: -120, opacity: 0 }, { y: 1080, duration: 8 * F, ease: "power1.in", immediateRender: false }, DUR - 8 * F);
      tl.fromTo("#site-sweep", { opacity: 0 }, { opacity: 1, duration: F, ease: "none" }, DUR - 8 * F);

      tl.fromTo("#site-dolly", { scale: 1 }, { scale: 1.05, duration: DUR, ease: "sine.inOut" }, 0);
      let cx = 0, cy = 30, fx = 540, fy = 540;
      tl.fromTo("#site-dolly", { x: cx, y: cy }, { x: cx, y: cy, duration: F, ease: "none" }, 0);
      tl.fromTo("#site-focus", { x: fx, y: fy }, { x: fx, y: fy, duration: F, ease: "none" }, 0);
      function aim(t, x, y, gx, gy, dur) {
        tl.fromTo("#site-dolly", { x: cx, y: cy }, { x: x, y: y, duration: dur || 24 * F, ease: "power2.inOut", immediateRender: false }, t);
        tl.fromTo("#site-focus", { x: fx, y: fy }, { x: gx, y: gy, duration: dur || 24 * F, ease: "power2.inOut", immediateRender: false }, t);
        cx = x; cy = y; fx = gx; fy = gy;
      }
      aim(2.0, 30, 10, 500, 420);         // the visitor ticks a task
      aim(3.5, -10, 40, 1400, 380);       // toward the log, before the first request
      aim(5.5, -30, 20, 1400, 420);       // follow the second row
      aim(7.0, 0, 10, 1000, 520);         // pull back, the JavaScript is coming
      aim(8.5, -30, 0, 1420, 700);      // the JavaScript
      aim(10.0, -40, -10, 1420, 800);     // the decoded key
      aim(13.5, -20, 20, 1400, 520);      // the database request
      aim(15.5, -40, 0, 1500, 700);     // the row that comes back
      aim(18.5, -30, 30, 1420, 420);      // the answer, before "found"
      aim(21.0, 10, 20, 960, 520);        // pull back
      aim(23.0, -20, 30, 1400, 420);      // every request only reads
      aim(24.5, 0, 20, 1100, 500, 1.0);

      // panels in 3D, slowly turning toward the camera over the beats
      gsap.set("#site-app", { rotationY: -13, rotationX: 6 });
      gsap.set("#site-log", { rotationY: -9, rotationX: 5 });
      gsap.set("#site-js", { rotationY: -9, rotationX: 4 });
      gsap.set("#site-db", { rotationY: -10, rotationX: 4 });
      function turn(sel, t, ry, rx, dur) {
        tl.to(sel, { rotationY: ry, rotationX: rx, duration: dur, ease: "sine.inOut" }, t);
      }
      turn("#site-app", 0, -8, 4, 4);
      turn("#site-log", 0, -9, 4, 4);
      turn("#site-app", 4, -11, 5, 4.5);
      turn("#site-log", 4, -6, 3, 4.5);
      turn("#site-js", 8.5, -5, 2, 5);
      turn("#site-log", 8.5, -9, 4, 5.5);
      turn("#site-log", 14, -5, 2, 6);
      turn("#site-db", 14, -5, 2, 6);
      turn("#site-app", 8.5, -13, 6, 12);
      turn("#site-log", 21, -7, 3, 5);
      turn("#site-app", 21, -9, 4, 5);

      // ---------------- HUD ----------------
      document.querySelectorAll("#site-hud span").forEach(function (sp, i) {
        tl.fromTo(sp, { opacity: 0 }, { opacity: 1, duration: F * 0.5, ease: "none" }, (i + 1) * F);
      });
      tl.fromTo("#site-hud-cur", { x: 0 }, { x: HUD.length * 18.04, duration: HUD.length * F, ease: "steps(" + HUD.length + ")" }, F);
      tl.fromTo("#site-hud-cur", { opacity: 1 }, { opacity: 1, duration: F, ease: "none" }, 0);
      tl.set("#site-hud-cur", { opacity: 0 }, 1.0);
      tl.set("#site-hud-cur", { opacity: 1 }, 1.5);
      tl.set("#site-hud-cur", { opacity: 0 }, 2.0);

      // ---------------- lines ----------------
      [["#site-l1", 0, 4, 9], ["#site-l2", 4, 8.5, 7], ["#site-l3", 8.5, 14, 9], ["#site-l4", 14, 19, 8], ["#site-l5", 19, 23, 8], ["#site-l6", 23, null, 7]]
        .forEach(function (l) {
          wordsIn(l[0], l[1]);
          if (l[2] !== null) wordsOut(l[0], l[2] - (8 + l[3]) * F);
        });

      // ---------------- 0.0 the app and an empty log ----------------
      sheen("#site-app-sheen", 0.0);
      sheen("#site-log-sheen", 0.5);
      reveal("#site-log-t", 8, 0.5, 60);
      // the live dot and the waiting caret blink on the beat
      for (let b = 0; b < 7; b++) {
        tl.set("#site-caret", { opacity: b % 2 ? 0 : 1, x: 24, y: 27 }, 0.5 + b * 0.5);
      }
      for (let b = 0; b < 26; b++) {
        tl.fromTo("#site-live", { opacity: 1, scale: 1.3 }, { opacity: 0.45, scale: 1, duration: 0.45, ease: "power2.out", immediateRender: false }, b);
      }

      // 2.0 a visitor uses the app: the first to-do gets ticked
      tl.fromTo("#site-box1", { scale: 1, borderColor: "#3c4656" }, { scale: 1.25, borderColor: "#3dffa2", duration: 4 * F, ease: "power2.out" }, 2.0);
      tl.fromTo("#site-box1", { scale: 1.25 }, { scale: 1, duration: 12 * F, ease: "back.out(1.7)", immediateRender: false }, 2.0 + 4 * F);
      tl.fromTo("#site-tick-p", { strokeDashoffset: 24 }, { strokeDashoffset: 0, duration: 8 * F, ease: "power3.out" }, 2.0);
      tl.fromTo("#site-todo1", { color: TEXT }, { color: "#7a8699", duration: 8 * F, ease: "none" }, 2.5);
      tl.fromTo("#site-todo1-x", { scaleX: 0 }, { scaleX: 1, duration: 10 * F, ease: "power3.out" }, 2.5);

      // ---------------- 4.0 the page: a scan reads it; request rows type in on the beat ----------------
      const passA = scan("#site-ascan", 4.0, 5.0, 64, 560);
      [1, 2, 3, 4].forEach(function (i) { flash("#site-t" + i + " span", passA(108 + (i - 1) * 108 + 42)); });
      type("#site-r1", 5, 4.0, 20, 40);
      tl.set("#site-caret", { opacity: 0 }, 4.25);
      status("#site-s1", 4.5);
      type("#site-r2", 20, 5.0, 68, 50);
      tl.set("#site-caret", { opacity: 0 }, 5.45);
      status("#site-s2", 5.5);
      // 6.5 / 7.5 a glow pulse on the shipped JavaScript row, on the beat
      tl.fromTo("#site-band2", { opacity: 0 }, { opacity: 1, duration: 6 * F, ease: "power2.out" }, 6.5);
      flash("#site-r2", 6.5);
      flash("#site-r2", 7.5);

      // ---------------- 8.5 the JavaScript, a token inside it, decoded ----------------
      tl.fromTo("#site-js", { opacity: 0, y: 40, scale: 0.96 }, { opacity: 1, y: 0, scale: 1, duration: 18 * F, ease: "expo.out" }, 8.5);
      sheen("#site-js-sheen", 8.5);
      reveal("#site-js-t", 15, 8.5, 90);
      reveal("#site-j1", 25, 8.5);
      reveal("#site-j2", 24, 8.75);
      reveal("#site-j3", 19, 9.0);
      const passJ = scan("#site-jscan", 9.0, 9.5, 0, 190);
      ["#site-j1", "#site-j2", "#site-j3"].forEach(function (s, i) { flash(s, passJ(44 + i * 48)); });
      tl.fromTo("#site-ring", { opacity: 0, scale: 1.15 }, { opacity: 1, scale: 1, duration: 10 * F, ease: "expo.out" }, 9.5);
      tl.fromTo("#site-token", { color: "#ffc46b" }, { color: "#ffe2b0", duration: 6 * F, ease: "none" }, 9.5);
      tl.fromTo("#site-arrow", { scaleY: 0 }, { scaleY: 1, duration: 9 * F, ease: "power2.inOut" }, 10.0);
      tl.fromTo("#site-json", { clipPath: SHUT }, { clipPath: OPEN, duration: 0.45, ease: "steps(26)" }, 10.0);
      tl.fromTo("#site-ring", { opacity: 1 }, { opacity: 0.45, duration: 0.5, ease: "power2.out", immediateRender: false }, 10.5);
      marker("#site-mk1", 10.5);
      // 11.5 found (sound: lock-on blip at film 67.5)
      slam("#site-found1", "#site-js", 11.5);
      pulse("#site-found1", 12.5);
      tl.fromTo("#site-js", { opacity: 1, x: 0 }, { opacity: 0, x: -60, duration: 10 * F, ease: "power3.in", immediateRender: false }, 13.5);
      tl.fromTo("#site-band2", { opacity: 1 }, { opacity: 0, duration: 10 * F, ease: "power3.in", immediateRender: false }, 13.5);

      // ---------------- 14.0 the database request, its answer, the row that came back ----------------
      type("#site-r3", 35, 14.0, 116, 50);
      tl.set("#site-caret", { opacity: 0 }, 14.75);
      tl.fromTo("#site-db", { opacity: 0, scale: 0.9, y: 30 }, { opacity: 1, scale: 1, y: 0, duration: 16 * F, ease: "back.out(1.7)" }, 14.0);
      tl.fromTo("#site-dbrow", { opacity: 0 }, { opacity: 1, duration: 6 * F, ease: "power2.out" }, 15.0);
      status("#site-s3", 15.0);
      // the row travels out of the database and settles
      tl.fromTo("#site-trow", { x: -440 }, { x: 14, duration: 0.6, ease: "power3.out" }, 15.5);
      tl.fromTo("#site-trow", { x: 14 }, { x: 6, duration: 4 * F, ease: "power2.out", immediateRender: false }, 16.1);
      tl.fromTo("#site-dbrow", { opacity: 1 }, { opacity: 0.3, duration: 0.5, ease: "power2.out", immediateRender: false }, 16.0);
      tl.fromTo("#site-nostore .site-w", { y: 44 }, { y: 0, duration: 14 * F, ease: "power4.out", stagger: 2 * F }, 16.5);
      flash("#site-s3", 17.5);

      // ---------------- 19.0 it answered: red underline on the answer, found ----------------
      tl.fromTo("#site-s3", { color: "#3dffa2", textShadow: "0 0 18px rgba(255,59,92,0)" }, { color: RED, textShadow: "0 0 18px rgba(255,59,92,0.6)", duration: 8 * F, ease: "power2.out", immediateRender: false }, 19.0);
      tl.fromTo("#site-s3-ul", { scaleX: 0 }, { scaleX: 1, duration: 0.5, ease: "power3.out" }, 19.0);
      // (sound: lock-on blip at film 75.0)
      slam("#site-found2", "#site-log", 19.0);
      marker("#site-mk2", 19.5);
      pulse("#site-found2", 20.5);
      pulse("#site-found2", 22.0);

      // ---------------- 23.0 every request only reads: each GET lights up on the beat ----------------
      ["#site-r1", "#site-r2", "#site-r3"].forEach(function (s, i) {
        const t = 23.5 + i * 0.5;
        tl.fromTo(s + " .k", { color: "#7fd8ff", textShadow: "0 0 14px rgba(61,255,162,0)" },
          { color: "#3dffa2", textShadow: "0 0 14px rgba(61,255,162,0.8)", duration: 6 * F, ease: "power2.out" }, t);
      });
      pulse("#site-found2", 25.0);

      tl.set({}, {}, DUR);
      window.__timelines = window.__timelines || {};
      window.__timelines["site"] = tl;
    })();
  </script>
</template>
