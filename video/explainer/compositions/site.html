    (function () {

      const SCENE = 26;

      const SHUT = "inset(0% 100% 0% 0%)";
      const OPEN = "inset(0% 0% 0% 0%)";
      const INK = "#0a0a0a";

      // ---- kinetic type: words rise from the mask, leave upward through it

        tl.fromTo(line + " .site-w", { y: h || 66 }, { y: 0, duration: 14 * F, ease: "power4.out", stagger: 2 * F }, t);

        tl.fromTo(line + " .site-w, " + line + " .site-mk-bar", { y: 0 }, { y: -66, duration: 8 * F, ease: "power2.in", stagger: F, immediateRender: false }, t);

      function marker(bar, t) {
        tl.fromTo(bar, { scaleX: 0 }, { scaleX: 1, duration: 10 * F, ease: "power3.out" }, t);
        tl.fromTo(bar + " ~ .site-w", { color: INK }, { color: "#ffffff", duration: 6 * F, ease: "none" }, t);
      }

      // ---- typing: one character per step, the caret follows in the same steps
      function type(sel, n, t, rowLeft, rowTop, cps) {
        const d = Math.max(n / (cps || 50), F);
        tl.fromTo(sel, { clipPath: SHUT }, { clipPath: OPEN, duration: d, ease: "steps(" + n + ")" }, t);
        tl.set("#site-caret", { opacity: 1, y: rowTop + 7 }, t);
        tl.fromTo("#site-caret", { x: rowLeft }, { x: rowLeft + n * CW, duration: d, ease: "steps(" + n + ")", immediateRender: false }, t);
        tl.set("#site-caret", { opacity: 0 }, t + d + 0.15);
        return t + d;
      }
      // code that is already there scrolls into view fast, no caret
      function reveal(sel, n, t, cps) {
        tl.fromTo(sel, { clipPath: SHUT }, { clipPath: OPEN, duration: n / (cps || 120), ease: "steps(" + n + ")" }, t);
      }
      // a response lands whole, with overshoot
      function status(sel, t) {
        tl.fromTo(sel, { scale: 0.9, opacity: 0 }, { scale: 1, opacity: 1, duration: 16 * F, ease: "back.out(1.7)" }, t);
      }
      function appear(sel, t) {
        tl.fromTo(sel, { scale: 0.9, opacity: 0 }, { scale: 1, opacity: 1, duration: 16 * F, ease: "back.out(1.7)" }, t);
      }
      // "found" slams in, its panel recoils 6 px and settles
      function slam(sel, panel, t) {
        tl.fromTo(sel, { scale: 1.45, opacity: 0 }, { scale: 1, opacity: 1, duration: 9 * F, ease: "power4.out" }, t);
        tl.fromTo(panel, { y: 0 }, { y: 6, duration: 2 * F, ease: "power2.out", immediateRender: false }, t + F);
        tl.fromTo(panel, { y: 6 }, { y: 0, duration: 10 * F, ease: "power2.out", immediateRender: false }, t + 3 * F);
      }

      // ---- camera
      // cuts: in from +420 px (12 f, power4.out), out to -420 px (last 10 f, power4.in)
      tl.fromTo("#site-cam", { x: 420 }, { x: 0, duration: 18 * F, ease: "expo.out" }, 0);
      tl.fromTo("#site-cam", { x: 0 }, { x: -420, duration: 10 * F, ease: "power3.in", immediateRender: false }, SCENE - 10 * F);
      // slow push over the whole scene
      tl.fromTo("#site-dolly", { scale: 1 }, { scale: 1.06, duration: SCENE, ease: "sine.inOut" }, 0);
      // re-targets: attention leads the frame
      let cx = 50, cy = 60;
      tl.fromTo("#site-dolly", { x: cx, y: cy }, { x: cx, y: cy, duration: F, ease: "none" }, 0);
      function aim(t, x, y, dur, ease) {
        tl.fromTo("#site-dolly", { x: cx, y: cy }, { x: x, y: y, duration: dur || 20 * F, ease: ease || "power2.inOut", immediateRender: false }, t);
        cx = x;
        cy = y;
      }
      aim(2.4, -20, 90); // toward the empty log, before the first request
      aim(5.0, -50, 60); // follow the second row down
      aim(6.8, 0, 20); // pull back, the JavaScript is coming
      aim(8.5, -40, 10); // the JavaScript
      aim(10.2, -65, 5); // the decoded key
      aim(13.6, -30, 70); // the database request
      aim(15.4, -55, 20); // the row that comes back
      aim(18.6, -40, 80); // the answer, before "found"
      aim(20.6, 0, 40); // pull back
      aim(23.0, -40, 70); // every request only reads
      aim(24.6, -10, 40);

      // ---- lines
      const lines = [
        ["#site-l1", 0, 4, 9],
        ["#site-l2", 4, 8.5, 7],
        ["#site-l3", 8.5, 14, 9],
        ["#site-l4", 14, 19, 8],
        ["#site-l5", 19, 23, 8],
        ["#site-l6", 23, null, 7],

      lines.forEach(function (l) {
        wordsIn(l[0], l[1]);
        if (l[2] !== null) wordsOut(l[0], l[2] - (8 + l[3]) * F);
      });

      // 1.8 a visitor uses the app: the first to-do gets ticked
      tl.fromTo("#site-box1", { scale: 1 }, { scale: 1.25, duration: 4 * F, ease: "power2.out" }, 1.8);
      tl.fromTo("#site-box1", { scale: 1.25 }, { scale: 1, duration: 12 * F, ease: "back.out(1.7)", immediateRender: false }, 1.8 + 4 * F);
      tl.fromTo("#site-tick-p", { strokeDashoffset: 24 }, { strokeDashoffset: 0, duration: 8 * F, ease: "power3.out" }, 1.85);
      tl.fromTo("#site-todo1", { color: INK }, { color: "#6b6b6b", duration: 8 * F, ease: "none" }, 2.0);

      // 4.0 / 5.0 request rows type in, one by one
      type("#site-r1", 5, 4.0, 1004, 240);
      status("#site-s1", 4.45);
      type("#site-r2", 20, 5.0, 1004, 288);
      status("#site-s2", 5.65);

      // 8.5 the JavaScript, a token inside it, decoded
      appear("#site-js", 8.5);
      reveal("#site-j0", 8, 8.6);
      reveal("#site-j1", 25, 8.7);
      reveal("#site-j2", 24, 8.95);
      reveal("#site-j3", 19, 9.2);
      appear("#site-ring", 9.5);
      tl.fromTo("#site-arrow", { scaleY: 0 }, { scaleY: 1, duration: 0.4, ease: "power2.inOut" }, 9.85);

      tl.fromTo("#site-jsinner", { opacity: 1, x: 0 }, { opacity: 0, x: -40, duration: 10 * F, ease: "power2.in", immediateRender: false }, 13.4);

      // 14.0 the database request, its answer, the row that came back
      type("#site-r3", 35, 14.0, 1004, 336);
      appear("#site-db", 14.2);
      status("#site-s3", 15.2);
      // the row travels out of the database and settles
      tl.fromTo("#site-trow", { x: -420 }, { x: 24, duration: 0.7, ease: "power3.out" }, 15.6);
      tl.fromTo("#site-trow", { x: 24 }, { x: 16, duration: 4 * F, ease: "power2.out", immediateRender: false }, 16.3);
      tl.fromTo("#site-nostore .site-w", { y: 44 }, { y: 0, duration: 14 * F, ease: "power4.out", stagger: 2 * F }, 16.6);

      // 19.0 it answered: red underline on the answer, found
      tl.fromTo("#site-s3-ul", { scaleX: 0 }, { scaleX: 1, duration: 0.5, ease: "power3.out" }, 19.0);
      slam("#site-found2", "#site-loggrp", 19.0);
      marker("#site-mk2", 19.8);

      tl.set({}, {}, SCENE);
      window.__timelines = window.__timelines || {};
