  <script>
    (function () {
      const tl = gsap.timeline({ paused: true });
      const F = 1 / 30;
      const D = 18;
      const CAM = "#blind-cam";

      // kinetic type
      function lineIn(sel, t) {
        tl.fromTo(sel + " .blind-w", { yPercent: 110 }, { yPercent: 0, duration: 14 * F, ease: "power4.out", stagger: 2 * F }, t);
      }
      function lineOut(sel, end) {
        const n = document.querySelectorAll(sel + " .blind-w").length;
        tl.fromTo(sel + " .blind-w", { yPercent: 0 }, { yPercent: -110, duration: 8 * F, ease: "power2.in", stagger: F, immediateRender: false }, end - (8 + n) * F);
      }
      function marker(sel, t) {
        tl.fromTo(sel + " .blind-bar", { scaleX: 0, transformOrigin: "0% 50%" }, { scaleX: 1, duration: 10 * F, ease: "power3.out" }, t);
        tl.fromTo(sel, { color: "#f2f2f2" }, { color: "#ffffff", duration: 6 * F, ease: "power2.out" }, t + 2 * F);
      }
      function recoil(sel, t, dx, dy) {
        tl.fromTo(sel, { x: 0, y: 0 }, { x: dx, y: dy, duration: 2 * F, ease: "power2.out", immediateRender: false }, t);
        tl.fromTo(sel, { x: dx, y: dy }, { x: 0, y: 0, duration: 10 * F, ease: "power2.out", immediateRender: false }, t + 2 * F);
      }
      // badges slam in; things that appear overshoot
      function slam(sel, t) {
        tl.fromTo(sel, { opacity: 0 }, { opacity: 1, duration: 2 * F, ease: "none" }, t);
        tl.fromTo(sel, { scale: 1.45 }, { scale: 1, duration: 9 * F, ease: "power4.out" }, t);
      }
      function pop(sel, t) {
        tl.fromTo(sel, { opacity: 0 }, { opacity: 1, duration: 3 * F, ease: "none" }, t);
        tl.fromTo(sel, { scale: 0.9, transformOrigin: "50% 50%" }, { scale: 1, duration: 16 * F, ease: "back.out(1.7)" }, t);
      }

      // camera: push, vertical re-targets (x stays 0 so the seam holds at x 960), cuts in and out
      tl.fromTo(CAM, { scale: 1 }, { scale: 1.06, duration: D, ease: "sine.inOut" }, 0);
      tl.fromTo(CAM, { x: 420 }, { x: 0, duration: 12 * F, ease: "power4.out" }, 0);
      let cy = 0;
      function cam(t, y) {
        tl.fromTo(CAM, { y: cy }, { y: y, duration: 20 * F, ease: "power2.inOut", immediateRender: false }, t);
        cy = y;
      }
      cam(3.0, 40);   // the new table and the line
      cam(6.4, 0);    // "not here" in the code
      cam(9.5, -40);  // the flagged commit
      cam(13.0, 10);  // both "not here" tags
      cam(15.0, 50);  // the closing line
      cam(16.6, 10);
      tl.fromTo(CAM, { x: 0 }, { x: -420, duration: 10 * F, ease: "power4.in", immediateRender: false }, D - 10 * F);

      // labels
      tl.fromTo("#blind-lab-code .blind-w", { yPercent: 110 }, { yPercent: 0, duration: 14 * F, ease: "power4.out", stagger: 2 * F }, 0.15);
      tl.fromTo("#blind-lab-site .blind-w", { yPercent: 110 }, { yPercent: 0, duration: 14 * F, ease: "power4.out", stagger: 2 * F }, 0.25);

      // lines
      lineIn("#blind-d1", 0.05);
      lineOut("#blind-d1", 3.0);
      lineIn("#blind-l1", 3.0);
      marker("#blind-mk-dash", 3.75);
      lineOut("#blind-l1", 9.5);
      lineIn("#blind-l2", 9.5);
      lineOut("#blind-l2", 15.0);
      lineIn("#blind-l3", 15.0);
      marker("#blind-mk-both", 15.55);

      // 3.0: "bookings" appears in the database, the note is drawn beside it
      pop("#blind-bookings-t", 3.0);
      recoil("#blind-site", 3.1, 0, 6);
      tl.fromTo("#blind-note-line", { clipPath: "inset(0% 100% 0% 0%)" }, { clipPath: "inset(0% 0% 0% 0%)", duration: 0.4, ease: "power3.out" }, 3.6);
      tl.fromTo("#blind-note .blind-w", { yPercent: 110 }, { yPercent: 0, duration: 14 * F, ease: "power4.out", stagger: 2 * F }, 3.75);
      // 4.8 / 6.4: the code half has no such file: an empty slot, "not here" slams in
      pop("#blind-ghost1", 4.8);
      slam("#blind-nothere1-t", 6.4);
      recoil("#blind-code", 6.45, 0, 6);
      // 7.6: a scan line searches the tree and finds nothing
      tl.fromTo("#blind-scan", { opacity: 0 }, { opacity: 0.7, duration: 4 * F, ease: "none" }, 7.6);
      tl.fromTo("#blind-scan", { y: 0 }, { y: 236, duration: 0.9, ease: "power2.inOut" }, 7.6);
      tl.fromTo("#blind-scan", { opacity: 0.7 }, { opacity: 0, duration: 6 * F, ease: "none", immediateRender: false }, 8.35);

      // 9.5: focus moves on; the first tag drops to an outline
      tl.fromTo("#blind-nothere1-t", { backgroundColor: "#ff4d4f", borderColor: "#ff4d4f", color: "#ffffff" }, { backgroundColor: "#17171a", borderColor: "#f2f2f2", color: "#f2f2f2", duration: 0.4, ease: "power2.inOut", immediateRender: false }, 9.5);
      // 9.5: the commit dot turns FLAW red
      tl.fromTo("#blind-hot-dot", { opacity: 0 }, { opacity: 1, duration: 3 * F, ease: "none" }, 9.5);
      tl.fromTo("#blind-hot-dot", { scale: 0.5, transformOrigin: "50% 50%" }, { scale: 1, duration: 16 * F, ease: "back.out(1.7)" }, 9.5);
      tl.fromTo("#blind-hotlab .blind-w", { yPercent: 110 }, { yPercent: 0, duration: 14 * F, ease: "power4.out", stagger: 2 * F }, 9.7);
      // 11.0: the site's JS has no such key
      pop("#blind-ghost2", 11.0);
      slam("#blind-nothere2-t", 11.2);
      recoil("#blind-site", 11.25, 0, 6);

      tl.set({}, {}, D);
      window.__timelines = window.__timelines || {};
      window.__timelines["blind"] = tl;
    })();
  </script>
