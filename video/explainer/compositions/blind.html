  <script>
    (function () {
      const tl = gsap.timeline({ paused: true });
      const F = 1 / 30;
      const DUR = 18;
      const FILM_START = 82;
      const P = "#blind";

      // ---- shared world: ground grid scroll + dust from FILM time (continuous across cuts)
      (function world(tl, id, FILM_START, DUR) {
        let s = 20261122;
        const rnd = () => { s |= 0; s = (s + 0x6d2b79f5) | 0; let t = Math.imul(s ^ (s >>> 15), 1 | s);
          t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
        const box = document.getElementById(id + "-dust");
        const dots = [];
        for (let k = 0; k < 54; k++) {
          const d = { x: rnd() * 1920, y: rnd() * 1180, z: 0.3 + rnd() * 0.7, ph: rnd() * 6.283 };
          const el = document.createElement("i");
          const size = 1 + d.z * 2;
          el.style.width = el.style.height = size + "px";
          el.style.opacity = (0.12 + d.z * 0.23).toFixed(3);
          box.appendChild(el); d.el = el; dots.push(d);
        }
        const floor = document.getElementById(id + "-floor");
        const draw = (T) => {
          if (floor) floor.style.backgroundPosition = "0px " + ((T * 40) % 80) + "px";
          for (const d of dots) {
            const y = ((d.y - T * 14 * d.z) % 1180 + 1180) % 1180 - 50;
            const x = d.x + Math.sin(T * 0.35 + d.ph) * 18 * d.z;
            d.el.style.transform = "translate(" + x.toFixed(1) + "px," + y.toFixed(1) + "px)";
          }
        };
        const p = { t: 0 };
        tl.fromTo(p, { t: 0 }, { t: DUR, duration: DUR, ease: "none", onUpdate: () => draw(FILM_START + p.t) }, 0);
        draw(FILM_START);
      })(tl, "blind", FILM_START, DUR);

      // ---- transitions: in (scale 0.94 -> 1, fade 6 f), out (scale -> 1.15, fade, green scan line)
      tl.fromTo(P + "-fx", { scale: 0.94 }, { scale: 1, duration: 16 * F, ease: "expo.out" }, 0);
      tl.fromTo(P + "-fx", { opacity: 0 }, { opacity: 1, duration: 6 * F, ease: "power2.out" }, 0);
      tl.fromTo(P + "-fx", { scale: 1 }, { scale: 1.15, duration: 12 * F, ease: "power2.in", immediateRender: false }, DUR - 12 * F);
      tl.fromTo(P + "-fx", { opacity: 1 }, { opacity: 0, duration: 6 * F, ease: "power2.in", immediateRender: false }, DUR - 6 * F);
      tl.fromTo(P + "-wipe", { y: -122 }, { y: 1080, duration: 8 * F, ease: "power1.in" }, DUR - 8 * F);

      // ---- HUD: types 1 char per frame, block cursor blinks on the beat, gone after 2 s
      (function hud(text) {
        const t = document.querySelector(P + "-hud-t");
        const c = document.querySelector(P + "-hud-c");
        const p = { t: 0 };
        const draw = () => {
          const f = Math.floor(p.t * 30 + 1e-4);
          t.textContent = text.slice(0, Math.min(text.length, f));
          c.style.opacity = p.t < 2 && f % 15 < 8 ? 1 : 0;
        };
        tl.fromTo(p, { t: 0 }, { t: 3, duration: 3, ease: "none", onUpdate: draw }, 0);
        draw();
      })("05 / Blind spots");

      // ---- camera: slow push + beat re-targets
      tl.fromTo(P + "-cam", { scale: 1 }, { scale: 1.05, duration: DUR, ease: "sine.inOut" }, 0);
      let rx = 0, ry = 0;
      const aim = (x, y, at, dur) => {
        tl.fromTo(P + "-rig", { x: rx, y: ry }, { x: x, y: y, duration: dur || 24 * F, ease: "power2.inOut", immediateRender: false }, at);
        rx = x; ry = y;
      };
      let fx = 410;
      const focus = (x, at) => {
        tl.fromTo(P + "-focus", { x: fx }, { x: x, duration: 30 * F, ease: "sine.inOut", immediateRender: false }, at);
        fx = x;
      };
      gsap.set(P + "-focus", { x: 410 });

      // ---- kinetic type
      const wordsIn = (sel, t) =>
        tl.fromTo(sel + " .blind-w", { yPercent: 115 }, { yPercent: 0, duration: 14 * F, ease: "power4.out", stagger: 2 * F }, t);
      const wordsOut = (sel, end) => {
        const n = document.querySelectorAll(sel + " .blind-w").length;
        tl.fromTo(sel + " .blind-w", { yPercent: 0 }, { yPercent: -115, duration: 8 * F, ease: "power2.in", stagger: F, immediateRender: false }, end - (8 + n - 1) * F);
      };
      const marker = (sel, t, col, rgb) => {
        tl.fromTo(sel, { color: "#eaf2f7", textShadow: "0 0 18px rgba(" + rgb + ",0)" },
          { color: col, textShadow: "0 0 18px rgba(" + rgb + ",0.6)", duration: 6 * F, ease: "power2.out" }, t);
        tl.fromTo(sel + " .blind-ul", { scaleX: 0 }, { scaleX: 1, duration: 10 * F, ease: "power3.out" }, t);
      };
      const slam = (sel, t) => {
        tl.fromTo(sel, { opacity: 0 }, { opacity: 1, duration: 2 * F, ease: "none" }, t);
        tl.fromTo(sel, { scale: 1.45 }, { scale: 1, duration: 9 * F, ease: "power4.out" }, t);
      };
      const pop = (sel, t) => {
        tl.fromTo(sel, { opacity: 0 }, { opacity: 1, duration: 4 * F, ease: "none" }, t);
        tl.fromTo(sel, { scale: 0.9 }, { scale: 1, duration: 16 * F, ease: "back.out(1.7)" }, t);
      };
      const sheen = (panel, t, again) =>
        tl.fromTo(panel + " .blind-sheen i", { xPercent: -130, skewX: -15 }, { xPercent: 360, skewX: -15, duration: 18 * F, ease: "power2.inOut", immediateRender: !again }, t);
      // scan line from y0 to y1 (panel px); rows brighten as it passes
      const scan = (sel, y0, y1, t, dur, rows) => {
        tl.fromTo(sel, { y: y0 - 40 }, { y: y1 - 40, duration: dur, ease: "sine.inOut" }, t);
        tl.fromTo(sel, { opacity: 0 }, { opacity: 1, duration: 4 * F, ease: "none" }, t);
        tl.fromTo(sel, { opacity: 1 }, { opacity: 0, duration: 6 * F, ease: "power2.in", immediateRender: false }, t + dur - 6 * F);
        (rows || []).forEach(([el, y]) => {
          const p = Math.min(1, Math.max(0, (y - y0) / (y1 - y0)));
          const at = t + (dur * Math.acos(1 - 2 * p)) / Math.PI;
          tl.fromTo(el, { color: "#3dffa2", textShadow: "0 0 14px rgba(61,255,162,0.7)" },
            { color: "#cfe3f0", textShadow: "0 0 14px rgba(61,255,162,0)", duration: 0.6, ease: "power2.out", immediateRender: false }, at);
        });
      };
      // focus moves on: a red tag cools to muted grey
      const dim = (sel, t) =>
        tl.fromTo(sel, { color: "#ff3b5c", borderColor: "rgba(255,59,92,1)", backgroundColor: "rgba(255,59,92,0.10)" },
          { color: "#7a8699", borderColor: "rgba(122,134,153,0.6)", backgroundColor: "rgba(122,134,153,0.06)", duration: 12 * F, ease: "power2.inOut", immediateRender: false }, t);
      const glowPulse = (sel, t) =>
        tl.fromTo(sel, { scale: 1.06 }, { scale: 1, duration: 12 * F, ease: "power2.out", immediateRender: false }, t);

      // ---- panels in 3D: tilted, opening like a book, turning toward camera beat by beat
      const panelIn = (sel, side, t) => {
        tl.fromTo(sel, { opacity: 0 }, { opacity: 1, duration: 6 * F, ease: "power2.out" }, t);
        tl.fromTo(sel, { y: 80, rotationY: 26 * side, rotationX: 10 }, { y: 0, rotationY: 12 * side, rotationX: 6, duration: 20 * F, ease: "expo.out" }, t);
        sheen(sel, t + 6 * F);
      };
      const turn = (sel, side, a, b, t, dur) =>
        tl.fromTo(sel, { rotationY: a * side, rotationX: a / 2 }, { rotationY: b * side, rotationX: b / 2, duration: dur, ease: "sine.inOut", immediateRender: false }, t);

      // 0.0 the opener, the two halves arrive
      wordsIn(P + "-d1", 0);
      panelIn(P + "-code", 1, 0.5);
      wordsIn(P + "-lab-code", 0.5);
      panelIn(P + "-site", -1, 1.0);
      wordsIn(P + "-lab-site", 1.0);
      aim(0, 6, 1.5, 30 * F);
      turn(P + "-code", 1, 12, 9, 1.5, 1.5);
      turn(P + "-site", -1, 12, 9, 1.5, 1.5);
      wordsOut(P + "-d1", 3.0);

      // 3.0 a table made in the dashboard: the site sees it, the code has no file for it
      wordsIn(P + "-l1", 3.0);
      aim(-20, 0, 3.0);
      focus(864, 3.0);
      pop(P + "-bookings", 3.0);
      tl.fromTo(P + "-bk-hot", { opacity: 0 }, { opacity: 1, duration: 8 * F, ease: "power2.out" }, 3.0);
      tl.fromTo(P + "-note-line", { scaleX: 0, transformOrigin: "0% 50%" }, { scaleX: 1, duration: 10 * F, ease: "power3.out" }, 3.5);
      wordsIn(P + "-note", 3.5);
      marker(P + "-mk-dash", 4.0, "#ff3b5c", "255,59,92");
      turn(P + "-code", 1, 9, 7, 3.0, 2.5);
      turn(P + "-site", -1, 9, 6, 3.0, 2.5);
      // 4.0 the code side searches its tree for that table ...
      aim(20, 0, 4.0, 30 * F);
      focus(-44, 4.0);
      scan(P + "-scan1", 24, 262, 4.0, 1.5, Array.from(document.querySelectorAll(P + "-code .blind-trow span")).map((el, i) => [el, [54, 98, 142, 238][i]]));
      // 5.5 ... and finds nothing
      pop(P + "-ghost1", 5.5);
      slam(P + "-nothere1", 6.0);
      tl.fromTo(P + "-code", { y: 0 }, { y: 6, duration: 2 * F, ease: "power2.out", immediateRender: false }, 6.0);
      tl.fromTo(P + "-code", { y: 6 }, { y: 0, duration: 10 * F, ease: "power2.out", immediateRender: false }, 6.0 + 2 * F);
      aim(10, 8, 7.0, 30 * F);
      glowPulse(P + "-nothere1", 7.0);
      glowPulse(P + "-bookings", 8.0);
      aim(0, 0, 8.0, 30 * F);
      wordsOut(P + "-l1", 9.5);

      // 9.5 a key deleted from the code still lives in git history: the site cannot see it
      wordsIn(P + "-l2", 9.5);
      tl.fromTo(P + "-bk-hot", { opacity: 1 }, { opacity: 0, duration: 12 * F, ease: "power2.inOut", immediateRender: false }, 9.5);
      dim(P + "-nothere1", 9.5);
      aim(20, -14, 9.5);
      
      tl.fromTo(P + "-hotrow", { opacity: 0, scaleX: 0.6, transformOrigin: "0% 50%" }, { opacity: 1, scaleX: 1, duration: 14 * F, ease: "expo.out" }, 9.5);
      pop(P + "-hot-dot", 9.5);
      wordsIn(P + "-hotlab", 10.0);
      turn(P + "-code", 1, 7, 4, 9.5, 3);
      turn(P + "-site", -1, 6, 3, 9.5, 3);
      // 10.5 the site scan reads the shipped JS: no such key there
      aim(-20, -14, 10.5, 30 * F);
      focus(864, 10.5);
      scan(P + "-scan2", 424, 640, 10.5, 1.5, Array.from(document.querySelectorAll(P + "-site .blind-cl")).map((el, i) => [el, 460 + i * 44]));
      pop(P + "-ghost2", 11.5);
      slam(P + "-nothere2", 12.0);
      tl.fromTo(P + "-site", { y: 0 }, { y: 6, duration: 2 * F, ease: "power2.out", immediateRender: false }, 12.0);
      tl.fromTo(P + "-site", { y: 6 }, { y: 0, duration: 10 * F, ease: "power2.out", immediateRender: false }, 12.0 + 2 * F);
      glowPulse(P + "-hot-dot", 13.0);
      aim(0, -8, 13.0, 30 * F);
      glowPulse(P + "-nothere2", 14.0);
      wordsOut(P + "-l2", 15.0);

      // 15.0 so Vibeproof scans both: both halves light up and are read at once
      wordsIn(P + "-l3", 15.0);
      dim(P + "-nothere2", 15.0);
      tl.fromTo(P + "-hot-dot", { opacity: 1 }, { opacity: 0, duration: 12 * F, ease: "power2.inOut", immediateRender: false }, 15.0);
      tl.fromTo(P + "-hotrow", { backgroundColor: "rgba(255,59,92,0.10)", borderLeftColor: "rgba(255,59,92,1)" }, { backgroundColor: "rgba(122,134,153,0.08)", borderLeftColor: "rgba(122,134,153,0.6)", duration: 12 * F, ease: "power2.inOut", immediateRender: false }, 15.0);
      tl.fromTo(P + "-hotlab", { color: "#ff3b5c", textShadow: "0 0 18px rgba(255,59,92,0.6)" }, { color: "#7a8699", textShadow: "0 0 18px rgba(255,59,92,0)", duration: 12 * F, ease: "power2.inOut", immediateRender: false }, 15.0);
      aim(0, 0, 15.0, 30 * F);
      focus(410, 15.0);
      tl.fromTo(P + "-focus", { scaleX: 1 }, { scaleX: 1.9, duration: 30 * F, ease: "sine.inOut" }, 15.0);
      marker(P + "-mk-both", 15.5, "#3dffa2", "61,255,162");
      tl.fromTo(P + "-code .blind-rim", { opacity: 0 }, { opacity: 1, duration: 10 * F, ease: "power2.out" }, 15.5);
      tl.fromTo(P + "-site .blind-rim", { opacity: 0 }, { opacity: 1, duration: 10 * F, ease: "power2.out" }, 15.5);
      turn(P + "-code", 1, 4, 0, 15.0, 2.5);
      turn(P + "-site", -1, 3, 0, 15.0, 2.5);
      scan(P + "-scanA", 0, 660, 15.5, 1.5);
      scan(P + "-scanB", 0, 660, 15.5, 1.5);
      sheen(P + "-code", 15.5, true);
      sheen(P + "-site", 15.5, true);
      aim(0, 8, 16.5, 30 * F);

      tl.set({}, {}, DUR);
      window.__timelines = window.__timelines || {};
      window.__timelines["blind"] = tl;
    })();
  </script>
</template>
