  <script>
    (function () {
      const tl = gsap.timeline({ paused: true });
      const F = 1 / 30;
      const DUR = 12;
      const FILM_START = 0;

      // ---- shared world: floor grid and dust from FILM time (continuous across cuts)
      (function world(tl, id, FILM_START, DUR) {
        let s = 20261122;
        const rnd = () => { s |= 0; s = (s + 0x6d2b79f5) | 0; let t = Math.imul(s ^ (s >>> 15), 1 | s);
          t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
        const box = document.getElementById(id + "-dust");
        const dots = [];
        for (let k = 0; k < 54; k++) {
          const d = { x: rnd() * 1920, y: rnd() * 1180, z: 0.3 + rnd() * 0.7, ph: rnd() * 6.283 };
          const el = document.createElement("i");
          const size = 1 + d.z * 2;
          el.style.width = el.style.height = size + "px";
          el.style.opacity = (0.12 + d.z * 0.23).toFixed(3);
          box.appendChild(el); d.el = el; dots.push(d);
        }
        const floor = document.getElementById(id + "-floor");
        const draw = (T) => {
          if (floor) floor.style.backgroundPosition = "0px " + ((T * 40) % 80) + "px";
          for (const d of dots) {
            const y = ((d.y - T * 14 * d.z) % 1180 + 1180) % 1180 - 50;
            const x = d.x + Math.sin(T * 0.35 + d.ph) * 18 * d.z;
            d.el.style.transform = "translate(" + x.toFixed(1) + "px," + y.toFixed(1) + "px)";
          }
        };
        const p = { t: 0 };
        tl.fromTo(p, { t: 0 }, { t: DUR, duration: DUR, ease: "none", onUpdate: () => draw(FILM_START + p.t) }, 0);
        draw(FILM_START);
      })(tl, "hook", FILM_START, DUR);

      // ---- HUD label: types 1 char per frame, block cursor blinks on the beat, gone after 2 s
      (function hud(text, t0) {
        const te = document.getElementById("hook-hudt");
        const ce = document.getElementById("hook-hudc");
        const draw = (t) => {
          const f = Math.floor((t - t0) / F + 1e-4);
          te.textContent = text.slice(0, Math.max(0, Math.min(text.length, f + 1)));
          const on = t >= t0 && t < t0 + 2 && Math.floor((t - t0) / (15 * F) + 1e-4) % 2 === 0;
          ce.style.opacity = on ? "1" : "0";
        };
        const p = { t: 0 };
        tl.fromTo(p, { t: 0 }, { t: DUR, duration: DUR, ease: "none", onUpdate: () => draw(p.t) }, 0);
        draw(0);
      })("01 / THE QUESTION", 0);

      // ---- kinetic type
      function lineIn(sel, t) {
        tl.fromTo(sel + " > .hook-w", { yPercent: 120 }, { yPercent: 0, duration: 14 * F, ease: "power4.out", stagger: 2 * F }, t);
      }
      function lineOut(sel, end) {
        const n = document.querySelectorAll(sel + " > .hook-w").length;
        tl.fromTo(sel + " > .hook-w", { yPercent: 0 }, { yPercent: -120, duration: 8 * F, ease: "power2.in", stagger: F, immediateRender: false }, end - (8 + n) * F);
      }
      function mark(sel, t, hex, rgb) {
        tl.fromTo(sel, { color: "#eaf2f7", textShadow: "0 0 18px rgba(" + rgb + ",0)" },
          { color: hex, textShadow: "0 0 18px rgba(" + rgb + ",0.6)", duration: 8 * F, ease: "power2.out" }, t);
        tl.fromTo(sel + " .hook-ul", { scaleX: 0 }, { scaleX: 1, duration: 10 * F, ease: "power3.out" }, t);
      }
      function sheen(sel, t) {
        tl.fromTo(sel, { xPercent: -120 }, { xPercent: 380, duration: 18 * F, ease: "power2.inOut" }, t);
      }

      // ---- camera: slow push + re-targets (no "in": frame 0 is the app)
      tl.fromTo("#hook-rig", { scale: 1 }, { scale: 1.05, duration: DUR, ease: "sine.inOut" }, 0);
      let cx = 0, cy = 0;
      function cam(t, x, y, d) {
        tl.fromTo("#hook-rig", { x: cx, y: cy }, { x: x, y: y, duration: (d || 24) * F, ease: "power2.inOut", immediateRender: false }, t);
        cx = x; cy = y;
      }
      cam(0.5, 30, 24);    // the first line
      cam(3.0, 60, 8);     // "safe?"
      cam(5.5, 0, 14, 30); // the split: both halves and their labels
      cam(8.0, 44, 28);    // the question
      cam(10.0, 10, 12, 30); // settle on both halves

      // ---- scene out (v7): camera scale up, content fades, green scan line sweeps the frame
      tl.fromTo("#hook-cam", { scale: 1 }, { scale: 1.15, duration: 12 * F, ease: "power2.in", immediateRender: false }, DUR - 12 * F);
      tl.fromTo("#hook-cam", { opacity: 1 }, { opacity: 0, duration: 6 * F, ease: "power2.in", immediateRender: false }, DUR - 6 * F);
      tl.fromTo("#hook-xscan", { y: -60 }, { y: 1090, duration: 8 * F, ease: "power2.in" }, DUR - 8 * F);

      // ---- the app in 3D: one plane (both halves share the app's centre as origin), turning toward camera
      const P = 1600;
      gsap.set("#hook-L", { transformPerspective: P, transformOrigin: "100% 50%" });
      gsap.set("#hook-R", { transformPerspective: P, transformOrigin: "0% 50%" });
      tl.fromTo(["#hook-L", "#hook-R"], { rotationY: -13, rotationX: 7 }, { rotationY: -4, rotationX: 3, duration: 5.0, ease: "sine.inOut" }, 0);
      sheen("#hook-sheenL", 0);
      sheen("#hook-sheenR", 9 * F);

      // the app works: two tasks tick on the beat
      tl.fromTo(".hook-t2", { scale: 0, opacity: 0 }, { scale: 1, opacity: 1, duration: 12 * F, ease: "back.out(2.2)" }, 1.5);
      tl.fromTo(".hook-t3", { scale: 0, opacity: 0 }, { scale: 1, opacity: 1, duration: 12 * F, ease: "back.out(2.2)" }, 2.5);

      // ---- lines
      lineIn("#hook-l1", 0.5);
      lineOut("#hook-l1", 3.0);
      lineIn("#hook-l2", 3.0);
      mark("#hook-mk-safe", 4.0, "#3dffa2", "61,255,162");
      lineOut("#hook-l2", 8.0);
      lineIn("#hook-l3", 8.0);
      mark("#hook-mk-leak", 9.0, "#ff3b5c", "255,59,92");

      // ---- 5.0 a green seam draws down the middle; 5.5 (sound hit) the app splits
      tl.fromTo(["#hook-seamL", "#hook-seamR"], { scaleY: 0, opacity: 1 }, { scaleY: 1, duration: 15 * F, ease: "power3.inOut" }, 5.0);
      tl.fromTo(["#hook-seamL", "#hook-seamR"], { opacity: 1 }, { opacity: 0, duration: 18 * F, ease: "power2.out", immediateRender: false }, 5.6);
      tl.fromTo("#hook-L", { x: 0, rotationY: -4, rotationX: 3 }, { x: -140, rotationY: 9, rotationX: 4, duration: 24 * F, ease: "power2.inOut", immediateRender: false }, 5.5);
      tl.fromTo("#hook-R", { x: 0, rotationY: -4, rotationX: 3 }, { x: 140, rotationY: -9, rotationX: 4, duration: 24 * F, ease: "power2.inOut", immediateRender: false }, 5.5);
      tl.fromTo("#hook-L", { borderTopRightRadius: 0, borderBottomRightRadius: 0, borderRightColor: "rgba(61,255,162,0)" },
        { borderTopRightRadius: 14, borderBottomRightRadius: 14, borderRightColor: "rgba(61,255,162,0.16)", duration: 12 * F, ease: "power2.out" }, 5.5);
      tl.fromTo("#hook-R", { borderTopLeftRadius: 0, borderBottomLeftRadius: 0, borderLeftColor: "rgba(61,255,162,0)" },
        { borderTopLeftRadius: 14, borderBottomLeftRadius: 14, borderLeftColor: "rgba(61,255,162,0.16)", duration: 12 * F, ease: "power2.out" }, 5.5);
      // then the halves keep turning slowly toward camera
      tl.fromTo("#hook-L", { rotationY: 9 }, { rotationY: 5, duration: DUR - 6.3, ease: "sine.inOut", immediateRender: false }, 6.3);
      tl.fromTo("#hook-R", { rotationY: -9 }, { rotationY: -5, duration: DUR - 6.3, ease: "sine.inOut", immediateRender: false }, 6.3);

      // ---- 6.0 a scan line runs down each half: the left becomes THE CODE, the right re-lays as a browser
      function rebuild(layer, scan, t) {
        tl.fromTo(layer, { clipPath: "inset(0% 0% 100% 0%)" }, { clipPath: "inset(0% 0% 0% 0%)", duration: 24 * F, ease: "power2.inOut" }, t);
        tl.fromTo(scan, { y: -42, opacity: 1 }, { y: 640, duration: 24 * F, ease: "power2.inOut" }, t);
        tl.fromTo(scan, { opacity: 1 }, { opacity: 0, duration: 4 * F, ease: "power2.in", immediateRender: false }, t + 22 * F);
      }
      rebuild("#hook-tree", "#hook-scanL", 6.0);
      rebuild("#hook-mini", "#hook-scanR", 6.0);
      tl.fromTo("#hook-tree .hook-trow", { opacity: 0.25 }, { opacity: 1, duration: 8 * F, ease: "power2.out", stagger: 2 * F }, 6.1);
      sheen("#hook-sheenL", 7.0);
      sheen("#hook-sheenR", 7.0 + 6 * F);

      // labels under each half
      lineIn("#hook-lab-code", 6.5);
      lineIn("#hook-lab-site", 7.0);
      // 10.0: a quiet pulse on the beat along both rims
      tl.fromTo(["#hook-L", "#hook-R"], { borderColor: "rgba(61,255,162,0.16)" }, { borderColor: "rgba(61,255,162,0.45)", duration: 6 * F, ease: "power2.out", yoyo: true, repeat: 1, immediateRender: false }, 10.0);

      tl.set({}, {}, DUR);
      window.__timelines = window.__timelines || {};
      window.__timelines["hook"] = tl;
    })();
  </script>
</template>
