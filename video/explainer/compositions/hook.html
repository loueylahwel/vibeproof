  <script>
    (function () {
      const tl = gsap.timeline({ paused: true });
      const F = 1 / 30;
      const D = 12;
      const CAM = "#hook-cam";
      const SHUT = "inset(0% 100% 0% 0%)";
      const OPEN = "inset(0% 0% 0% 0%)";
      function wipeIn(sel, t) {
        tl.fromTo(sel, { clipPath: SHUT }, { clipPath: OPEN, duration: 0.6, ease: "power3.out" }, t);
      }
      // kinetic type: words rise through the line's mask, leave upward
      function lineIn(sel, t) {
        tl.fromTo(sel + " .hook-w", { yPercent: 110 }, { yPercent: 0, duration: 14 * F, ease: "power4.out", stagger: 2 * F }, t);
      }
      function lineOut(sel, end) {
        const n = document.querySelectorAll(sel + " .hook-w").length;
        tl.fromTo(sel + " .hook-w", { yPercent: 0 }, { yPercent: -110, duration: 8 * F, ease: "power2.in", stagger: F, immediateRender: false }, end - (8 + n) * F);
      }
      function marker(sel, t) {
        tl.fromTo(sel + " .hook-mbar", { scaleX: 0, transformOrigin: "0% 50%" }, { scaleX: 1, duration: 10 * F, ease: "power3.out" }, t);
        tl.fromTo(sel, { color: "#0a0a0a" }, { color: "#ffffff", duration: 6 * F, ease: "power2.out" }, t + 2 * F);
      }

      // camera: slow push and a re-target at each beat; no incoming move (frame 0 is the app)
      tl.fromTo(CAM, { scale: 1 }, { scale: 1.06, duration: D, ease: "sine.inOut" }, 0);
      let cx = 0, cy = 0;
      function cam(t, x, y) {
        tl.fromTo(CAM, { x: cx, y: cy }, { x: x, y: y, duration: 20 * F, ease: "power2.inOut", immediateRender: false }, t);
        cx = x; cy = y;
      }
      cam(0.4, 30, 40);   // the first line
      cam(3.0, 70, 10);   // "safe?"
      cam(5.4, 0, -30);   // the split, both halves and their labels
      cam(8.0, 50, 40);   // the question
      cam(10.0, 0, 0);    // settle on both halves
      tl.fromTo(CAM, { x: cx }, { x: -420, duration: 10 * F, ease: "power4.in", immediateRender: false }, D - 10 * F);

      // 0.4 / 3.0 / 8.0: display lines
      lineIn("#hook-l1", 0.4);
      lineOut("#hook-l1", 3.0);
      lineIn("#hook-l2", 3.0);
      marker("#hook-mk-safe", 3.62);
      lineOut("#hook-l2", 8.0);
      lineIn("#hook-l3", 8.0);
      marker("#hook-mk-leak", 8.66);

      // 5.4: the app splits down the middle (hero move, power2.inOut, 24 f)
      tl.fromTo("#hook-app", { opacity: 1 }, { opacity: 0, duration: 0.01 }, 5.4);
      tl.fromTo(["#hook-left", "#hook-right"], { opacity: 0 }, { opacity: 1, duration: 0.01 }, 5.4);
      tl.fromTo("#hook-left", { x: 0, borderRadius: "10px 0px 0px 10px" }, { x: -140, borderRadius: "10px 10px 10px 10px", duration: 0.8, ease: "power2.inOut" }, 5.4);
      tl.fromTo("#hook-right", { x: 0, borderRadius: "0px 10px 10px 0px" }, { x: 140, borderRadius: "10px 10px 10px 10px", duration: 0.8, ease: "power2.inOut" }, 5.4);
      // the left half's ground floods to CODE dark from the seam outwards; the right stays white
      tl.fromTo("#hook-dark", { scaleX: 0, transformOrigin: "100% 50%" }, { scaleX: 1, duration: 0.8, ease: "power2.inOut" }, 5.4);
      tl.fromTo("#hook-left", { borderColor: "#0a0a0a" }, { borderColor: "#2c2c30", duration: 0.6, ease: "power2.inOut" }, 5.7);

      // left half turns into THE CODE (dark panel), right half re-lays as a browser
      wipeIn("#hook-tree", 5.9);
      wipeIn("#hook-mini", 6.1);
      tl.fromTo("#hook-left-old", { opacity: 1 }, { opacity: 0, duration: 0.01 }, 6.55);
      tl.fromTo("#hook-right-old", { opacity: 1 }, { opacity: 0, duration: 0.01 }, 6.75);
      // each half lands with a small overshoot settle
      tl.fromTo("#hook-left", { y: 0 }, { y: -8, duration: 6 * F, ease: "power2.out", immediateRender: false }, 6.2);
      tl.fromTo("#hook-left", { y: -8 }, { y: 0, duration: 10 * F, ease: "power2.inOut", immediateRender: false }, 6.4);
      tl.fromTo("#hook-right", { y: 0 }, { y: -8, duration: 6 * F, ease: "power2.out", immediateRender: false }, 6.3);
      tl.fromTo("#hook-right", { y: -8 }, { y: 0, duration: 10 * F, ease: "power2.inOut", immediateRender: false }, 6.5);

      // labels under each half
      lineIn("#hook-lab-code", 5.8);
      lineIn("#hook-lab-site", 6.0);

      tl.set({}, {}, D);
      window.__timelines = window.__timelines || {};
      window.__timelines["hook"] = tl;
    })();
