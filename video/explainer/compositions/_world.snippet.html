<!--
  v7 shared "world" (ground glow, floor grid, dust). NOT a scene: copy it into each scene
  template, replacing SCENE with the scene id (e.g. "code") and FILM_START with the scene's
  film start in seconds (hook 0, stack 12, code 30, site 56, blind 82, repodemo 100,
  webdemo 132, safety 164, results 180, end 210). The grid and the dust are computed from FILM
  time, so they continue seamlessly across scene cuts. Put the world elements first inside
  #root (behind everything) and keep them OUT of the camera wrapper and out of the scene fades.
  Product scenes (repodemo, webdemo) leave out the floor grid (omit SCENE-floor).
-->
<style>
  #SCENE-ground { position: absolute; inset: 0; background: #05060a; }
  #SCENE-glow { position: absolute; inset: 0;
    background: radial-gradient(ellipse 60% 55% at 50% 45%, rgba(61,255,162,0.07), transparent 70%); }
  #SCENE-floor-wrap { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px;
    perspective: 900px; perspective-origin: 50% 30%; overflow: hidden; }
  #SCENE-floor { position: absolute; left: -1200px; width: 4320px; top: 560px; height: 1400px;
    transform-origin: 50% 0%; transform: rotateX(72deg);
    background-image:
      linear-gradient(to right, rgba(61,255,162,0.10) 1px, transparent 1px),
      linear-gradient(to bottom, rgba(61,255,162,0.10) 1px, transparent 1px);
    background-size: 80px 80px;
    -webkit-mask-image: linear-gradient(to bottom, transparent 0%, #000 30%, #000 100%);
            mask-image: linear-gradient(to bottom, transparent 0%, #000 30%, #000 100%); }
  #SCENE-dust { position: absolute; inset: 0; }
  #SCENE-dust i { position: absolute; left: 0; top: 0; border-radius: 50%; background: #eaf2f7; }
  #SCENE-vignette { position: absolute; inset: 0; pointer-events: none;
    background: radial-gradient(ellipse at center, transparent 55%, rgba(0,0,0,0.6)); }
</style>

<div id="SCENE-ground"></div>
<div id="SCENE-glow"></div>
<div id="SCENE-floor-wrap"><div id="SCENE-floor"></div></div>
<div id="SCENE-dust"></div>
<!-- ... the scene's camera wrapper and content go here ... -->
<div id="SCENE-vignette"></div>

<script>
  // inside the scene's IIFE, after `const tl = gsap.timeline({ paused: true })` and with DUR set:
  (function world(tl, id, FILM_START, DUR) {
    let s = 20261122; // fixed seed: every scene builds the identical dust field
    const rnd = () => { s |= 0; s = (s + 0x6d2b79f5) | 0; let t = Math.imul(s ^ (s >>> 15), 1 | s);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
    const box = document.getElementById(id + "-dust");
    const dots = [];
    for (let k = 0; k < 54; k++) {
      const d = { x: rnd() * 1920, y: rnd() * 1180, z: 0.3 + rnd() * 0.7, ph: rnd() * 6.283 };
      const el = document.createElement("i");
      const size = 1 + d.z * 2;
      el.style.width = el.style.height = size + "px";
      el.style.opacity = (0.12 + d.z * 0.23).toFixed(3);
      box.appendChild(el); d.el = el; dots.push(d);
    }
    const floor = document.getElementById(id + "-floor");
    const draw = (T) => { // T = film time in seconds
      if (floor) floor.style.backgroundPosition = "0px " + ((T * 40) % 80) + "px"; // one cell per bar
      for (const d of dots) {
        const y = ((d.y - T * 14 * d.z) % 1180 + 1180) % 1180 - 50;
        const x = d.x + Math.sin(T * 0.35 + d.ph) * 18 * d.z;
        d.el.style.transform = "translate(" + x.toFixed(1) + "px," + y.toFixed(1) + "px)";
      }
    };
    const p = { t: 0 };
    tl.fromTo(p, { t: 0 }, { t: DUR, duration: DUR, ease: "none", onUpdate: () => draw(FILM_START + p.t) }, 0);
    draw(FILM_START);
  })(tl, "SCENE", FILM_START, DUR);
</script>
