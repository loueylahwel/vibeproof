  <script>
    (function () {
      window.__timelines = window.__timelines || {};
      const ID = "webdemo";
      const DUR = 32;
      const FILM_START = 132;
      const F = 1 / 30;
      const tl = gsap.timeline({ paused: true });
      const $ = (s) => document.getElementById(ID + "-" + s);

      // ---------------------------------------------------------------- world: dust drifting with film time (shared seed)
      (function world(tl, id, FILM_START, DUR) {
        let s = 20261122;
        const rnd = () => { s |= 0; s = (s + 0x6d2b79f5) | 0; let t = Math.imul(s ^ (s >>> 15), 1 | s);
          t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
        const box = document.getElementById(id + "-dust");
        const dots = [];
        for (let k = 0; k < 54; k++) {
          const d = { x: rnd() * 1920, y: rnd() * 1180, z: 0.3 + rnd() * 0.7, ph: rnd() * 6.283 };
          const el = document.createElement("i");
          const size = 1 + d.z * 2;
          el.style.width = el.style.height = size + "px";
          el.style.opacity = (0.12 + d.z * 0.23).toFixed(3);
          box.appendChild(el); d.el = el; dots.push(d);
        }
        const floor = document.getElementById(id + "-floor");
        const draw = (T) => {
          if (floor) floor.style.backgroundPosition = "0px " + ((T * 40) % 80) + "px";
          for (const d of dots) {
            const y = ((d.y - T * 14 * d.z) % 1180 + 1180) % 1180 - 50;
            const x = d.x + Math.sin(T * 0.35 + d.ph) * 18 * d.z;
            d.el.style.transform = "translate(" + x.toFixed(1) + "px," + y.toFixed(1) + "px)";
          }
        };
        const p = { t: 0 };
        tl.fromTo(p, { t: 0 }, { t: DUR, duration: DUR, ease: "none", onUpdate: () => draw(FILM_START + p.t) }, 0);
        draw(FILM_START);
      })(tl, "webdemo", FILM_START, DUR);

      // ---------------------------------------------------------------- keyframe tracks (pure functions of time)
      function track(init) {
        const tr = { init: Object.assign({}, init), keys: [], last: Object.assign({}, init) };
        tr.to = function (t, d, ease, to) {
          const end = Object.assign({}, tr.last, to);
          tr.keys.push({ t: t, d: d, e: gsap.parseEase(ease || "power2.inOut"), from: tr.last, end: end });
          tr.last = end;
          return tr;
        };
        tr.jump = function (t, delta) {
          const end = Object.assign({}, tr.last);
          Object.keys(delta).forEach((k) => (end[k] += delta[k]));
          tr.keys.push({ t: t, d: 0, e: null, from: tr.last, end: end });
          tr.last = end;
          return tr;
        };
        tr.at = function (T) {
          let st = tr.init;
          for (const k of tr.keys) {
            if (T >= k.t + k.d) { st = k.end; continue; }
            if (T > k.t) {
              const p = k.e((T - k.t) / k.d);
              const o = {};
              Object.keys(k.end).forEach((n) => {
                const a = k.from[n], b = k.end[n];
                o[n] = n === "s" ? a * Math.pow(b / a, p) : a + (b - a) * p;
              });
              return o;
            }
            break;
          }
          return st;
        };
        return tr;
      }
      function transformOf(c) {
        const rot = Math.abs(c.ry) < 0.001 && Math.abs(c.rx) < 0.001 ? "" : " rotateY(" + c.ry.toFixed(3) + "deg) rotateX(" + c.rx.toFixed(3) + "deg)";
        return "translate(" + c.qx.toFixed(2) + "px," + c.qy.toFixed(2) + "px) scale(" + c.s.toFixed(4) + ")" + rot +
          " translate(" + (-c.fx).toFixed(2) + "px," + (-c.fy).toFixed(2) + "px)";
      }

      // Camera: screen point (fx, fy) lands on frame point (qx, qy) at scale s, turned by ry/rx around it.
      // Flat (ry = rx = 0) for every punch-in, so the text is sharp.
      const REST = { fx: 960, fy: 540, qx: 960, qy: 528, s: 0.82, ry: -10, rx: 6 };
      const cam = track(REST);
      const cur = track({ x: 1400, y: 760, k: 1 });
      // the PDF board has its own camera (same model)
      const BREST = { fx: 980, fy: 540, qx: 960, qy: 500, s: 0.86, ry: -9, rx: 5 };
      const bcam = track({ fx: 980, fy: 540, qx: 960, qy: 520, s: 0.7, ry: -14, rx: 8 });

      const screen = $("screen"), board = $("board"), cursorEl = $("cursor");
      function apply(T) {
        const c = cam.at(T);
        screen.style.transform = transformOf(c);
        const m = cur.at(T);
        cursorEl.style.transform = "translate(" + m.x.toFixed(2) + "px," + m.y.toFixed(2) + "px) scale(" + (m.k / c.s).toFixed(4) + ")";
        board.style.transform = transformOf(bcam.at(T));
      }

      // ---------------------------------------------------------------- the story (scene-local seconds, on the beat grid)
      // 0.0 verify: the whole floating screen, the verify panel lights up at 1.0
      cam.to(0, 2.0, "sine.inOut", { ry: -7, rx: 4.5, s: 0.84 });
      // 2.0 punch-in 1.0 -> 2.0 on the verify panel (left sidebar), flat
      cam.to(2.0, 1.0, "power2.inOut", { fx: 160, fy: 340, qx: 1000, qy: 440, s: 2.0, ry: 0, rx: 0 });
      cam.to(4.0, 1.0, "power2.inOut", { fy: 470, qy: 450 });               // down to "Not verified"
      // 6.0 DNS TXT and File rows
      cam.to(6.0, 1.0, "power2.inOut", { fx: 160, fy: 400, qx: 1000, qy: 440, s: 2.1 });
      cam.to(8.0, 1.0, "power2.inOut", { fy: 380, s: 2.15 });
      // 10.0 back to the floating screen; 11.0 the live scan report arrives and is read top to bottom
      cam.to(10.0, 1.0, "power2.inOut", { fx: 960, fy: 540, qx: 960, qy: 528, s: 0.84, ry: -8, rx: 5 });
      // 12.0 flat onto the critical finding
      cam.to(12.0, 1.0, "power2.inOut", { fx: 1120, fy: 470, qx: 960, qy: 430, s: 1.62, ry: 0, rx: 0 });
      cam.to(15.0, 1.0, "power2.inOut", { fx: 1100, fy: 490, s: 1.66 });   // lean toward "Table readable"
      // 17.5 the finding opens (its row moves up 233 px on the real screen: keep it still), then punch in
      cam.jump(17.5, { fy: -233 });
      cam.to(18.0, 1.0, "power2.inOut", { fx: 1092, fy: 410, qx: 960, qy: 430, s: 1.9 });
      cam.to(20.5, 1.0, "power2.inOut", { fy: 466, qy: 440, s: 2.15 });    // along the evidence
      // 22.5 back to the floating screen, 24.0 it hands over to the PDF report
      cam.to(22.5, 1.0, "power2.inOut", { fx: 960, fy: 540, qx: 960, qy: 528, s: 0.84, ry: -8, rx: 5 });
      cam.to(24.0, 0.4, "power2.in", { s: 0.7, qy: 520, ry: -12, rx: 7 });
      tl.to(screen, { opacity: 0, duration: 8 * F, ease: "power2.in" }, 24.0);

      // the PDF report
      tl.fromTo(board, { opacity: 0 }, { opacity: 1, duration: 8 * F, ease: "power2.out" }, 24.0);
      bcam.to(24.0, 0.6, "expo.out", BREST);
      bcam.to(24.6, 2.4, "sine.inOut", { ry: -6, rx: 3.5, s: 0.88 });        // slow turn toward camera
      // 27.0 page 2 slides over page 1; 28.0 flat and in on its executive summary; 30.0 down to the priority actions
      tl.fromTo($("sheet-2"), { x: 1300 }, { x: -12, duration: 20 * F, ease: "power3.out" }, 27.0);
      tl.to($("sheet-2"), { x: 0, duration: 6 * F, ease: "power2.out" }, 27.0 + 20 * F);
      bcam.to(28.0, 1.0, "power2.inOut", { fx: 1180, fy: 330, qx: 960, qy: 430, s: 2.0, ry: 0, rx: 0 });
      bcam.to(30.0, 1.0, "power2.inOut", { fy: 390, qy: 440, s: 2.05 });
      tl.fromTo($("ssweep-1"), { xPercent: -110 }, { xPercent: 260, duration: 18 * F, ease: "power2.inOut" }, 24.5);
      tl.fromTo($("ssweep-2"), { xPercent: -110 }, { xPercent: 260, duration: 18 * F, ease: "power2.inOut" }, 27.5);

      // cursor (screen coordinates): onto the critical row, then down to "Table readable", click opens it at 17.5
      cur.to(14.5, 0.5, "power2.out", { x: 980, y: 440 });
      cur.to(16.0, 0.5, "power2.inOut", { x: 800, y: 540 });
      cur.to(17.5 - 2 * F, 2 * F, "power2.out", { k: 0.85 });
      cur.to(17.5, 2 * F, "power2.out", { k: 1 });
      cur.jump(17.5, { y: -233 });
      cur.to(18.0, 0.5, "power2.inOut", { x: 1560, y: 480 });
      tl.fromTo(cursorEl, { opacity: 0 }, { opacity: 1, duration: 6 * F, ease: "none" }, 14.5);
      tl.to(cursorEl, { opacity: 0, duration: 8 * F, ease: "none" }, 18.0);

      const drive = { t: 0 };
      tl.fromTo(drive, { t: 0 }, { t: DUR, duration: DUR, ease: "none", onUpdate: () => apply(drive.t) }, 0);
      apply(0);

      // ---------------------------------------------------------------- screen details
      tl.fromTo($("sweep"), { xPercent: -110 }, { xPercent: 360, duration: 18 * F, ease: "power2.inOut" }, 0.3);
      function hlIn(sel, at) {
        tl.fromTo($(sel), { opacity: 0, scale: 1.06 }, { opacity: 1, scale: 1, duration: 12 * F, ease: "expo.out" }, at);
      }
      function hlOut(sel, at) {
        tl.to($(sel), { opacity: 0, duration: 8 * F, ease: "power3.in" }, at - 8 * F);
      }
      function hlMove(sel, at, box) {
        tl.to($(sel), { left: box[0], top: box[1], width: box[2], height: box[3], duration: 14 * F, ease: "power3.inOut" }, at);
      }
      // the verify panel -> its heading -> "Not verified" -> the DNS TXT row; then the File row too
      hlIn("hl-a", 1.0);
      hlMove("hl-a", 3.0, [24, 205, 271, 81]);
      hlMove("hl-a", 4.5, [24, 521, 271, 108]);
      hlMove("hl-a", 6.5, [24, 420, 271, 90]);
      hlIn("hl-b", 8.0);
      hlOut("hl-a", 10.5);
      hlOut("hl-b", 10.5);
      hlIn("hl-crit", 13.0);
      hlOut("hl-crit", 17.5);
      hlIn("hl-ev", 19.5);
      hlOut("hl-ev", 23.0);
      tl.fromTo($("ripple-1"), { scale: 0.2, opacity: 1 }, { scale: 1.6, opacity: 0, duration: 20 * F, ease: "power2.out" }, 17.5);
      // 11.0 Vibeproof reads the live site: the scan line sweeps the new report top to bottom
      tl.fromTo($("scan-site"), { y: 0 }, { y: 1122, duration: 1.0, ease: "sine.inOut" }, 11.0);

      // ---------------------------------------------------------------- HUD chapter label
      const HUD = "07 / DEMO: A LIVE SITE";
      const hud = $("hud");
      const hp = { t: 0 };
      const drawHud = () => {
        const fr = Math.floor(hp.t * 30 + 1e-6);
        const n = Math.min(HUD.length, fr);
        const on = hp.t < 2 && Math.floor(fr / 15) % 2 === 0;
        hud.innerHTML = HUD.slice(0, n) + (on ? "<b></b>" : "");
      };
      tl.fromTo(hp, { t: 0 }, { t: 3, duration: 3, ease: "none", onUpdate: drawHud }, 0);
      drawHud();
      tl.to(hud, { opacity: 0, duration: 10 * F, ease: "power3.in" }, 2.0);

      // ---------------------------------------------------------------- captions
      const capBox = $("caps");
      function caption(n, t0, t1, words, key) {
        const wrap = document.createElement("div");
        wrap.className = "clip webdemo-cap";
        wrap.id = ID + "-cap-" + n;
        wrap.setAttribute("data-start", String(t0));
        wrap.setAttribute("data-duration", String(t1 - t0));
        const line = document.createElement("div");
        line.className = "webdemo-line";
        words.split(" ").forEach((w, i) => {
          if (i) line.appendChild(document.createTextNode(" "));
          const sp = document.createElement("span");
          sp.className = "webdemo-w";
          const bare = w.replace(/[,.]$/, "");
          if (bare === key) {
            const k = document.createElement("span");
            k.className = "webdemo-key";
            k.textContent = bare;
            const bar = document.createElement("span");
            bar.className = "webdemo-bar";
            sp.appendChild(k);
            sp.appendChild(bar);
            if (w !== bare) sp.appendChild(document.createTextNode(w.slice(bare.length)));
          } else sp.textContent = w;
          line.appendChild(sp);
        });
        wrap.appendChild(line);
        capBox.appendChild(wrap);
        const ws = line.querySelectorAll(".webdemo-w");
        tl.fromTo(ws, { yPercent: 135 }, { yPercent: 0, duration: 14 * F, ease: "power4.out", stagger: 2 * F }, t0);
        const mk = t0 + 0.5;
        const kEl = line.querySelector(".webdemo-key");
        tl.fromTo(kEl, { color: "#ffffff", textShadow: "0 2px 14px rgba(0,0,0,0.75)" },
          { color: "#3dffa2", textShadow: "0 0 18px rgba(61,255,162,0.6)", duration: 8 * F, ease: "power2.out" }, mk);
        tl.fromTo(line.querySelector(".webdemo-bar"), { scaleX: 0 }, { scaleX: 1, duration: 10 * F, ease: "power3.out" }, mk);
        if (t1 < DUR) {
          tl.fromTo(ws, { yPercent: 0 }, { yPercent: -135, duration: 8 * F, ease: "power2.in", stagger: 1 * F, immediateRender: false },
            t1 - (8 + ws.length - 1) * F);
        }
      }
      caption(1, 0, 6, "Live scans need proof you own the site", "proof");
      caption(2, 6, 11, "Publish a token in your DNS, or as a file", "token");
      caption(3, 11, 17.5, "Then it scans the live site, read-only", "read-only");
      caption(4, 17.5, 24, "The todos table answered the public key", "answered");
      caption(5, 24, 32, "Every scan ends in a PDF report", "PDF");

      // ---------------------------------------------------------------- v7 transitions
      const camEl = [$("cam"), $("top")];
      tl.fromTo(camEl, { scale: 0.94 }, { scale: 1, duration: 16 * F, ease: "expo.out" }, 0);
      tl.fromTo(camEl, { opacity: 0 }, { opacity: 1, duration: 6 * F, ease: "none" }, 0);
      tl.fromTo(camEl, { scale: 1 }, { scale: 1.15, duration: 12 * F, ease: "power2.in", immediateRender: false }, DUR - 12 * F);
      tl.fromTo(camEl, { opacity: 1 }, { opacity: 0, duration: 6 * F, ease: "power2.in", immediateRender: false }, DUR - 6 * F);
      tl.fromTo($("wipe"), { y: -82 }, { y: 1080, duration: 8 * F, ease: "power1.in" }, DUR - 8 * F);

      tl.set({}, {}, DUR);
      window.__timelines["webdemo"] = tl;
    })();
  </script>
</template>
