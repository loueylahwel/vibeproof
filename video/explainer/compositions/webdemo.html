  <script>
    (function () {
      window.__timelines = window.__timelines || {};
      const F = 1 / 30; // one frame
      const tl = gsap.timeline({ paused: true });
      const sineIO = gsap.parseEase("sine.inOut");

      // ---------------------------------------------------------------- helpers
      // Each shot: camera (x, y, scale, origin 0 0) > drift (scale 1 -> 1.03 around o, sine.inOut over the shot).
      // A screen point P lands in the frame at cam.s * (o + d * (P - o)) + (cam.x, cam.y).
      const DRIFT = 0.03;
      const G = {
        v: { t0: 0, t1: 11, o: [160, 450] }, // verify panel
        r: { t0: 11, t1: 17.5, o: [800, 536] }, // "Table readable" finding (click target)
        f: { t0: 17.5, t1: 24, o: [1091, 465] }, // evidence box
      };
      function drift(g, t) {
        const p = Math.min(1, Math.max(0, (t - g.t0) / (g.t1 - g.t0)));
        return 1 + DRIFT * sineIO(p);
      }
      function frameOf(g, cam, P, t) {
        const k = drift(g, t);
        return [cam.s * (g.o[0] + k * (P[0] - g.o[0])) + cam.x, cam.s * (g.o[1] + k * (P[1] - g.o[1])) + cam.y];
      }
      function settleFrom(P) {
        return { x: P[0] * (1 - 1.04), y: P[1] * (1 - 1.04), s: 1.04 };
      }
      const seen = {};
      function camTo(sel, at, from, to, frames, ease) {
        const first = !seen[sel];
        seen[sel] = true;
        tl.fromTo(sel, { x: from.x, y: from.y, scale: from.s }, { x: to.x, y: to.y, scale: to.s, duration: frames * F, ease: ease, immediateRender: first }, at);
      }
      Object.keys(G).forEach(function (k) {
        const g = G[k];
        const o = g.o[0] + "px " + g.o[1] + "px";
        tl.fromTo("#webdemo-drift-" + k, { scale: 1, transformOrigin: o }, { scale: 1 + DRIFT, transformOrigin: o, duration: g.t1 - g.t0, ease: "sine.inOut" }, g.t0);
      });

      function whipIn(t) {
        tl.fromTo("#webdemo-scene", { x: 420 }, { x: 0, duration: 12 * F, ease: "power4.out", immediateRender: t === 0 }, t);
      }
      function whipOut(t) {
        tl.fromTo("#webdemo-scene", { x: 0 }, { x: -420, duration: 10 * F, ease: "power4.in", immediateRender: false }, t - 10 * F);
      }
      function slam(sel, at) {
        tl.fromTo(sel, { scale: 1.45, opacity: 0 }, { scale: 1, opacity: 1, duration: 9 * F, ease: "power4.out" }, at);
      }

      function caption(n, t0, t1) {
        const sel = "#webdemo-cap-" + n + "-t .webdemo-w";
        const nW = document.querySelectorAll(sel).length || 8;
        tl.fromTo(sel, { yPercent: 110 }, { yPercent: 0, duration: 14 * F, ease: "power4.out", stagger: 2 * F }, t0);
        const mk = t0 + ((nW - 1) * 2 + 10) * F;
        tl.fromTo("#webdemo-mk-" + n + "-bar", { scaleX: 0 }, { scaleX: 1, duration: 10 * F, ease: "power3.out" }, mk);
        tl.fromTo("#webdemo-mk-" + n + "-t", { color: "#ffffff" }, { color: "#0a0a0a", duration: 6 * F, ease: "power2.out" }, mk + 2 * F);
        if (t1 !== null) {
          tl.fromTo(sel, { yPercent: 0 }, { yPercent: -110, duration: 8 * F, ease: "power2.in", stagger: 1 * F, immediateRender: false }, t1 - (8 + (nW - 1) + 1) * F);
        }
      }
      caption(1, 0, 6);
      caption(2, 6, 11);
      caption(3, 11, 17.5);
      caption(4, 17.5, 24);
      caption(5, 24, null);

      // ---------------------------------------------------------------- 0.0 verify (shot V)
      whipIn(0);
      const V0 = { x: 0, y: 0, s: 1 };
      const V1 = { x: 0, y: -300, s: 1.8 }; // punch-in 1.0 -> 1.8 on the verify panel
      const V2 = { x: -30, y: -400, s: 1.8 }; // re-target to "Not verified"
      const V3 = { x: 0, y: -350, s: 1.8 }; // to the DNS TXT row
      const V4 = { x: -20, y: -280, s: 1.8 }; // to the File row
      camTo("#webdemo-cam-v", 0.5, V0, V1, 60, "sine.inOut");
      camTo("#webdemo-cam-v", 3.6, V1, V2, 20, "power2.inOut");
      // 6.0: the DNS TXT row, then the File row (the caption names DNS first)
      camTo("#webdemo-cam-v", 6.1, V2, V3, 20, "power2.inOut");
      slam("#webdemo-hl-dns-box", 6.2);
      camTo("#webdemo-cam-v", 8.1, V3, V4, 20, "power2.inOut");
      slam("#webdemo-hl-file-box", 8.2);
      whipOut(11);

      // ---------------------------------------------------------------- 11.0 report-web (shot R): velocity-matched cut
      whipIn(11);
      const R0 = { x: 0, y: 0, s: 1 };
      const R1 = { x: -384, y: -60, s: 1.2 }; // toward the critical finding
      const R2 = { x: -400, y: -130, s: 1.25 }; // toward the high finding the cursor opens
      camTo("#webdemo-cam-r", 11.3, R0, R1, 20, "power2.inOut");
      slam("#webdemo-hl-crit-box", 11.6);
      camTo("#webdemo-cam-r", 13.8, R1, R2, 20, "power2.inOut");
      // cursor lands on the critical row, then moves down to "Table readable" and clicks (17.367): cut 17.5
      const pCrit = frameOf(G.r, R2, [960, 438], 15.3);
      const pTable = frameOf(G.r, R2, [800, 536], 17.1);
      tl.fromTo("#webdemo-arrow-1", { x: pCrit[0] + 240, y: pCrit[1] + 330, scale: 1 }, { x: pCrit[0], y: pCrit[1], scale: 1, duration: 24 * F, ease: "power2.inOut" }, 14.5);
      tl.fromTo("#webdemo-arrow-1", { opacity: 0 }, { opacity: 1, duration: 6 * F, ease: "none" }, 14.5);
      tl.fromTo("#webdemo-arrow-1", { x: pCrit[0], y: pCrit[1] }, { x: pTable[0], y: pTable[1], duration: 21 * F, ease: "power2.inOut", immediateRender: false }, 16.4);
      tl.fromTo("#webdemo-arrow-1", { scale: 1 }, { scale: 0.85, duration: 2 * F, ease: "power2.out", immediateRender: false }, 17.5 - 4 * F);
      tl.fromTo("#webdemo-arrow-1", { scale: 0.85 }, { scale: 1, duration: 2 * F, ease: "power2.out", immediateRender: false }, 17.5 - 2 * F);

      // ---------------------------------------------------------------- 17.5 finding-web (shot F): match cut on the click
      const F0 = settleFrom([800, 536]);
      const F1 = { x: 0, y: 0, s: 1 };
      const F2 = { x: -1056, y: -389, s: 1.8 }; // punch-in on the open finding
      const F3 = { x: -1100, y: -450, s: 1.8 }; // re-target to the evidence
      const F4 = { x: -1140, y: -470, s: 1.8 }; // along it: the exposed columns
      camTo("#webdemo-cam-f", 17.5, F0, F1, 12, "power4.out");
      camTo("#webdemo-cam-f", 17.9, F1, F2, 66, "sine.inOut");
      camTo("#webdemo-cam-f", 20.4, F2, F3, 20, "power2.inOut");
      slam("#webdemo-hl-evidence-box", 20.6);
      camTo("#webdemo-cam-f", 22.2, F3, F4, 20, "power2.inOut");
      whipOut(24);

      // ---------------------------------------------------------------- 24.0 paper: the PDF report (velocity-matched cut)
      whipIn(24);
      // the first page lands slightly large and settles; page 2 slides over it at 27.0 and settles
      tl.fromTo("#webdemo-sheet-1-wrap", { scale: 1.04 }, { scale: 1, duration: 18 * F, ease: "power3.out" }, 24.0);
      tl.fromTo("#webdemo-sheet-2-wrap", { x: 1200 }, { x: -10, duration: 20 * F, ease: "power3.out" }, 27.0);
      tl.fromTo("#webdemo-sheet-2-wrap", { x: -10 }, { x: 0, duration: 4 * F, ease: "power2.out", immediateRender: false }, 27.0 + 20 * F);
      const P0 = { x: 0, y: 0, s: 1 };
      const P1 = { x: -40, y: -20, s: 1.04 }; // toward page 1's title
      const P2 = { x: -160, y: -20, s: 1.08 }; // follow page 2 in
      const P3 = { x: -430, y: 20, s: 1.35 }; // punch-in on the executive summary
      const P4 = { x: -430, y: -90, s: 1.35 }; // down to the priority actions
      camTo("#webdemo-cam-p", 25.6, P0, P1, 20, "power2.inOut");
      camTo("#webdemo-cam-p", 27.2, P1, P2, 20, "power2.inOut");
      camTo("#webdemo-cam-p", 28.8, P2, P3, 30, "sine.inOut");
      camTo("#webdemo-cam-p", 30.4, P3, P4, 20, "power2.inOut");
      whipOut(32);

      // hold to the scene's end (32 s)
      tl.set({}, {}, 32);
      window.__timelines["webdemo"] = tl;
    })();
  </script>
