  <script>
    (function () {
      window.__timelines = window.__timelines || {};
      const F = 1 / 30; // one frame
      const tl = gsap.timeline({ paused: true });

      // ---- captions: wipe in (power3.out 18 f), wipe out (power2.in 12 f) just before the next one
      const caps = [
        ["#repodemo-cap-1-t", 0, 3.5],
        ["#repodemo-cap-2-t", 3.5, 7.5],
        ["#repodemo-cap-3-t", 7.5, 12.5],
        ["#repodemo-cap-4-t", 12.5, 18],
        ["#repodemo-cap-5-t", 18, 24],
        ["#repodemo-cap-6-t", 24, null],
      ];
      caps.forEach(function (c) {
        const inAt = c[1];
        tl.fromTo(c[0], { clipPath: "inset(0% 100% 0% 0%)" }, { clipPath: "inset(0% 0% 0% 0%)", duration: 18 * F, ease: "power3.out" }, inAt);
        if (c[2] !== null) {
          tl.fromTo(c[0], { clipPath: "inset(0% 0% 0% 0%)" }, { clipPath: "inset(0% 0% 0% 100%)", duration: 12 * F, ease: "power2.in", immediateRender: false }, c[2] - 12 * F);
        }
      });

      // ---- cursor helper: move (power2.inOut), click = scale 0.85 for 4 frames
      function arrive(sel, at, from, to, frames) {
        tl.fromTo(sel, { x: from[0], y: from[1], scale: 1 }, { x: to[0], y: to[1], scale: 1, duration: frames * F, ease: "power2.inOut" }, at);
        tl.fromTo(sel, { opacity: 0 }, { opacity: 1, duration: 6 * F, ease: "none" }, at);
      }
      function move(sel, at, from, to, frames) {
        tl.fromTo(sel, { x: from[0], y: from[1] }, { x: to[0], y: to[1], duration: frames * F, ease: "power2.inOut", immediateRender: false }, at);
      }
      function click(sel, at) {
        tl.fromTo(sel, { scale: 1 }, { scale: 0.85, duration: 2 * F, ease: "power2.out", immediateRender: false }, at);
        tl.fromTo(sel, { scale: 0.85 }, { scale: 1, duration: 2 * F, ease: "power2.out", immediateRender: false }, at + 2 * F);
      }

      // ---- 3.5 typed: cursor to the input, then to Scan; click 7.367, cut 7.5
      arrive("#repodemo-arrow-1", 3.8, [560, 430], [190, 116], 21);
      move("#repodemo-arrow-1", 6.6, [190, 116], [252, 168], 18);
      click("#repodemo-arrow-1", 7.5 - 4 * F);

      // ---- 7.5 scanning: punch-in 1.0 -> 1.6 on the progress card (sine.inOut 60 f)
      tl.fromTo("#repodemo-cam-scanning", { x: 0, y: 0, scale: 1 }, { x: -832, y: 0, scale: 1.6, duration: 60 * F, ease: "sine.inOut" }, 7.8);

      // ---- 12.5 report: highlight the 4-finding list
      tl.fromTo("#repodemo-hl-list-rect", { strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: 18 * F, ease: "power3.out" }, 13.0);
      // cursor clicks the first finding (17.867), which opens it: cut 18.0
      arrive("#repodemo-arrow-2", 16.8, [1120, 780], [780, 437], 21);
      click("#repodemo-arrow-2", 18 - 4 * F);

      // ---- 18.0 open finding: punch-in on the expanded card (1.8, sine.inOut 66 f)
      tl.fromTo("#repodemo-cam-finding", { x: 0, y: 0, scale: 1 }, { x: -1056, y: -541, scale: 1.8, duration: 66 * F, ease: "sine.inOut" }, 18.2);
      // cursor clicks "Preview" (23.867), which opens the prompt: cut 24.0
      arrive("#repodemo-arrow-3", 22.6, [860, 900], [522, 678], 21);
      click("#repodemo-arrow-3", 24 - 4 * F);

      // ---- 24.0 prompt: punch-in on the prompt preview (2.0, sine.inOut 60 f)
      tl.fromTo("#repodemo-cam-prompt", { x: 0, y: 0, scale: 1 }, { x: -1223, y: -548, scale: 2.0, duration: 60 * F, ease: "sine.inOut" }, 24.2);
      // cursor to "Copy fix prompt", click at 28.0
      arrive("#repodemo-arrow-4", 26.8, [760, 640], [282, 122], 24);
      click("#repodemo-arrow-4", 28.0);
      // toast slides in from the right edge after the click
      tl.fromTo("#repodemo-toast-box", { x: 420 }, { x: 0, duration: 18 * F, ease: "power3.out" }, 28.1);

      // hold to the scene's end (32 s)
      tl.set({}, {}, 32);
      window.__timelines["repodemo"] = tl;
    })();
  </script>
