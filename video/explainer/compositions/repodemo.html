  <script>
    (function () {
      window.__timelines = window.__timelines || {};
      const ID = "repodemo";
      const DUR = 32;
      const FILM_START = 100;
      const F = 1 / 30;
      const tl = gsap.timeline({ paused: true });
      const $ = (s) => document.getElementById(ID + "-" + s);

      // ---------------------------------------------------------------- world: dust drifting with film time (shared seed)
      (function world(tl, id, FILM_START, DUR) {
        let s = 20261122;
        const rnd = () => { s |= 0; s = (s + 0x6d2b79f5) | 0; let t = Math.imul(s ^ (s >>> 15), 1 | s);
          t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
        const box = document.getElementById(id + "-dust");
        const dots = [];
        for (let k = 0; k < 54; k++) {
          const d = { x: rnd() * 1920, y: rnd() * 1180, z: 0.3 + rnd() * 0.7, ph: rnd() * 6.283 };
          const el = document.createElement("i");
          const size = 1 + d.z * 2;
          el.style.width = el.style.height = size + "px";
          el.style.opacity = (0.12 + d.z * 0.23).toFixed(3);
          box.appendChild(el); d.el = el; dots.push(d);
        }
        const floor = document.getElementById(id + "-floor");
        const draw = (T) => {
          if (floor) floor.style.backgroundPosition = "0px " + ((T * 40) % 80) + "px";
          for (const d of dots) {
            const y = ((d.y - T * 14 * d.z) % 1180 + 1180) % 1180 - 50;
            const x = d.x + Math.sin(T * 0.35 + d.ph) * 18 * d.z;
            d.el.style.transform = "translate(" + x.toFixed(1) + "px," + y.toFixed(1) + "px)";
          }
        };
        const p = { t: 0 };
        tl.fromTo(p, { t: 0 }, { t: DUR, duration: DUR, ease: "none", onUpdate: () => draw(FILM_START + p.t) }, 0);
        draw(FILM_START);
      })(tl, "repodemo", FILM_START, DUR);

      // ---------------------------------------------------------------- keyframe tracks (pure functions of time)
      // A track is a list of segments built in time order; each holds the absolute end state.
      function track(init) {
        const tr = { init: Object.assign({}, init), keys: [], last: Object.assign({}, init) };
        tr.to = function (t, d, ease, to) {
          const end = Object.assign({}, tr.last, to);
          tr.keys.push({ t: t, d: d, e: gsap.parseEase(ease || "power2.inOut"), from: tr.last, end: end });
          tr.last = end;
          return tr;
        };
        tr.jump = function (t, delta) { // instantaneous relative change
          const end = Object.assign({}, tr.last);
          Object.keys(delta).forEach((k) => (end[k] += delta[k]));
          tr.keys.push({ t: t, d: 0, e: null, from: tr.last, end: end });
          tr.last = end;
          return tr;
        };
        tr.at = function (T) {
          let st = tr.init;
          for (const k of tr.keys) {
            if (T >= k.t + k.d) { st = k.end; continue; }
            if (T > k.t) {
              const p = k.e((T - k.t) / k.d);
              const o = {};
              Object.keys(k.end).forEach((n) => {
                const a = k.from[n], b = k.end[n];
                o[n] = n === "s" ? a * Math.pow(b / a, p) : a + (b - a) * p;
              });
              return o;
            }
            break;
          }
          return st;
        };
        return tr;
      }

      // Camera on the screen: screen point (fx, fy) lands on frame point (qx, qy) at scale s, the screen turned
      // by ry/rx degrees around that point (perspective 2000 px). Flat when ry = rx = 0, so text is sharp.
      const REST = { fx: 960, fy: 540, qx: 960, qy: 528, s: 0.82, ry: -10, rx: 6 };
      const cam = track(REST);
      // the cursor, in screen coordinates; k = click squeeze
      const cur = track({ x: 900, y: 560, k: 1 });

      const screen = $("screen");
      const cursorEl = $("cursor");
      function apply(T) {
        const c = cam.at(T);
        const rot = Math.abs(c.ry) < 0.001 && Math.abs(c.rx) < 0.001 ? "" : " rotateY(" + c.ry.toFixed(3) + "deg) rotateX(" + c.rx.toFixed(3) + "deg)";
        screen.style.transform = "translate(" + c.qx.toFixed(2) + "px," + c.qy.toFixed(2) + "px) scale(" + c.s.toFixed(4) + ")" + rot +
          " translate(" + (-c.fx).toFixed(2) + "px," + (-c.fy).toFixed(2) + "px)";
        const m = cur.at(T);
        cursorEl.style.transform = "translate(" + m.x.toFixed(2) + "px," + m.y.toFixed(2) + "px) scale(" + (m.k / c.s).toFixed(4) + ")";
      }

      // ---------------------------------------------------------------- the story (scene-local seconds, on the beat grid)
      // 0.0 welcome: the whole app on its floating screen, slowly turning toward camera
      cam.to(0, 3.5, "sine.inOut", { ry: -6, rx: 4, s: 0.84 });
      // 3.5 typed: turn flat and punch in on the sidebar input
      cam.to(3.5, 1.0, "power2.inOut", { fx: 160, fy: 128, qx: 960, qy: 430, s: 2.3, ry: 0, rx: 0 });
      cam.to(5.5, 1.0, "power2.inOut", { fy: 140, qy: 440, s: 2.4 });        // re-target toward Scan
      // 7.5 click Scan -> scanning: swoop out (tilted) and in onto the progress card
      cam.to(7.5, 1.0, "power2.inOut", { fx: 900, fy: 420, qx: 960, qy: 520, s: 1.05, ry: -7, rx: 4 });
      cam.to(8.5, 1.0, "power2.inOut", { fx: 1120, fy: 262, qx: 960, qy: 440, s: 2.0, ry: 0, rx: 0 });
      cam.to(10.5, 1.0, "power2.inOut", { fy: 290, qy: 450, s: 2.1 });      // onto the stages
      // 12.5 report: pull back (tilted), then flat onto the findings, grouped by severity
      cam.to(12.5, 1.0, "power2.inOut", { fx: 1000, fy: 500, qx: 960, qy: 516, s: 0.92, ry: -8, rx: 5 });
      cam.to(14.0, 1.0, "power2.inOut", { fx: 1120, fy: 470, qx: 960, qy: 430, s: 1.62, ry: 0, rx: 0 });
      cam.to(16.0, 1.0, "power2.inOut", { fx: 1090, fy: 470, s: 1.68 });   // lean toward the first finding
      // 18.0 the first finding opens (its row moves up 37 px on the real screen: keep it still)
      cam.jump(18.0, { fy: -37 });
      cam.to(18.5, 1.0, "power2.inOut", { fx: 1092, fy: 540, qx: 960, qy: 450, s: 1.9 });
      cam.to(21.5, 1.0, "power2.inOut", { fy: 590, qy: 460, s: 1.95 });    // down to how to fix and its buttons
      // 24.0 the prompt preview opens (the page scrolls 342 px: keep the buttons still), then read the prompt
      cam.jump(24.0, { fy: -342 });
      cam.to(24.5, 1.0, "power2.inOut", { fx: 1092, fy: 512, qx: 960, qy: 440, s: 1.9 });
      cam.to(29.0, 1.0, "sine.inOut", { fy: 520, s: 1.96 });
      // 30.0 back to the floating screen for the cut
      cam.to(30.0, 1.5, "power2.inOut", { fx: 960, fy: 540, qx: 960, qy: 528, s: 0.82, ry: -10, rx: 6 });

      // cursor (screen coordinates): to the input, then to Scan, click at 7.5 (sound)
      cur.to(3.5, 0.5, "power2.out", { x: 178, y: 122 });                      // arrives on the input as it focuses
      cur.to(6.0, 0.5, "power2.inOut", { x: 262, y: 170 });                    // onto Scan
      cur.to(7.5 - 2 * F, 2 * F, "power2.out", { k: 0.85 });
      cur.to(7.5, 2 * F, "power2.out", { k: 1 });                               // click: 7.5 s exactly
      cur.to(9.0, 0.5, "power2.inOut", { x: 1250, y: 420 });                   // out of the way of the card
      // report: onto the first finding, click opens it at 18.0
      cur.to(16.5, 0.5, "power2.inOut", { x: 790, y: 440 });
      cur.to(18.0 - 2 * F, 2 * F, "power2.out", { k: 0.85 });
      cur.to(18.0, 2 * F, "power2.out", { k: 1 });
      cur.jump(18.0, { y: -37 });
      cur.to(19.0, 0.5, "power2.inOut", { x: 1540, y: 470 });                  // aside while we read
      cur.to(23.0, 0.5, "power2.inOut", { x: 868, y: 680 });                   // onto "Preview"
      cur.to(24.0 - 2 * F, 2 * F, "power2.out", { k: 0.85 });
      cur.to(24.0, 2 * F, "power2.out", { k: 1 });
      cur.jump(24.0, { y: -342 });
      cur.to(25.0, 0.5, "power2.inOut", { x: 1540, y: 300 });                  // aside while the prompt is read
      cur.to(27.0, 0.5, "power2.inOut", { x: 752, y: 338 });                   // onto "Copy fix prompt"
      cur.to(28.0 - 2 * F, 2 * F, "power2.out", { k: 0.85 });
      cur.to(28.0, 2 * F, "power2.out", { k: 1 });                              // click: 28.0 s exactly
      tl.fromTo(cursorEl, { opacity: 0 }, { opacity: 1, duration: 6 * F, ease: "none" }, 3.5);
      tl.to(cursorEl, { opacity: 0, duration: 6 * F, ease: "none" }, 9.0);
      tl.to(cursorEl, { opacity: 1, duration: 6 * F, ease: "none" }, 16.5);
      tl.to(cursorEl, { opacity: 0, duration: 6 * F, ease: "none" }, 19.0);
      tl.to(cursorEl, { opacity: 1, duration: 6 * F, ease: "none" }, 23.0);
      tl.to(cursorEl, { opacity: 0, duration: 6 * F, ease: "none" }, 25.0);
      tl.to(cursorEl, { opacity: 1, duration: 6 * F, ease: "none" }, 27.0);
      tl.to(cursorEl, { opacity: 0, duration: 8 * F, ease: "none" }, 30.0);

      const drive = { t: 0 };
      tl.fromTo(drive, { t: 0 }, { t: DUR, duration: DUR, ease: "none", onUpdate: () => apply(drive.t) }, 0);
      apply(0);

      // ---------------------------------------------------------------- screen details
      // light sweep as the screen appears
      tl.fromTo($("sweep"), { xPercent: -110 }, { xPercent: 360, duration: 18 * F, ease: "power2.inOut" }, 0.3);
      // typing "~/projects/taskflow" (19 characters) 4.0 -> 5.0, then the "Local folder" hint appears
      const NCH = 19, CW = 123 / NCH;
      const typing = { n: 0 };
      const cover = $("typecover"), caret = $("caret");
      tl.fromTo(typing, { n: 0 }, { n: NCH, duration: 1.0, ease: "steps(" + NCH + ")", onUpdate: () => {
        cover.style.left = (53 + typing.n * CW).toFixed(2) + "px";
        cover.style.width = (182 - typing.n * CW).toFixed(2) + "px";
      } }, 4.0);
      tl.fromTo(caret, { opacity: 1 }, { opacity: 0, duration: 0.25, ease: "steps(1)", repeat: 7, yoyo: true }, 5.0);
      tl.fromTo($("labelcover"), { opacity: 1 }, { opacity: 0, duration: 8 * F, ease: "power2.out" }, 5.5);

      // highlights: a soft slam in (scale 1.06 -> 1, expo.out) and a glow pulse on later beats
      function hlIn(sel, at) {
        tl.fromTo($(sel), { opacity: 0, scale: 1.06 }, { opacity: 1, scale: 1, duration: 12 * F, ease: "expo.out" }, at);
      }
      function hlOut(sel, at) {
        tl.to($(sel), { opacity: 0, duration: 8 * F, ease: "power3.in" }, at - 8 * F);
      }
      function hlMove(sel, at, box) {
        tl.to($(sel), { left: box[0], top: box[1], width: box[2], height: box[3], duration: 14 * F, ease: "power3.inOut" }, at);
      }
      hlIn("hl-scan", 6.5);
      hlOut("hl-scan", 8.0);
      hlIn("hl-stages", 10.5);
      hlOut("hl-stages", 12.5);
      hlIn("hl-list", 15.0);
      hlOut("hl-list", 18.0);
      // the open finding: why it matters -> the evidence -> how to fix
      hlIn("hl-open", 19.5);
      hlMove("hl-open", 20.5, [656, 504, 870, 78]);
      hlMove("hl-open", 21.5, [656, 584, 870, 132]);
      hlOut("hl-open", 24.0);
      // the prompt, then the "Copy fix prompt" button at the click
      hlIn("hl-prompt", 25.5);
      hlMove("hl-prompt", 28.0, [676, 318, 140, 32]);
      hlOut("hl-prompt", 31.0);
      // click ripples
      ["ripple-1", "ripple-2"].forEach((r) => {
        tl.fromTo($(r), { scale: 0.2, opacity: 1 }, { scale: 1.6, opacity: 0, duration: 20 * F, ease: "power2.out" }, r === "ripple-1" ? 7.5 : 28.0);
      });
      // Vibeproof reading the scan card: the scan line sweeps down it
      tl.fromTo($("scan-card"), { y: 0 }, { y: 276, duration: 1.5, ease: "sine.inOut" }, 9.5);
      // toast "Prompt copied" slides in right after the click
      tl.fromTo($("toast-box"), { x: 60, opacity: 0, scale: 0.96 }, { x: 0, opacity: 1, scale: 1, duration: 16 * F, ease: "expo.out" }, 28.0 + 2 * F);

      // ---------------------------------------------------------------- HUD chapter label
      const HUD = "06 / DEMO: A REPOSITORY";
      const hud = $("hud");
      const hp = { t: 0 };
      const drawHud = () => {
        const fr = Math.floor(hp.t * 30 + 1e-6);
        const n = Math.min(HUD.length, fr);
        const on = hp.t < 2 && Math.floor(fr / 15) % 2 === 0;
        hud.innerHTML = HUD.slice(0, n) + (on ? "<b></b>" : "");
      };
      tl.fromTo(hp, { t: 0 }, { t: 3.5, duration: 3.5, ease: "none", onUpdate: drawHud }, 0);
      drawHud();
      tl.to(hud, { opacity: 0, duration: 10 * F, ease: "power3.in" }, 3.0);

      // ---------------------------------------------------------------- captions
      const capBox = $("caps");
      function caption(n, t0, t1, words, key) {
        const wrap = document.createElement("div");
        wrap.className = "clip repodemo-cap";
        wrap.id = ID + "-cap-" + n;
        wrap.setAttribute("data-start", String(t0));
        wrap.setAttribute("data-duration", String(t1 - t0));
        const line = document.createElement("div");
        line.className = "repodemo-line";
        words.split(" ").forEach((w, i) => {
          if (i) line.appendChild(document.createTextNode(" "));
          const sp = document.createElement("span");
          sp.className = "repodemo-w";
          const bare = w.replace(/[,.]$/, "");
          if (bare === key) {
            const k = document.createElement("span");
            k.className = "repodemo-key";
            k.textContent = bare;
            const bar = document.createElement("span");
            bar.className = "repodemo-bar";
            sp.appendChild(k);
            sp.appendChild(bar);
            if (w !== bare) sp.appendChild(document.createTextNode(w.slice(bare.length)));
          } else sp.textContent = w;
          line.appendChild(sp);
        });
        wrap.appendChild(line);
        capBox.appendChild(wrap);
        const ws = line.querySelectorAll(".repodemo-w");
        tl.fromTo(ws, { yPercent: 135 }, { yPercent: 0, duration: 14 * F, ease: "power4.out", stagger: 2 * F }, t0);
        const mk = t0 + 0.5;
        const kEl = line.querySelector(".repodemo-key");
        tl.fromTo(kEl, { color: "#ffffff", textShadow: "0 2px 14px rgba(0,0,0,0.75)" },
          { color: "#3dffa2", textShadow: "0 0 18px rgba(61,255,162,0.6)", duration: 8 * F, ease: "power2.out" }, mk);
        tl.fromTo(line.querySelector(".repodemo-bar"), { scaleX: 0 }, { scaleX: 1, duration: 10 * F, ease: "power3.out" }, mk);
        if (t1 < DUR) {
          tl.fromTo(ws, { yPercent: 0 }, { yPercent: -135, duration: 8 * F, ease: "power2.in", stagger: 1 * F, immediateRender: false },
            t1 - (8 + ws.length - 1) * F);
        }
      }
      caption(1, 0, 3.5, "Vibeproof runs on your computer, in the browser", "computer");
      caption(2, 3.5, 7.5, "Paste a repo link, a folder or a website", "repo");
      caption(3, 7.5, 12.5, "It shows each stage as it runs", "stage");
      caption(4, 12.5, 18, "Every finding, grouped by severity", "severity");
      caption(5, 18, 24, "Why it matters, the evidence, how to fix it", "fix");
      caption(6, 24, 32, "A prompt to paste into your coding agent", "prompt");

      // ---------------------------------------------------------------- v7 transitions
      const camEl = [$("cam"), $("top")];
      // in: scale 0.94 -> 1 (expo.out, 16 f), content fades in over 6 f
      tl.fromTo(camEl, { scale: 0.94 }, { scale: 1, duration: 16 * F, ease: "expo.out" }, 0);
      tl.fromTo(camEl, { opacity: 0 }, { opacity: 1, duration: 6 * F, ease: "none" }, 0);
      // out: scale 1 -> 1.15 over the last 12 f, fade over the last 6 f, green scan line over the last 8 f
      tl.fromTo(camEl, { scale: 1 }, { scale: 1.15, duration: 12 * F, ease: "power2.in", immediateRender: false }, DUR - 12 * F);
      tl.fromTo(camEl, { opacity: 1 }, { opacity: 0, duration: 6 * F, ease: "power2.in", immediateRender: false }, DUR - 6 * F);
      tl.fromTo($("wipe"), { y: -82 }, { y: 1080, duration: 8 * F, ease: "power1.in" }, DUR - 8 * F);

      tl.set({}, {}, DUR);
      window.__timelines["repodemo"] = tl;
    })();
  </script>
</template>
