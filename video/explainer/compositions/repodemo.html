    (function () {
      window.__timelines = window.__timelines || {};
      const F = 1 / 30; // one frame
      const tl = gsap.timeline({ paused: true });
      const sineIO = gsap.parseEase("sine.inOut");

      // ---------------------------------------------------------------- helpers
      // Each shot: camera (x, y, scale, origin 0 0) > drift (scale 1 -> 1.03 around o, sine.inOut over the shot).
      // A screen point P (1920x1080 layout of the screenshot) lands in the frame at
      // cam.s * (o + d * (P - o)) + (cam.x, cam.y). The cursors use this so they sit on the real buttons.
      const DRIFT = 0.03;
      const G = {
        a: { t0: 0, t1: 7.5, o: [258, 164] }, // Scan button
        b: { t0: 7.5, t1: 12.5, o: [1120, 260] }, // progress card
        c: { t0: 12.5, t1: 18, o: [780, 437] }, // first finding (click target)
        d: { t0: 18, t1: 24, o: [877, 677] }, // "Preview" (click target)
        e: { t0: 24, t1: 32, o: [752, 335] }, // "Copy fix prompt" (click target)
      };
      function drift(g, t) {
        const p = Math.min(1, Math.max(0, (t - g.t0) / (g.t1 - g.t0)));
        return 1 + DRIFT * sineIO(p);
      }
      function frameOf(g, cam, P, t) {
        const k = drift(g, t);
        return [cam.s * (g.o[0] + k * (P[0] - g.o[0])) + cam.x, cam.s * (g.o[1] + k * (P[1] - g.o[1])) + cam.y];
      }
      // camera state that starts "slightly large" around a click point and settles (match cut on a click)
      function settleFrom(P) {
        return { x: P[0] * (1 - 1.04), y: P[1] * (1 - 1.04), s: 1.04 };
      }
      const seen = {};
      function camTo(sel, at, from, to, frames, ease) {
        const first = !seen[sel];
        seen[sel] = true;
        tl.fromTo(sel, { x: from.x, y: from.y, scale: from.s }, { x: to.x, y: to.y, scale: to.s, duration: frames * F, ease: ease, immediateRender: first }, at);
      }
      Object.keys(G).forEach(function (k) {
        const g = G[k];
        const o = g.o[0] + "px " + g.o[1] + "px";
        tl.fromTo("#repodemo-drift-" + k, { scale: 1, transformOrigin: o }, { scale: 1 + DRIFT, transformOrigin: o, duration: g.t1 - g.t0, ease: "sine.inOut" }, g.t0);
      });

      // velocity-matched cuts on the scene camera: out = -420 px in 10 f power4.in, in = from +420 px in 12 f power4.out
      function whipIn(t) {
        tl.fromTo("#repodemo-scene", { x: 420 }, { x: 0, duration: 18 * F, ease: "expo.out", immediateRender: t === 0 }, t);
      }
      function whipOut(t) {
        tl.fromTo("#repodemo-scene", { x: 0 }, { x: -420, duration: 10 * F, ease: "power3.in", immediateRender: false }, t - 10 * F);
      }

      // slam: scale 1.45 -> 1, power4.out, 9 f
      function slam(sel, at) {
        tl.fromTo(sel, { scale: 1.45, opacity: 0 }, { scale: 1, opacity: 1, duration: 9 * F, ease: "power4.out" }, at);
      }

      // cursor: move power2.inOut, click = scale 0.85 for 4 frames
      function arrive(sel, at, from, to, frames) {
        tl.fromTo(sel, { x: from[0], y: from[1], scale: 1 }, { x: to[0], y: to[1], scale: 1, duration: frames * F, ease: "power2.inOut" }, at);
        tl.fromTo(sel, { opacity: 0 }, { opacity: 1, duration: 6 * F, ease: "none" }, at);
      }
      function move(sel, at, from, to, frames, ease) {
        tl.fromTo(sel, { x: from[0], y: from[1] }, { x: to[0], y: to[1], duration: frames * F, ease: ease || "power2.inOut", immediateRender: false }, at);
      }
      function click(sel, at) {
        tl.fromTo(sel, { scale: 1 }, { scale: 0.85, duration: 2 * F, ease: "power2.out", immediateRender: false }, at);
        tl.fromTo(sel, { scale: 0.85 }, { scale: 1, duration: 2 * F, ease: "power2.out", immediateRender: false }, at + 2 * F);
      }

      // captions: words rise from the mask (power4.out 14 f, 2 f stagger), one key word gets the white marker,
      // the line leaves upward through the mask (power2.in 8 f, 1 f stagger) just before the next caption
      function caption(n, t0, t1) {
        const sel = "#repodemo-cap-" + n + "-t .repodemo-w";
        const nW = document.querySelectorAll(sel).length || 8;
        tl.fromTo(sel, { yPercent: 110 }, { yPercent: 0, duration: 14 * F, ease: "power4.out", stagger: 2 * F }, t0);
        const mk = t0 + ((nW - 1) * 2 + 10) * F;
        tl.fromTo("#repodemo-mk-" + n + "-bar", { scaleX: 0 }, { scaleX: 1, duration: 10 * F, ease: "power3.out" }, mk);
        tl.fromTo("#repodemo-mk-" + n + "-t", { color: "#ffffff" }, { color: "#0a0a0a", duration: 6 * F, ease: "power2.out" }, mk + 2 * F);
        if (t1 !== null) {
          tl.fromTo(sel, { yPercent: 0 }, { yPercent: -110, duration: 8 * F, ease: "power2.in", stagger: 1 * F, immediateRender: false }, t1 - (8 + (nW - 1) + 1) * F);
        }
      }
      caption(1, 0, 3.5);
      caption(2, 3.5, 7.5);
      caption(3, 7.5, 12.5);
      caption(4, 12.5, 18);
      caption(5, 18, 24);
      caption(6, 24, null);

      // ---------------------------------------------------------------- 0.0 welcome -> 3.5 typed (shot A)
      whipIn(0);
      const A0 = { x: 0, y: 0, s: 1 };
      const A1 = { x: 0, y: 0, s: 1.15 }; // drift toward the sidebar
      const A2 = { x: 0, y: 0, s: 1.45 }; // re-target onto the input as the link is in
      camTo("#repodemo-cam-a", 1.6, A0, A1, 20, "power2.inOut");
      camTo("#repodemo-cam-a", 3.5, A1, A2, 20, "power2.inOut");
      // cursor to the input, then to Scan; click 7.367, cut 7.5
      const pInput = frameOf(G.a, A2, [190, 116], 4.5);
      const pScan = frameOf(G.a, A2, [252, 168], 7.2);
      arrive("#repodemo-arrow-1", 3.8, [760, 640], pInput, 21);
      move("#repodemo-arrow-1", 6.6, pInput, pScan, 18);
      click("#repodemo-arrow-1", 7.5 - 4 * F);

      // ---------------------------------------------------------------- 7.5 scanning (shot B): match cut on the click
      const B0 = settleFrom([258, 164]);
      const B1 = { x: 0, y: 0, s: 1 };
      const B2 = { x: -832, y: 0, s: 1.6 }; // punch-in 1.0 -> 1.6 on the progress card
      const B3 = { x: -792, y: -80, s: 1.6 }; // re-target to the running stage
      camTo("#repodemo-cam-b", 7.5, B0, B1, 12, "power4.out");
      camTo("#repodemo-cam-b", 7.9, B1, B2, 60, "sine.inOut");
      camTo("#repodemo-cam-b", 10.5, B2, B3, 20, "power2.inOut");
      whipOut(12.5);

      // ---------------------------------------------------------------- 12.5 report (shot C): velocity-matched cut
      whipIn(12.5);
      const C0 = { x: 0, y: 0, s: 1 };
      const C1 = { x: -384, y: -40, s: 1.2 }; // toward the findings list
      const C2 = { x: -330, y: -10, s: 1.2 }; // toward the first finding
      camTo("#repodemo-cam-c", 12.9, C0, C1, 20, "power2.inOut");
      slam("#repodemo-hl-list-box", 13.1);
      camTo("#repodemo-cam-c", 15.2, C1, C2, 20, "power2.inOut");
      // cursor clicks the first finding (17.867), which opens it: cut 18.0
      const pFinding = frameOf(G.c, C2, [780, 437], 17.5);
      arrive("#repodemo-arrow-2", 16.8, [pFinding[0] + 360, pFinding[1] + 330], pFinding, 21);
      click("#repodemo-arrow-2", 18 - 4 * F);

      // ---------------------------------------------------------------- 18.0 open finding (shot D): match cut on the click
      const D0 = settleFrom([780, 437]);
      const D1 = { x: 0, y: 0, s: 1 };
      const D2 = { x: -1056, y: -480, s: 1.8 }; // punch-in on the open card: why it matters, the evidence
      const D3 = { x: -1056, y: -560, s: 1.8 }; // re-target down to how to fix and its buttons
      camTo("#repodemo-cam-d", 18, D0, D1, 12, "power4.out");
      camTo("#repodemo-cam-d", 18.4, D1, D2, 66, "sine.inOut");
      camTo("#repodemo-cam-d", 21.0, D2, D3, 20, "power2.inOut");
      // cursor clicks "Preview" (23.3), which opens the prompt: whip 23.667 -> 24.0
      const pPreview = frameOf(G.d, D3, [877, 677], 23.0);
      arrive("#repodemo-arrow-3", 22.3, [pPreview[0] + 330, pPreview[1] + 230], pPreview, 21);
      click("#repodemo-arrow-3", 23.3);
      whipOut(24);

      // ---------------------------------------------------------------- 24.0 prompt (shot E): velocity-matched cut
      whipIn(24);
      const E0 = { x: 0, y: 0, s: 1 };
      const E1 = { x: -1223, y: -548, s: 2.0 }; // punch-in on the prompt preview
      const E2 = { x: -1223, y: -600, s: 2.0 }; // re-target down the prompt text
      const E3 = { x: -1290, y: -615, s: 2.0 }; // and along it
      camTo("#repodemo-cam-e", 24.4, E0, E1, 60, "sine.inOut");
      // cursor to "Copy fix prompt", click at 28.0
